# SonarCloud Configuration for HAL
#
# This file configures SonarCloud static analysis and coverage reporting.
# See: https://sonarcloud.io/organizations/edgefirstai

# Organization and project identification
sonar.organization=edgefirstai
sonar.projectKey=EdgeFirstAI_hal
sonar.projectName=EdgeFirst HAL

# Source code directories
# Rust crates (core library code) plus Python utility scripts exercised by tests
sonar.sources=crates,scripts

# Test directories (excluded from coverage metrics)
sonar.tests=tests
sonar.test.inclusions=**/*_test.rs,**/test_*.py,**/tests/**/*.py

# Coverage report paths (populated by CI workflow)
# Rust coverage (LCOV format from cargo-llvm-cov)
sonar.rust.lcov.reportPaths=coverage/coverage-x86_64/coverage_rust.lcov,coverage/coverage-aarch64/coverage_rust.lcov,coverage/coverage-macos/coverage_rust.lcov,coverage/coverage-windows/coverage_rust.lcov,coverage/coverage-software-gl/coverage_rust.lcov,coverage/coverage-imx8mp-processed/coverage_rust_imx8mp.lcov

# Python coverage (Cobertura XML format from pytest-cov/slipcover)
sonar.python.coverage.reportPaths=coverage/coverage-x86_64/coverage_python.xml,coverage/coverage-aarch64/coverage_python.xml,coverage/coverage-imx8mp/build/coverage_python.xml

# Language configuration
sonar.rust.edition=2024
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# Disable C/C++/Objective-C analysis.
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Exclusions (build artifacts, external code, generated files, C ABI/tests,
# C++ tooling, Python package manifests).
sonar.exclusions=**/target/**,**/build/**,**/venv/**,**/__pycache__/**,**/testdata/**,**/*.lock,**/*.c,**/*.h,**/*.cpp,**/pyproject.toml

# Coverage exclusions (dev tools, benchmarks and the Android-gated sources).
sonar.coverage.exclusions=**/benches/**/*.rs,crates/bench/**,crates/gpu-probe/**,crates/tensor/src/ahardwarebuffer.rs,crates/image/src/gl/ahardwarebuffer_import.rs,crates/image/src/gl/platform/android.rs,scripts/bench_compare.py,scripts/fetch-angle.sh,scripts/test-macos.sh,scripts/audit_f16_codegen.sh

# Rule exclusions: pythonsecurity:S8707 (path traversal from CLI arguments) on
# scripts/ and the crates' example scripts.
sonar.issue.ignore.multicriteria=argvpath,examplepath
sonar.issue.ignore.multicriteria.argvpath.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.argvpath.resourceKey=scripts/**/*.py
sonar.issue.ignore.multicriteria.examplepath.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.examplepath.resourceKey=crates/*/examples/**/*.py

# Quality gate settings: the scan does not wait for the quality gate.
sonar.qualitygate.wait=false

# SonarCloud host
sonar.host.url=https://sonarcloud.io
