# SonarCloud coverage upload. Called by ci.yml on a Full run (decorates the PR)
# and by nightly.yml (the `main` baseline). Both callers are required: without
# the nightly call, `main` has no baseline, because Full never runs on push to
# main in the label-driven model.
#
# Action Versions (hash-pinned):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c (v8.0.1)
# - SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f (v8.2.1)

name: SonarCloud

on:
  workflow_call:

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          pattern: coverage-*
          path: coverage/

      - name: Organize coverage files
        run: |
          set -euo pipefail
          echo "=== Downloaded coverage artifacts ==="
          find coverage/ -type f || true
          for xml in $(find coverage/ -name "coverage_python.xml" -type f); do
            python3 .github/scripts/fix_coverage_paths.py "$xml" tests
          done
          for lcov in $(find coverage/ -name "*.lcov" -type f); do
            sed -i -E '/^SF:/{s|\\|/|g; s|^SF:.*/work/hal/hal/|SF:|; s|^SF:[A-Za-z]:/a/hal/hal/|SF:|}' "$lcov"
          done
          RUST_REPORTS=$(find coverage/ -name "*.lcov" | tr '\n' ',' | sed 's/,$//')
          PYTHON_REPORTS=$(find coverage/ -name "coverage_python.xml" | tr '\n' ',' | sed 's/,$//')
          echo "Rust: ${RUST_REPORTS:-}"
          echo "Python: ${PYTHON_REPORTS:-}"
          echo "RUST_COVERAGE_PATHS=${RUST_REPORTS:-}" >> "$GITHUB_ENV"
          echo "PYTHON_COVERAGE_PATHS=${PYTHON_REPORTS:-}" >> "$GITHUB_ENV"

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            "-Dsonar.rust.lcov.reportPaths=${{ env.RUST_COVERAGE_PATHS }}"
            "-Dsonar.python.coverage.reportPaths=${{ env.PYTHON_COVERAGE_PATHS }}"
