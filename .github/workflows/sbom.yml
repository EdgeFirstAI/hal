# SBOM and license compliance, via the org's single policy copy.
#
# The policy scripts and the allowlist live in EdgeFirstAI/.github. hal used to
# carry its own generate_sbom.sh and check_license_policy.py, which meant the
# same repository enforced two different policies: the org copy through the
# Quick tier and the local copy here. They disagreed.
#
# Dependency-mode SBOM and license policy run in Quick (inside rust-quick).
# This workflow is the full scancode source scan, called from release.yml and
# available on demand.
#
# Shared workflows: EdgeFirstAI/.github @ cf505b2dbc5fd784a7acbf4ec8ca1e821c02dda3

name: SBOM Generation & License Compliance

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    uses: EdgeFirstAI/.github/.github/workflows/sbom.yml@cf505b2dbc5fd784a7acbf4ec8ca1e821c02dda3
    with:
      mode: full
      project-name: hal
      project-type: library
      version-file: Cargo.toml
      source-dirs: crates tests
      timeout-minutes: 20
      # release.yml downloads this name to attach the SBOM to the release.
      upload-name: sbom-${{ github.sha }}
