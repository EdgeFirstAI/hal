# SBOM and license compliance, using the policy scripts and allowlist in
# EdgeFirstAI/.github.
#
# The full scancode source scan, called from release.yml and available on
# demand. Dependency-mode SBOM and license policy run in Quick (inside
# rust-quick).
#
# Shared workflows: EdgeFirstAI/.github, pinned in the `uses:` lines below.

name: SBOM Generation & License Compliance

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    uses: EdgeFirstAI/.github/.github/workflows/sbom.yml@966df5c40680f6946896cb5e51542d5dde1bfa1a
    with:
      mode: full
      # The targets reaching a distributed artifact.
      targets: >-
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-pc-windows-msvc
        aarch64-apple-darwin
        x86_64-apple-darwin
        aarch64-apple-ios
        aarch64-apple-ios-sim
        aarch64-linux-android
        x86_64-linux-android
      # The C-API leaf manifests.
      extra-manifests: >-
        crates/tensor-capi/Cargo.toml
        crates/image-capi/Cargo.toml
        crates/codec-capi/Cargo.toml
        crates/decoder-capi/Cargo.toml
        crates/tracker-capi/Cargo.toml
        crates/kernels-capi/Cargo.toml
      project-name: hal
      project-type: library
      version-file: Cargo.toml
      source-dirs: crates tests
      timeout-minutes: 20
      # publish.yml downloads the artifact by this name.
      upload-name: sbom
      retention-days: "30"
