# GitHub Actions workflow for testing and code quality
#
# This workflow implements the Au-Zone SPS v2.3 testing patterns:
#   - Multi-platform coverage testing (x86_64, aarch64, macOS, Windows, on-target hardware)
#   - Parallel aarch64 testing: build-arm → test-arm + hardware-test in parallel
#   - Full coverage collection (Rust + Python) with profiling builds
#   - SonarCloud static analysis and coverage aggregation
#
# Build Configuration:
#   - Cargo profile: profiling (inherits release, optimized with debug symbols)
#   - Python bindings: Built with maturin develop using profiling profile
#   - Coverage: cargo-llvm-cov for Rust, slipcover for Python
#
# aarch64 Pipeline:
#   build-arm (compile + lint) → test-arm (runner tests) ──────────────┐
#                               → hardware-test (on-target tests) ─────┤→ process-hardware-coverage → sonarcloud
#
# Action Versions (hash-pinned per SPS v2.1):
# - actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd (v6.0.2)
# - actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 (v6.2.0)
# - actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
# - actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c (v8.0.1)
# - dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 (v1)
# - Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 (v2.9.1)
# - taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4 (v2.78.0)
# - SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 (v8.0.0)
# - EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 (v2.23.0)
# - ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 (v1.13.0)
#
# Runner Notes:
# - ubuntu-22.04: Standard GitHub-hosted runner, 4 vCPU (x86_64, used for I/O-bound
#   and aggregation jobs: checkout-lfs, sonarcloud)
# - ubuntu-22.04-xlarge: GitHub-hosted larger runner, 16 vCPU (x86_64 builds & tests)
# - ubuntu-22.04-arm-xlarge: GitHub ARM64 runner, 16 vCPU (aarch64 builds)
# - ubuntu-22.04-arm: GitHub ARM64 runner, 4 vCPU (aarch64 tests, coverage)
# - macos-latest: GitHub macOS runner (Apple Silicon)
# - nxp-imx8mp-latest: NXP i.MX 8M Plus EVK - test-only runner (NO toolchain)
#
# Build Strategy:
# - x86_64 and aarch64 builds happen on GitHub-hosted/managed runners
# - aarch64 build artifacts are shared between runner tests and hardware tests
# - imx8mp runner downloads aarch64 artifacts and runs tests only
# - Coverage processing happens on ubuntu-22.04-arm (same toolchain as build)
#
# Coverage Strategy:
# - Each platform runs tests independently and generates coverage
# - Coverage artifacts are uploaded from all platforms
# - Dedicated process job converts hardware coverage (gcda/profraw) to reports
# - SonarCloud job downloads and aggregates all coverage reports

name: Test

on:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - 'benchmarks/**'
      - 'BENCHMARKS_PLAN.md'
  pull_request:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - 'benchmarks/**'
      - 'BENCHMARKS_PLAN.md'
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHON_VERSION: '3.11'
  # Pin Rust toolchain versions to ensure profraw format compatibility across
  # jobs (build-arm produces instrumented binaries, process-hardware-coverage
  # merges profraw files — both must use the same LLVM version).
  RUST_STABLE_VERSION: '1.94.0'
  RUST_NIGHTLY_VERSION: 'nightly-2026-03-15'

jobs:
  # ===========================================================================
  # Checkout LFS files (on ubuntu-22.04 which has git-lfs)
  # ===========================================================================
  checkout-lfs:
    name: Checkout LFS Files
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code with LFS
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Upload testdata as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: testdata-lfs
          path: testdata/
          retention-days: 1

  # ===========================================================================
  # Doc Tests (run once on x86_64, in parallel with other tests)
  # ===========================================================================
  doc-tests:
    name: Doc Tests
    runs-on: ubuntu-22.04-xlarge
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true  # Doc tests use include_str!/include_bytes! which need LFS at compile time

      - name: Install OpenCV build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libopencv-dev nasm

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-x86_64-doc
          cache-on-failure: true

      - name: Run doc tests
        # The five modular C-API leaves (tensor/image/codec/decoder/tracker-capi)
        # are excluded from the workspace, so --workspace does not reach their
        # doctests. No separate step is needed for them here: doctests do not
        # apply to these crates at all -- their crate-type is staticlib/cdylib
        # only (no rlib), so cargo never compiles or runs doctests for them
        # regardless of invocation. `make test-capi-modular`
        # (build-and-test-x86, build-and-test-macos, build-arm) still runs
        # plain `cargo test` per leaf for their regular unit/integration tests.
        #
        # NOT `--all-features`: edgefirst-tensor's `static`/`dynamic` backend
        # features are mutually exclusive by design (see the `compile_error!`
        # guards in crates/tensor/src/lib.rs) -- `--all-features` enables both
        # at once and can never work again, on this crate specifically, no
        # matter how the rest of the tree changes. `make test-doc` runs the
        # same doctests with the workspace's real feature set (RUST_FEATURES
        # in the Makefile) and the same python-crate excludes (their doc
        # comments are Python `__doc__`, not Rust) -- delegating to it here
        # keeps this step and local development running the identical
        # command instead of two copies that can drift apart.
        run: make test-doc

  # ===========================================================================
  # Build and Test on x86_64 (GitHub-hosted runner with Docker)
  # ===========================================================================
  build-and-test-x86:
    name: Build & Test (x86_64)
    runs-on: ubuntu-22.04-xlarge
    needs: checkout-lfs
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          lfs: false  # LFS files downloaded separately

      - name: Download LFS testdata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/

      - name: Install OpenCV build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libopencv-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Python virtual environment
        run: |
          python3 -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> $GITHUB_PATH
          venv/bin/pip install --upgrade pip setuptools wheel
          venv/bin/pip install maturin[patchelf] slipcover pytest pytest-timeout pytest-benchmark
          venv/bin/pip install tensorflow pyyaml numpy pillow opencv-python-headless psutil safetensors

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview, clippy, rustfmt

      - name: Set up Rust nightly toolchain (for Python builds)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_NIGHTLY_VERSION }}
          components: llvm-tools-preview, rustfmt, clippy, miri, rust-src

      - name: Set Rust stable as default toolchain
        run: rustup default ${{ env.RUST_STABLE_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-x86_64
          cache-on-failure: true

      - name: Install cargo tools
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-llvm-cov@0.6.16,cargo-nextest

      - name: Check Rust formatting (advisory)
        # Format drift is a WARNING, not a hard failure — it never blocks merge.
        # The authoritative gate is the local `make format` pre-commit step
        # (see .github/copilot-instructions.md). This emits a GitHub annotation
        # so drift is visible in the PR checks UI without failing the job.
        # The five modular C-API leaves (tensor/image/codec/decoder/tracker-capi)
        # are excluded from the workspace, so `--all` above never reaches them;
        # check each leaf individually with the same advisory mechanism.
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::warning title=Rust formatting drift::Run 'make format' before committing — CI does not block on formatting."
          fi
          for c in tensor-capi image-capi codec-capi decoder-capi tracker-capi; do
            if ! cargo fmt --manifest-path crates/$c/Cargo.toml -- --check; then
              echo "::warning title=Rust formatting drift ($c)::Run 'make format' before committing — CI does not block on formatting."
            fi
          done

      - name: Run Clippy
        # Use default,opencv features; exclude g2d_test_formats,dma_test_formats (on-target only)
        # --exclude the four python-* crates for the same reason lines 619-622's
        # iOS lane already does: they request edgefirst-tensor's `dynamic`
        # feature while every other member wants `static` (default), and
        # --workspace unions features across all members, activating both at
        # once on one edgefirst-tensor unit -- a guaranteed compile failure
        # (crates/tensor/src/lib.rs's own mutual-exclusion guard), not a lint
        # finding. Confirmed by running this exact line before the fix: 17
        # errors, twelve of them this wall (`Tensor`/`TensorDyn` defined
        # multiple times, recursive types with infinite size, three failed
        # python-crate build scripts); the other 5 are pre-existing, unrelated
        # clippy drift in crates/decoder/src/modelpack.rs.
        run: cargo clippy --workspace --all-targets --features default,opencv --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common -- -D warnings

      - name: Run Clippy (modular C-API leaves)
        # The five modular C-API leaves (tensor/image/codec/decoder/tracker-capi)
        # are standalone packages excluded from --workspace above; lint them
        # via the Makefile lane that's the single source of truth for their
        # invocation shape (--manifest-path/--target-dir).
        run: make lint-capi-modular

      - name: Run Clippy (edgefirst-tensor, dynamic backend)
        # The --workspace clippy above runs on default features, i.e. the
        # STATIC backend, and cannot also cover the dynamic one -- the two
        # are mutually exclusive (crates/tensor/src/lib.rs's compile_error!),
        # so --workspace can only ever select one. Without this the dynamic
        # backend was linted by nobody.
        run: make lint-tensor-dynamic

      - name: Package and smoke the C archive
        # A PR that breaks header packaging, a .pc file, or the SONAME chain
        # must fail here — not on a tag, after PyPI has already published.
        run: |
          make package
          ./scripts/smoke-capi-archive.sh dist/edgefirst-hal-*.tar.gz

      - name: Set up coverage instrumentation
        run: .github/scripts/setup-coverage-env.sh

      - name: Build Python bindings with coverage instrumentation
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY_VERSION }}
        run: |
          source /tmp/coverage-env.sh
          # Four self-contained extension modules since 0.29. Each is built
          # and installed; the bindings they share live in python-common, which
          # is where the instrumented line coverage actually lands.
          for pkg in tensor codec image decoder tracker; do
            venv/bin/maturin build \
              --manifest-path "crates/python-$pkg/Cargo.toml" \
              --out target/wheels \
              --profile profiling \
              --features abi3-py311 \
              --auditwheel skip
          done
          # --no-deps: every edgefirst-* sibling is in this same wheel set, built
          # from this commit. Resolving the `~=` pins would let pip fetch a
          # PUBLISHED sibling from PyPI over the locally built one, so the suite
          # would silently test released code instead of this branch. Third-party
          # runtime deps are installed by the steps above.
          venv/bin/pip install --no-deps --force-reinstall target/wheels/*.whl

      - name: Run Rust tests with coverage
        run: |

          # Run tests but don't generate report yet - we'll combine with Python test coverage
          # Use default,opencv features; exclude g2d_test_formats,dma_test_formats (on-target only)
          # --exclude the four python-* crates: they request edgefirst-tensor's
          # `dynamic` feature while --workspace unions features across every
          # member, activating `static` (default, from everything else) and
          # `dynamic` at once and tripping edgefirst-tensor's own
          # mutual-exclusion guard. Same defect as the clippy lane above.
          cargo llvm-cov nextest --cargo-profile profiling --features default,opencv --workspace \
            --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common \
            --no-report -j 1 \
            2>&1 | tee target/test-metrics-rust-x86_64.txt

      - name: Run modular C-API tests
        # The five modular C-API leaves left --workspace's llvm-cov nextest run
        # above (standalone packages, not workspace members). `make
        # test-capi-modular` builds and tests them via plain `cargo test`
        # (EF_REQUIRE_FRESH_ARTIFACTS=1), the Makefile lane that's the single
        # source of truth for their invocation shape.
        run: make test-capi-modular

      - name: Compile and link C headers
        run: make test-capi-link

      - name: Two-library C user
        run: make test-two-library-user

      - name: Single-tensor-home architecture gates
        # G7 (scripts/miri.sh) is cannot_measure -- a hard fail -- when the
        # nightly Miri component is missing. Install it on the same pinned
        # nightly this job already uses; the script reads RUST_NIGHTLY_VERSION.
        env:
          RUST_NIGHTLY_VERSION: ${{ env.RUST_NIGHTLY_VERSION }}
        run: |
          cargo +${{ env.RUST_NIGHTLY_VERSION }} miri setup
          make check-single-home

      - name: Run edgefirst-tensor dynamic-backend tests
        # Same reason as the clippy step above: the nextest run is
        # --workspace on default features, so it exercises only the static
        # backend. This lane builds libedgefirst_tensor.so and runs the
        # dynamic backend's integration targets against it -- including
        # every gate in dynamic_primitives.rs and the whole
        # protocol_roundtrip.rs suite, which until now ran only by hand.
        # Linux only: `dynamic-test-link` resolves the library through
        # LD_LIBRARY_PATH, and the macOS equivalent (DYLD_LIBRARY_PATH,
        # plus SIP's handling of it) is untested.
        run: make test-tensor-dynamic

      - name: Run Python tests with coverage
        run: |

          # Source coverage env so Python tests generate profraw for PyO3 bindings
          source /tmp/coverage-env.sh
          # Python tests exercise PyO3 bindings - profraw files generated from instrumented wheel
          venv/bin/python -m slipcover --xml --out target/coverage_python.xml \
            -m pytest tests/ -v --tb=short --junitxml=target/pytest_results.xml \
            2>&1 | tee target/test-metrics-python-x86_64.txt

      - name: Generate combined Rust coverage report
        run: |
          # Generate LCOV report combining Rust tests + Python tests (PyO3 bindings coverage)
          cargo llvm-cov report --profile profiling \
            --ignore-filename-regex '(\.cargo|/rustc/|/target/)' \
            --lcov --output-path target/coverage_rust.lcov
          echo "=== Coverage summary ==="
          echo "Source files in coverage: $(grep -c '^SF:' target/coverage_rust.lcov)"
          # The split into four dynamic objects can silently UNDER-report rather
          # than error, so assert attribution explicitly.
          bash tests/packaging/check_coverage_split.sh target/coverage_rust.lcov
          echo "PyO3 files with coverage:"
          grep '^SF:.*crates/python' target/coverage_rust.lcov || echo "  (none found)"
          echo "=== Sample coverage data for crates/python ==="
          # Show hit counts for PyO3 files to verify they're being exercised
          awk '/^SF:.*crates\/python/{found=1; file=$0} found && /^DA:/{print file": "$0} found && /^end_of_record/{found=0}' target/coverage_rust.lcov | head -20 || true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-x86_64
          path: |
            target/coverage_rust.lcov
            target/coverage_python.xml
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-x86_64
          path: |
            target/pytest_results.xml
            target/nextest/default/test-results.xml
            target/llvm-cov-target/nextest/default/test-results.xml
            target/test-metrics-rust-x86_64.txt
            target/test-metrics-capi-x86_64.txt
            target/test-metrics-python-x86_64.txt
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2.23.0
        if: always()
        with:
          # Both nextest junit locations: plain runs use target/nextest,
          # cargo-llvm-cov (make test-rust) relocates the store dir under
          # target/llvm-cov-target. Until the nextest.toml junit.path fix
          # the Rust junit landed at a nested path no step ever found —
          # this check was silently pytest-only.
          files: |
            target/pytest_results.xml
            target/nextest/default/test-results.xml
            target/llvm-cov-target/nextest/default/test-results.xml
          check_name: Test Results (x86_64)
          comment_mode: always
          ignore_runs: true

  # ===========================================================================
  # Build and Test on macOS (Apple Silicon)
  # ===========================================================================
  build-and-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    needs: checkout-lfs
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      # scripts/fetch-angle.sh downloads the signed xcframeworks from the
      # public EdgeFirstAI/angle-package release. The release is public, so no
      # credentials are required; GH_TOKEN is passed only to raise GitHub's API
      # rate limit (honored if present, not required). This means the ANGLE
      # fetch — and the GL render path it enables — works on pushes, same-repo
      # PRs, and fork PRs alike.
      GH_TOKEN: ${{ github.token }}
      # Point the HAL's macOS ANGLE loader at the flat-lib staging dir that
      # scripts/fetch-angle.sh produces from the release xcframeworks. ANGLE's
      # libEGL dlopens libGLESv2.dylib from its own directory, so the two must
      # be flat siblings (the framework bundle layout does not work for the
      # macOS runtime dlopen path) — see crates/image/src/gl/platform/macos.rs.
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}/target/angle/macos-flat-lib

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false  # LFS files downloaded separately

      - name: Download LFS testdata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          # llvm-tools-preview supplies the profdata/cov tooling cargo-llvm-cov
          # needs to turn the instrumented run into an LCOV report.
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-macos
          cache-on-failure: true
          cache-bin: false  # Prevent overwriting rustup cargo shim with stale cached binary

      - name: Install cargo tools
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.6.16

      - name: Fetch ANGLE xcframeworks (release v2.1.28252)
        # Download + sha256-verify + extract the signed, notarized ANGLE
        # xcframeworks from the EdgeFirstAI/angle-package release. Replaces
        # the old Homebrew tap (`brew install startergo/angle/angle`) + the
        # re-sign dance (the release is already Developer-ID-signed +
        # notarized, so it dlopens cleanly without re-signing — unlike
        # Homebrew's install_name_tool-mangled dylibs). EDGEFIRST_ANGLE_PATH
        # (set on the job) points the HAL loader at the macOS slice.
        run: bash scripts/fetch-angle.sh

      - name: Run Clippy
        # Use default features only (no OpenCV, no Linux-specific hardware features)
        # Exclude Linux-only crates (gpu-probe, edgefirst-bench) that depend on DMA, EGL, DRM
        # Exclude the four python-* crates: they request edgefirst-tensor's `dynamic`
        # feature while --workspace unions features across every member, activating
        # `static` (default) and `dynamic` at once -- the same mutual-exclusion
        # failure fixed above and at the iOS lane (lines 619-622).
        run: cargo clippy --workspace --all-targets --exclude gpu-probe --exclude edgefirst-bench --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common -- -D warnings

      - name: Run Clippy (modular C-API leaves)
        # The five modular C-API leaves (tensor/image/codec/decoder/tracker-capi)
        # are standalone packages excluded from --workspace above; lint them
        # via the Makefile lane that's the single source of truth for their
        # invocation shape (--manifest-path/--target-dir).
        run: make lint-capi-modular

      - name: Run Rust tests with coverage
        # scripts/test-macos.sh builds with --tests, signs every binary
        # with entitlements.plist (disables library validation so an
        # ad-hoc-signed test binary can dlopen the Developer-ID-signed
        # ANGLE framework), then forwards to nextest. The script already
        # injects `--workspace --exclude gpu-probe --exclude edgefirst-bench`
        # and the python crates (static+dynamic unification), so we only add
        # the runner-specific `-j 1` here. Without the sign step the GL tests
        # SIGKILL and silently skip.
        #
        # COVERAGE=1 instruments the build via cargo-llvm-cov (show-env), so
        # the codesign step stays between build and run — this is what lets
        # the macOS lane cover the ANGLE/IOSurface F16 GL render path that no
        # other coverage lane exercises (x86 is headless; imx8mp/Vivante
        # disables float GL).
        env:
          COVERAGE: "1"
          COV_LCOV: target/coverage_rust.lcov
          # gl_backend_available_canary: fail this lane (instead of
          # silently skipping every GL test) if the ANGLE stack above is
          # broken. Enforced in coverage pass 2 only — pass 1 runs
          # unsigned binaries with the dlopen gate closed by design.
          HAL_TEST_REQUIRE_GL: "1"
        run: |
          ./scripts/test-macos.sh -j 1 \
            2>&1 | tee target/test-metrics-rust-macos.txt

      - name: Run modular C-API tests
        # The five modular C-API leaves left --workspace's nextest run above
        # (standalone packages, not workspace members). `make
        # test-capi-modular` builds and tests them via plain `cargo test`
        # (EF_REQUIRE_FRESH_ARTIFACTS=1), the Makefile lane that's the single
        # source of truth for their invocation shape.
        run: make test-capi-modular

      - name: Compile and link C headers
        run: make test-capi-link

      - name: Two-library C user
        run: make test-two-library-user

      - name: Package and smoke the C archive (macOS)
        # PR gate for the macOS zip path (dylib names inside a .zip).
        # release.yml's build-capi macOS rows would otherwise be the first
        # time that branch of package-capi.sh ever ran — after a tag.
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkgconf
          fi
          make package
          ./scripts/smoke-capi-archive.sh dist/edgefirst-hal-*.zip

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run GPU Python tests
        # Linux pytest skips @pytest.mark.gpu (no real GPU; software GL is
        # opted out). macOS must run and pass via ANGLE. Codesign the venv
        # interpreter with disable-library-validation so dlopen of ANGLE
        # does not SIGKILL the process (same entitlement as test-macos.sh).
        # --auditwheel skip matches the x86/aarch64 lanes: on macOS it
        # skips delocate, which cannot locate @rpath/libedgefirst_tensor.N.dylib
        # (the copy is bundled via python-source, not on the dyld search path).
        env:
          HAL_TEST_REQUIRE_GL: "1"
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install maturin pytest numpy pillow
          for pkg in tensor codec image decoder tracker; do
            venv/bin/maturin build \
              --manifest-path "crates/python-$pkg/Cargo.toml" \
              --out target/wheels \
              --release \
              --features abi3-py311 \
              --auditwheel skip
          done
          venv/bin/pip install --no-deps --force-reinstall target/wheels/*.whl
          PY=$(python3 -c "import os; print(os.path.realpath('venv/bin/python3'))")
          codesign --force --sign - --entitlements entitlements.plist "$PY"
          venv/bin/python -m pytest tests/ -m gpu -v --tb=short

      - name: Coverage summary (macOS)
        # Tool-free per-lane visibility: overall lines plus the GL-engine
        # slice (the number the GL-tests-on-ANGLE port moves), straight
        # from the lcov into the job's step summary.
        if: always()
        run: |
          if [[ -f target/coverage_rust.lcov ]]; then
            awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf>0) printf "## Coverage (macOS lane)\nLines: %d / %d (%.1f%%)\n", lh, lf, 100*lh/lf }' \
              target/coverage_rust.lcov >> "$GITHUB_STEP_SUMMARY"
            awk -F'[:,]' '/^SF:.*crates\/image\/src\/gl\//{f=1} f&&/^LF:/{lf+=$2} f&&/^LH:/{lh+=$2} /^end_of_record/{f=0} END{ if (lf>0) printf "\nGL engine (crates/image/src/gl): %d / %d (%.1f%%)\n", lh, lf, 100*lh/lf }' \
              target/coverage_rust.lcov >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          # Picked up automatically by the sonarcloud job, which globs every
          # coverage-*/**.lcov into -Dsonar.rust.lcov.reportPaths.
          name: coverage-macos
          path: |
            target/coverage_rust.lcov
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-macos
          path: |
            target/nextest/default/test-results.xml
            target/llvm-cov-target/nextest/default/test-results.xml
            target/test-metrics-*-macos.txt
          retention-days: 30

      - name: Publish test results
        # The `/macos` sub-action is the composite (Python) variant — the
        # root action is docker-based and Linux-only. Same pinned hash.
        # The coverage flow runs nextest twice and pass 2 (GL-enabled,
        # signed binaries) overwrites pass 1's junit at the same path, so
        # the published results are the GL-enabled run.
        uses: EnricoMi/publish-unit-test-result-action/macos@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2.23.0
        if: always()
        with:
          # Under cargo-llvm-cov the nextest target dir is
          # target/llvm-cov-target, so the junit lands there; the plain
          # path covers COVERAGE=0 runs of test-macos.sh.
          files: |
            target/nextest/default/test-results.xml
            target/llvm-cov-target/nextest/default/test-results.xml
          check_name: Test Results (macOS)
          comment_mode: always
          ignore_runs: true

  # ===========================================================================
  # Build the native Rust API for iOS (aarch64 device + simulator)
  #
  # This repo's mobile responsibility is the native Rust API compiling on
  # iOS -- not a C artifact, not a binding, not packaging. `mobile-sdk`
  # binds to these crates directly via boltffi and owns everything above
  # that line (Swift/Kotlin, monolith-vs-modular packaging, XCFrameworks).
  # See README.md § iOS.
  #
  # There is no runtime test (no device/simulator in CI) — this lane is
  # compile + clippy only, which is also what makes it the thing standing
  # between the iOS-only code paths (IOSurface, the GL platform seam) and
  # them silently rotting unbuilt again: that already happened once, for
  # months, invisible to every x86_64 Linux lane, until this branch's own
  # b3ebae79 turned unsafe_op_in_unsafe_fn into a hard error and P6's
  # cross-build audit finally reached these files.
  #
  # gpu-probe (Linux-only binary), the four python-* cdylibs, and
  # edgefirst-bench are excluded from the workspace build.
  # ===========================================================================
  build-ios:
    name: Build & Lint (iOS, native Rust API)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-ios
          cache-on-failure: true
          cache-bin: false

      - name: Run Clippy (iOS device)
        # Lint the cfg-gated iOS code paths (the GL platform seam + IOSurface
        # backend) that no other lane compiles. Excludes Linux-only / python /
        # bench crates. The C API happens to be workspace-covered too (it
        # wraps the same Rust crates) but is not what this lane exists to
        # verify -- mobile consumes the Rust API directly, not the C API, so
        # there is no separate C-API-leaves clippy pass here the way the
        # x86_64/Windows lanes have one. -D warnings keeps the lane a hard
        # gate.
        run: |
          cargo clippy --target aarch64-apple-ios \
            --workspace \
            --exclude gpu-probe \
            --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common --exclude edgefirst-bench \
            -- -D warnings

      - name: Build the native Rust API for iOS (device + simulator)
        # The five sibling crates mobile-sdk consumes via boltffi --
        # not the five modular C-API leaves. This repo's mobile
        # responsibility ends at "the Rust API compiles"; bindings and
        # packaging are mobile-sdk's.
        run: |
          cargo build --target aarch64-apple-ios      --release -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker
          cargo build --target aarch64-apple-ios-sim  --release -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker

  # ===========================================================================
  # Build the native Rust API for Android (arm64 device + x86_64 emulator ABIs)
  #
  # Mirrors the iOS lane's decision: compile + clippy only, no emulator
  # runtime — GitHub runners have no GPU, so the Android emulator would
  # exercise SwiftShader software GL rather than a real Adreno/Mali driver
  # and add flakiness without signal. On-device GL correctness and the
  # performance gates run via the internal hal-mobile AWS Device Farm
  # harness (Galaxy S26 Ultra pool); see TESTING.md § Android On-Device
  # Validation.
  #
  # As with iOS: this repo's mobile responsibility is the native Rust API
  # compiling on Android, not a C artifact -- `mobile-sdk` binds to these
  # crates directly via boltffi.
  # ===========================================================================
  build-android:
    name: Build & Lint (Android, native Rust API)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy

      - name: Set up Android NDK
        id: setup-ndk
        # Pin our own NDK rather than using the runner image's preinstalled
        # copies, whose versions drift with image updates. r27c is the LTS
        # release; the HAL's API floor (26) is set per-invocation via
        # cargo-ndk's -P flag.
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779  # v1.6.0
        with:
          ndk-version: r27c

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-android
          cache-on-failure: true
          cache-bin: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Run Clippy (Android arm64)
        # Lint the cfg-gated Android code paths (the GL platform seam +
        # AHardwareBuffer backend) that no other lane compiles. Excludes
        # Linux-only gpu-probe, the python crates, and the bench harness.
        # The C API happens to be workspace-covered too (it wraps the same
        # Rust crates) but is not what this lane exists to verify -- mobile
        # consumes the Rust API directly, not the C API. -D warnings keeps
        # the lane a hard gate.
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -P 26 clippy \
            --workspace \
            --all-targets \
            --exclude gpu-probe --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common --exclude edgefirst-bench \
            -- -D warnings

      - name: Build the native Rust API for Android (arm64 device + x86_64 emulator)
        # The five sibling crates mobile-sdk consumes via boltffi -- not
        # the five modular C-API leaves. This repo's mobile responsibility
        # ends at "the Rust API compiles"; bindings and packaging are
        # mobile-sdk's.
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -P 26 build --release \
            -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker

  # ===========================================================================
  # Build & Test on Windows (x86_64-pc-windows-msvc)
  #
  # Windows is a GPU platform: crates/image's GL engine runs on ANGLE over
  # Direct3D 11 with PBO transfers (crates/image/src/gl/platform/windows.rs).
  # This lane:
  #   1. lints the workspace and the five C-API leaves (gating);
  #   2. runs the Rust tests WITHOUT ANGLE on the search path (gating) — the
  #      GL tests self-skip deterministically, everything else must pass.
  #      Under cargo-llvm-cov like every other test lane (--no-report, so
  #      the profraw accumulates);
  #   3. runs the image crate's GL tests on ANGLE's D3D11 WARP software
  #      adapter with HAL_TEST_REQUIRE_GL=1 (best-effort, like the Linux
  #      software-gl-coverage lane: hosted Windows runners have no GPU),
  #      also under cargo-llvm-cov so the GL engine's D3D11 paths land in
  #      the same LCOV, which scripts/normalize-lcov-paths.ps1 makes
  #      repo-relative and the sonarcloud job globs as coverage-windows;
  #   4. builds, packages and smokes the C archive with ANGLE bundled (gating);
  #   5. builds the five wheels with ANGLE bundled, checks the layout,
  #      installs them, and runs the gpu-marked pytest on WARP (build +
  #      layout gating; the WARP pytest best-effort).
  # Real-GPU validation is a local run on an NVIDIA box:
  #   pwsh scripts/test-windows.ps1 -RequireGl   (see TESTING.md § Windows).
  # gpu-probe depends on EGL/GBM which are Linux-only; the python-* crates
  # cannot join --workspace (edgefirst-tensor's static/dynamic exclusion).
  # ===========================================================================
  build-and-test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    needs: checkout-lfs
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      # scripts/fetch-angle.sh --windows downloads angle-windows-x64-<tag>.zip
      # from the public EdgeFirstAI/angle-package release (no auth needed;
      # GH_TOKEN only raises the API rate limit).
      GH_TOKEN: ${{ github.token }}
      # The HAL's Windows ANGLE loader reads this first; libEGL.dll and
      # libGLESv2.dll must be flat siblings (libEGL loads libGLESv2 from its
      # own directory) — see crates/image/src/gl/platform/windows.rs.
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}\target\angle\windows-x64\bin

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false  # LFS files downloaded separately

      - name: Download LFS testdata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          # llvm-tools-preview supplies the profdata/cov tooling cargo-llvm-cov
          # needs to turn the instrumented run into an LCOV report.
          components: clippy, rustfmt, llvm-tools-preview

      - name: Set up MSVC Developer Command Prompt
        # Prepends the Visual Studio PATH so MSVC `link.exe` wins. Not
        # sufficient on this job's default Git bash: `/usr/bin/link.exe`
        # (coreutils `link`) still shadows MSVC. Cargo steps below use
        # pwsh so the MSVC directory is actually first.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-windows
          cache-on-failure: true
          cache-bin: false  # Prevent overwriting rustup cargo shim with stale cached binary

      - name: Install cargo tools
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.6.16

      - name: Fetch ANGLE (Windows x64, release v2.1.28252)
        # Download + sha256-verify + extract angle-windows-x64-<tag>.zip into
        # target/angle/windows-x64/ (EDGEFIRST_ANGLE_PATH above points at its
        # bin/). Same pinned ANGLE commit as the macOS xcframeworks.
        shell: bash
        run: bash scripts/fetch-angle.sh --windows

      - name: Run Clippy
        # Same exclusions as the macOS lane: gpu-probe/edgefirst-bench are
        # Linux-only; the python-* crates cannot join --workspace.
        # pwsh: Git bash's `/usr/bin/link.exe` shadows MSVC `link.exe`.
        shell: pwsh
        run: cargo clippy --workspace --all-targets --exclude gpu-probe --exclude edgefirst-bench --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common -- -D warnings

      - name: Run Clippy (modular C-API leaves)
        # The five modular C-API leaves are standalone packages excluded from
        # --workspace above. No Makefile is invoked here (this job's style is
        # raw cargo), so this loop mirrors `make lint-capi-modular` by hand.
        shell: pwsh
        run: |
          foreach ($c in @('tensor-capi','image-capi','codec-capi','decoder-capi','tracker-capi')) {
            cargo clippy --manifest-path "crates/$c/Cargo.toml" --all-targets --target-dir target -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Rust tests with coverage (no ANGLE on the search path)
        # The gating pass: with EDGEFIRST_ANGLE_PATH empty the GL backend
        # cannot come up, so every GL test self-skips deterministically and
        # the rest of the suite must pass. Runs under cargo-llvm-cov like the
        # other lanes; --no-report leaves the profraw in place so the WARP
        # pass below adds the GL engine's and one report step merges both.
        # -j 1 is the same single-threaded rule the other lanes apply
        # (TESTING.md § Single-Threaded Execution).
        shell: pwsh
        env:
          EDGEFIRST_ANGLE_PATH: ''
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --no-report --workspace --exclude gpu-probe --exclude edgefirst-bench --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common -j 1 2>&1 | Tee-Object -FilePath target/test-metrics-rust-windows.txt
          exit $LASTEXITCODE

      - name: Run GL tests on ANGLE D3D11 WARP with coverage (best-effort)
        # Exercises the real GL engine on the runner's software D3D11
        # adapter (EDGEFIRST_ANGLE_ADAPTER=warp + EDGEFIRST_ALLOW_SOFTWARE_GL=1).
        # HAL_TEST_REQUIRE_GL=1 turns "ANGLE failed to come up" into a
        # failure (gl_backend_available_canary) rather than a silent skip.
        # continue-on-error like software-gl-coverage: WARP is a software
        # renderer, not a supported production target; promote once stable.
        # -Coverage accumulates into the gating pass's profraw. `--profile ci`
        # keeps this pass's junit in its own nextest store
        # (llvm-cov-target/nextest/ci/) so it does not overwrite the full
        # workspace results published below.
        shell: pwsh
        continue-on-error: true
        run: pwsh -NoProfile -File scripts/test-windows.ps1 -Coverage -Warp -RequireGl -p edgefirst-image --profile ci

      - name: Generate LCOV report (Windows)
        # Merges the profraw from both nextest passes above. cargo-llvm-cov
        # writes absolute SF: records with backslashes (D:\a\hal\hal\...);
        # SonarCloud resolves SF: against the Linux scanner's checkout, so
        # the paths are made repo-relative POSIX here (the sonarcloud job's
        # sed does the same for the Unix lanes' /.../work/hal/hal/ prefix).
        shell: pwsh
        run: |
          cargo llvm-cov report --lcov --output-path target/coverage_rust.lcov --ignore-filename-regex '(\.cargo|[\\/]rustc[\\/]|[\\/]target[\\/])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/normalize-lcov-paths.ps1 target/coverage_rust.lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Source files in coverage: $((Select-String -Path target/coverage_rust.lcov -Pattern '^SF:' | Measure-Object).Count)"
          Select-String -Path target/coverage_rust.lcov -Pattern '^SF:' | Select-Object -First 3 | ForEach-Object { $_.Line }

      - name: Build modular C-API leaves (Windows, release)
        # Isolated from the bash packaging step so cargo uses MSVC link.exe.
        shell: pwsh
        run: |
          foreach ($leaf in @('tensor','image','codec','decoder','tracker')) {
            cargo build --release --manifest-path "crates/${leaf}-capi/Cargo.toml" --target-dir target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package and smoke the C archive (Windows)
        # PR gate for the Windows packaging path (DLL + import-lib selection,
        # ANGLE bundled into bin/ because EDGEFIRST_ANGLE_PATH is set).
        # release.yml's build-capi Windows row would otherwise be the first
        # time that branch of package-capi.sh ever ran — after a tag.
        shell: bash
        run: |
          mkdir -p dist
          ./scripts/package-capi.sh --target x86_64-windows --libdir target/release --outdir dist
          ./scripts/smoke-capi-archive-windows.sh dist/edgefirst-hal-*-x86_64-windows.zip

      - name: Run modular C-API tests (best-effort)
        # `make test-capi-modular` is bash/Makefile-shaped; this mirrors its
        # recipe by hand. First time these leaf tests run on Windows, so it
        # starts non-gating; promote once green.
        shell: pwsh
        continue-on-error: true
        env:
          EF_REQUIRE_FRESH_ARTIFACTS: '1'
        run: |
          foreach ($leaf in @('tensor','image','codec','decoder','tracker')) {
            cargo test --manifest-path "crates/${leaf}-capi/Cargo.toml" --target-dir target -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build, check and install the Python wheels
        # EDGEFIRST_ANGLE_PATH is set on the job, so python-image's build.rs
        # bundles libEGL.dll + libGLESv2.dll next to _image.pyd. The layout
        # check enforces the single-tensor-home rule (edgefirst_tensor.dll
        # ships once, in the tensor wheel).
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\pip.exe install maturin pytest numpy pillow
          foreach ($pkg in @('tensor','codec','image','decoder','tracker')) {
            venv\Scripts\maturin.exe build --manifest-path "crates/python-$pkg/Cargo.toml" --out target/wheels --release --features abi3-py311 --auditwheel skip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          venv\Scripts\python.exe scripts/check_wheel_layout.py target/wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          venv\Scripts\pip.exe install --no-deps --force-reinstall (Get-ChildItem target/wheels/*.whl)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          venv\Scripts\python.exe -c "import edgefirst.tensor, edgefirst.codec, edgefirst.image, edgefirst.decoder, edgefirst.tracker; print('wheels import ok')"

      - name: Run GPU Python tests on WARP (best-effort)
        # tests/gpu_policy.py: on Windows the gpu-marked tests skip unless
        # HAL_TEST_REQUIRE_GL=1, and then REQUIRE a PBO-backed destination.
        shell: pwsh
        continue-on-error: true
        env:
          HAL_TEST_REQUIRE_GL: '1'
          EDGEFIRST_ANGLE_ADAPTER: warp
          EDGEFIRST_ALLOW_SOFTWARE_GL: '1'
        run: venv\Scripts\python.exe -m pytest tests/ -m gpu -v --tb=short

      - name: Coverage summary (Windows)
        # Same tool-free per-lane visibility as the macOS lane: overall
        # lines plus the GL-engine slice, straight from the lcov into the
        # job's step summary.
        if: always()
        shell: bash
        run: |
          if [[ -f target/coverage_rust.lcov ]]; then
            awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf>0) printf "## Coverage (Windows lane)\nLines: %d / %d (%.1f%%)\n", lh, lf, 100*lh/lf }' \
              target/coverage_rust.lcov >> "$GITHUB_STEP_SUMMARY"
            awk -F'[:,]' '/^SF:.*crates\/image\/src\/gl\//{f=1} f&&/^LF:/{lf+=$2} f&&/^LH:/{lh+=$2} /^end_of_record/{f=0} END{ if (lf>0) printf "\nGL engine (crates/image/src/gl): %d / %d (%.1f%%)\n", lh, lf, 100*lh/lf }' \
              target/coverage_rust.lcov >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          # Picked up automatically by the sonarcloud job, which globs every
          # coverage-*/**.lcov into -Dsonar.rust.lcov.reportPaths.
          name: coverage-windows
          path: |
            target/coverage_rust.lcov
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          # default/ is the full-workspace gating pass, ci/ the WARP GL pass.
          # Both nextest store roots are listed: under cargo-llvm-cov the
          # store can land in target/llvm-cov-target or stay in target/
          # depending on how the target dir was resolved (a local run with
          # CARGO_TARGET_DIR set lands in target/nextest/).
          name: test-results-windows
          path: |
            target/nextest/default/test-results.xml
            target/nextest/ci/test-results.xml
            target/llvm-cov-target/nextest/default/test-results.xml
            target/llvm-cov-target/nextest/ci/test-results.xml
            target/test-metrics-*-windows.txt
          retention-days: 30

      - name: Publish test results
        # The `/windows` sub-action is the composite (Python) variant — the
        # root action is docker-based and Linux-only. Same pinned hash.
        # Only the gating pass's junit is published: the WARP pass re-runs
        # the image crate and would double-count it. The plain path covers
        # a COVERAGE-less run of the same commands.
        uses: EnricoMi/publish-unit-test-result-action/windows@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2.23.0
        if: always()
        with:
          files: |
            target/nextest/default/test-results.xml
            target/llvm-cov-target/nextest/default/test-results.xml
          check_name: Test Results (Windows)
          comment_mode: always
          ignore_runs: true

  # ===========================================================================
  # Software-GL coverage (Mesa llvmpipe)
  #
  # Exercises the Linux GL float *render* path (gl/processor/float.rs PBO
  # readback: upload_float_src / draw_float_quad / convert_float_to_pbo) with
  # no GPU. `EDGEFIRST_ALLOW_SOFTWARE_GL=1` opts past the normal software-
  # renderer rejection, and llvmpipe runs the same GLSL so the float PBO
  # roundtrip value-checks are numerically valid. The DMA-BUF path
  # (convert_float_to_dma) still needs real V3D/Mali and is not covered here.
  #
  # Bonus-coverage only — never a test gate: every test step is best-effort
  # (`|| true`, `--no-fail-fast`), so if the surfaceless EGL display does not
  # come up (GL tests then self-skip) or a GL test misbehaves on llvmpipe, the
  # job still succeeds and uploads whatever coverage it collected. The x86 /
  # macOS / hardware lanes remain the authoritative test gates.
  # ===========================================================================
  software-gl-coverage:
    name: Software-GL Coverage (llvmpipe)
    runs-on: ubuntu-22.04-xlarge
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
      EDGEFIRST_ALLOW_SOFTWARE_GL: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          lfs: false  # LFS files downloaded separately

      - name: Download LFS testdata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/

      - name: Install Mesa llvmpipe (software OpenGL ES + EGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 mesa-utils-extra

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-x86_64
          cache-on-failure: true

      - name: Install cargo tools
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-llvm-cov@0.6.16,cargo-nextest

      - name: Probe software-GL bring-up (diagnostic, non-fatal)
        run: |
          echo "=== eglinfo ==="
          eglinfo -B 2>&1 | head -50 || true
          echo "=== HAL gpu-probe (does the GL context come up on llvmpipe?) ==="
          cargo run -p gpu-probe -- --probe-only 2>&1 | head -60 || true

      - name: Run image GL tests under coverage (Mesa llvmpipe)
        run: |
          # Single-threaded is mandatory for the image crate (GL_MUTEX). The
          # float PBO roundtrips run here when the llvmpipe context comes up;
          # best-effort so a software-GL hiccup never fails CI.
          #
          # The `*_no_bleed_gl` crop tests assert tight per-pixel boundaries
          # that depend on the GPU's exact texture-sampling/rounding; llvmpipe's
          # software sampler differs slightly, so they fail here while passing
          # on every real-GPU lane (macOS/ANGLE, V3D, Mali). Exclude them on
          # this lane only — they remain covered by the GPU lanes — so a real
          # regression here is not masked by known software-sampler noise.
          cargo llvm-cov nextest -p edgefirst-image --features default \
            --no-fail-fast -j 1 \
            -E 'not test(~no_bleed_gl)' \
            --lcov --output-path target/coverage_rust.lcov \
            --ignore-filename-regex '(\.cargo|/rustc/|/target/)' \
            2>&1 | tee target/test-metrics-software-gl.txt || true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          # Globbed into the SonarCloud scan alongside the other coverage-*.
          name: coverage-software-gl
          path: |
            target/coverage_rust.lcov
            target/test-metrics-software-gl.txt
          retention-days: 30

  # ===========================================================================
  # Build on aarch64 (compile + lint, upload artifacts for test-arm & hardware-test)
  # ===========================================================================
  build-arm:
    name: Build (aarch64)
    runs-on: ubuntu-22.04-arm-xlarge
    needs: checkout-lfs

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          lfs: false  # LFS files downloaded separately

      - name: Download LFS testdata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev clang libclang-dev libopencv-dev lld

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set PYO3_PYTHON environment variable
        run: echo "PYO3_PYTHON=$(which python3)" >> $GITHUB_ENV

      - name: Set up Python virtual environment
        run: |
          python3 -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> $GITHUB_PATH
          venv/bin/pip install --upgrade pip setuptools wheel
          venv/bin/pip install maturin[patchelf,zig]

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview

      - name: Set up Rust nightly toolchain (for Python builds)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_NIGHTLY_VERSION }}
          components: llvm-tools-preview

      - name: Set Rust stable as default toolchain
        run: rustup default ${{ env.RUST_STABLE_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-aarch64
          cache-on-failure: true

      - name: Install cargo tools
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-llvm-cov@0.6.16,cargo-nextest

      # NOTE: cargo fmt and clippy run in build-and-test-x86 — no need to repeat
      # on aarch64 since they are platform-independent.

      - name: Set up coverage instrumentation
        run: .github/scripts/setup-coverage-env.sh

      - name: Build Python bindings with coverage instrumentation
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY_VERSION }}
        run: |
          source /tmp/coverage-env.sh
          # No zig/manylinux - target glibc (2.41) is newer than Ubuntu 22.04 (2.35)
          for pkg in tensor codec image decoder tracker; do
            venv/bin/maturin build \
              --manifest-path "crates/python-$pkg/Cargo.toml" \
              --out target/wheels \
              --profile profiling \
              --features abi3-py311 \
              --auditwheel skip
          done

      - name: Build runner test binaries (no-run)
        run: |
          source /tmp/coverage-env.sh
          # --exclude the four python-* crates: --workspace unions features
          # across every member, so without this edgefirst-tensor gets both
          # `static` (default) and `dynamic` (python-*'s request) activated
          # at once and fails its own mutual-exclusion guard.
          cargo nextest run --no-run --cargo-profile profiling --features default,opencv --workspace \
            --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common
          mkdir -p runner-test-binaries
          find target/llvm-cov-target/profiling/deps/ -maxdepth 1 -type f -executable \
            ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" ! -name "*.so" \
            -exec cp {} runner-test-binaries/ \; 2>/dev/null || true
          echo "Runner test binaries:"
          ls -la runner-test-binaries/ || echo "No test binaries found"

      - name: Build hardware test binaries (GPU/DMA tests only)
        run: |
          source /tmp/coverage-env.sh
          # Only build crates that exercise hardware paths (G2D, EGL, DMA).
          # CPU-only crates (bench, decoder, tracker, capi) run on the aarch64 runner.
          # Exclude opencv — no opencv tests run on hardware, and dropping it
          # significantly reduces binary size (faster transfer to embedded target).
          # LTO=thin in the profiling profile strips unreachable code across crates.
          cargo nextest run --no-run --cargo-profile profiling \
            --package edgefirst-image \
            --features opengl,g2d_test_formats,dma_test_formats
          cargo nextest run --no-run --cargo-profile profiling \
            --package edgefirst-tensor
          mkdir -p hardware-test-binaries
          find target/llvm-cov-target/profiling/deps/ -maxdepth 1 -type f -executable \
            ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" ! -name "*.so" \
            -exec cp {} hardware-test-binaries/ \; 2>/dev/null || true
          find target/profiling/deps/ -maxdepth 1 -type f -executable \
            ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" ! -name "*.so" \
            -exec cp {} hardware-test-binaries/ \; 2>/dev/null || true
          echo "Instrumented test binaries:"
          ls -la hardware-test-binaries/ || echo "No test binaries found"

      - name: Build and test modular C-API crates (aarch64)
        # The five modular C-API leaves (tensor/image/codec/decoder/tracker-capi)
        # are standalone packages excluded from --workspace, so the nextest
        # --no-run build above never reaches them, and test-arm's pre-built
        # binary sweep has no runner-test-binaries/ entries for them either.
        # Run them here instead, natively on this runner (full checkout +
        # toolchain), rather than trying to ship their artifacts to test-arm:
        # `make test-capi-modular` rebuilds each leaf's cdylib fresh
        # (capi-libs prerequisite) then runs its tests with
        # EF_REQUIRE_FRESH_ARTIFACTS=1, which hard-fails on a stale artifact
        # instead of the silent skip the old cross-job binary sweep risked.
        run: make test-capi-modular

      - name: Prepare stripped binaries for hardware deployment
        run: |
          set -euo pipefail
          # Cross-compiled aarch64 test binaries built with --profile profiling
          # carry full DWARF debug info AND coverage instrumentation. The
          # `__llvm_prf_*` ELF sections that drive profraw generation are
          # independent of DWARF — `strip --strip-debug` removes the debug
          # info while preserving the instrumentation, shrinking each binary
          # ~5-10× and proportionally reducing the artifact download on the
          # on-target runner. The unstripped originals stay in place for:
          #   - test-arm (in-place coverage processing, uses runner-test-binaries/)
          #   - process-hardware-coverage (host-side llvm-cov export, uses
          #     coverage-binaries-aarch64)
          # so source-line attribution still works for both Rust and Python
          # profraw files captured on hardware.

          mkdir -p hardware-test-binaries-stripped
          cp -a hardware-test-binaries/. hardware-test-binaries-stripped/
          for bin in hardware-test-binaries-stripped/*; do
            [ -x "$bin" ] && file "$bin" 2>/dev/null | grep -q "ELF" \
              && strip --strip-debug "$bin"
          done

          # Python wheels — use the venv's `wheel` to unpack and repack so the
          # PEP 376 RECORD manifest (SHA256 hashes of every file) is
          # regenerated after the embedded .so files are stripped. pip will
          # warn or fail on RECORD mismatch otherwise.
          mkdir -p target/wheels-stripped
          for whl_in in target/wheels/*.whl; do
            [ -f "$whl_in" ] || continue
            tmp=$(mktemp -d)
            venv/bin/wheel unpack --dest "$tmp" "$whl_in"
            find "$tmp" -name "*.so" -exec strip --strip-debug {} \;
            unpacked_dir=$(ls -d "$tmp"/*/ | head -1)
            venv/bin/wheel pack --dest-dir target/wheels-stripped "$unpacked_dir"
            rm -rf "$tmp"
          done

          echo "=== Hardware deployment artifact sizes (stripped vs original) ==="
          du -sh hardware-test-binaries/ hardware-test-binaries-stripped/
          du -sh target/wheels/ target/wheels-stripped/

      - name: Upload runner test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runner-test-artifacts
          path: |
            runner-test-binaries/
            target/wheels/*.whl
          retention-days: 7

      - name: Upload hardware test artifacts (stripped, fast on-target download)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hardware-test-binaries
          path: |
            target/wheels-stripped/*.whl
            hardware-test-binaries-stripped/
          retention-days: 7

      - name: Upload coverage instrumented binaries (for profraw processing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-binaries-aarch64
          path: |
            hardware-test-binaries/
            target/llvm-cov-target/profiling/deps/*.so
          retention-days: 7

  # ===========================================================================
  # Test on aarch64 runner (uses pre-built artifacts from build-arm)
  # ===========================================================================
  test-arm:
    name: Test (aarch64)
    runs-on: ubuntu-22.04-arm
    needs: [checkout-lfs, build-arm]
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          lfs: false  # LFS files downloaded separately

      - name: Download LFS testdata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/

      - name: Download runner test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: runner-test-artifacts
          path: .  # Download to workspace root to preserve directory structure

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Python virtual environment
        run: |
          python3 -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> $GITHUB_PATH
          venv/bin/pip install --upgrade pip setuptools wheel
          venv/bin/pip install slipcover pytest pytest-timeout pytest-benchmark
          venv/bin/pip install tensorflow pyyaml numpy pillow opencv-python-headless psutil safetensors
          # Install Python bindings from pre-built wheel
          # --no-deps: every edgefirst-* sibling is in this same wheel set, built
          # from this commit. Resolving the `~=` pins would let pip fetch a
          # PUBLISHED sibling from PyPI over the locally built one, so the suite
          # would silently test released code instead of this branch. Third-party
          # runtime deps are installed by the steps above.
          venv/bin/pip install --no-deps --force-reinstall target/wheels/*.whl

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview

      - name: Run pre-built Rust tests
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/profraw/rust-%p-%m.profraw
          # Test binaries were cross-compiled on build-arm; their baked-in
          # CARGO_MANIFEST_DIR paths don't resolve on this runner. Point
          # edgefirst_bench::testdata at the downloaded testdata directory.
          EDGEFIRST_TESTDATA_DIR: ${{ github.workspace }}/testdata
        run: |

          mkdir -p build/profraw build/rust-test-results
          chmod +x runner-test-binaries/* 2>/dev/null || true
          TEST_FAILED=0
          for test_bin in runner-test-binaries/*; do
            if [ -x "$test_bin" ] && [ -f "$test_bin" ]; then
              # Skip .so files (proc-macro shared libraries)
              if [[ "$test_bin" == *.so ]]; then
                continue
              fi
              test_name=$(basename "$test_bin")
              echo "=== Running $test_name ==="
              if ! "$test_bin" --test-threads=1 2>&1 | tee "build/rust-test-results/${test_name}.txt"; then
                echo "FAILED: $test_name"
                TEST_FAILED=1
              fi
            fi
          done
          [ $TEST_FAILED -eq 0 ] || exit 1

      - name: Run Python tests with coverage
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/profraw/py-%p-%m.profraw
          EDGEFIRST_TESTDATA_DIR: ${{ github.workspace }}/testdata
        run: |

          mkdir -p build/profraw
          venv/bin/python -m slipcover --xml --out target/coverage_python.xml \
            -m pytest tests/ -v --tb=short --junitxml=target/pytest_results.xml \
            2>&1 | tee build/test-metrics-python-aarch64.txt

      - name: Generate JUnit XML from Rust results
        if: always()
        run: python3 .github/scripts/generate_junit_xml.py build/rust-test-results build/rust_runner_results.xml

      - name: Process Rust coverage
        if: always()
        run: |
          TOOLCHAIN_ROOT=$(rustc --print sysroot)
          LLVM_PROFDATA=$(find "$TOOLCHAIN_ROOT" -name "llvm-profdata" -type f | head -1)
          LLVM_COV=$(find "$TOOLCHAIN_ROOT" -name "llvm-cov" -type f | head -1)

          PROFRAW_COUNT=$(find build/profraw/ -name "*.profraw" 2>/dev/null | wc -l)
          echo "Found $PROFRAW_COUNT profraw files"

          if [ "$PROFRAW_COUNT" -eq 0 ]; then
            echo "No profraw files, creating empty coverage"
            mkdir -p target
            echo "" > target/coverage_rust.lcov
            exit 0
          fi

          # Merge profraw files (--failure-mode=all skips corrupted files)
          "$LLVM_PROFDATA" merge -sparse --failure-mode=all build/profraw/*.profraw -o build/merged.profdata

          # Collect object files (test binaries + Python .so)
          FIRST_OBJ=""
          OBJECT_ARGS=""
          for obj in runner-test-binaries/*; do
            if [ -f "$obj" ] && file "$obj" | grep -q "ELF"; then
              if [ -z "$FIRST_OBJ" ]; then
                FIRST_OBJ="$obj"
              else
                OBJECT_ARGS="$OBJECT_ARGS --object=$obj"
              fi
            fi
          done
          # Include every extension module .so for PyO3 coverage. There are
          # four since 0.29, and taking only the first would silently drop
          # three quarters of the binding coverage.
          for PY_SO in $(find venv/ -path "*/edgefirst/*" -name "_*.so" -type f); do
            OBJECT_ARGS="$OBJECT_ARGS --object=$PY_SO"
          done

          if [ -z "$FIRST_OBJ" ]; then
            echo "No ELF binaries found, creating empty coverage"
            mkdir -p target
            echo "" > target/coverage_rust.lcov
            exit 0
          fi

          mkdir -p target
          "$LLVM_COV" export --format=lcov --instr-profile=build/merged.profdata \
            --ignore-filename-regex='(\.cargo|/rustc/|/target/)' \
            $FIRST_OBJ $OBJECT_ARGS > target/coverage_rust.lcov 2>/dev/null || echo "" > target/coverage_rust.lcov

          echo "=== Coverage summary ==="
          echo "Source files in coverage: $(grep -c '^SF:' target/coverage_rust.lcov || echo 0)"
          echo "PyO3 files with coverage:"
          grep '^SF:.*crates/python' target/coverage_rust.lcov || echo "  (none found)"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-aarch64
          path: |
            target/coverage_rust.lcov
            target/coverage_python.xml
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-aarch64
          path: |
            target/pytest_results.xml
            build/rust_runner_results.xml
            build/test-metrics-python-aarch64.txt
            build/test-metrics-capi-aarch64.txt
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2.23.0
        if: always()
        with:
          files: |
            target/pytest_results.xml
            build/rust_runner_results.xml
          check_name: Test Results (aarch64)
          comment_mode: always
          ignore_runs: true

  # ===========================================================================
  # Hardware Testing on NXP i.MX8M Plus
  # ===========================================================================
  hardware-test:
    name: Hardware Test (imx8mp)
    needs: [checkout-lfs, build-arm]
    runs-on: nxp-imx8mp-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Clean workspace
        run: |
          rm -rf build/ venv/ target/ rust-tests/ testdata/ \
                 hardware-test-binaries-stripped/ 2>/dev/null || true
          find . -name "*.gcda" -o -name "*.profraw" -delete 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false  # LFS files downloaded separately

      - name: Download LFS testdata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/

      - name: Download aarch64 test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: hardware-test-binaries
          path: .  # Download to workspace root to preserve directory structure

      - name: Set up Python virtual environment
        run: |
          python3 -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> $GITHUB_PATH
          venv/bin/pip install --upgrade pip setuptools wheel
          venv/bin/pip install slipcover pytest pytest-timeout pytest-benchmark numpy pillow psutil safetensors
          # Install Python bindings from pre-built wheel (stripped for fast
          # download; coverage processing on the host uses the unstripped
          # copy from coverage-binaries-aarch64).
          # --no-deps: every edgefirst-* sibling is in this same wheel set, built
          # from this commit. Resolving the `~=` pins would let pip fetch a
          # PUBLISHED sibling from PyPI over the locally built one, so the suite
          # would silently test released code instead of this branch. Third-party
          # runtime deps are installed by the steps above.
          venv/bin/pip install --no-deps --force-reinstall target/wheels-stripped/*.whl

      - name: Debug environment info
        run: |
          echo "=== System Info ===" && uname -a
          echo "=== DMA heap ===" && ls -la /dev/dma_heap/ 2>/dev/null || echo "Not found"
          echo "=== G2D ===" && ls -la /dev/galcore 2>/dev/null || echo "Not found"
          echo "=== Downloaded artifacts ===" && find . -name "*.so*" -o -name "profiling" -type d 2>/dev/null || echo "Not found"
          echo "=== Test binaries ===" && ls -la hardware-test-binaries-stripped/ 2>/dev/null || echo "Not found"

      - name: Run Python tests with coverage
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/profraw/%p-%m.profraw
          EDGEFIRST_TESTDATA_DIR: ${{ github.workspace }}/testdata
        run: |
          mkdir -p build/profraw
          export LD_LIBRARY_PATH=$(pwd)/target/profiling:$LD_LIBRARY_PATH
          # Run pytest and capture exit code separately from process exit.
          # On i.MX hardware, the Vivante GPU driver may cause a SIGABRT
          # ("corrupted double-linked list") during Python interpreter shutdown
          # after all tests have passed. This is an uncatchable C-level crash
          # in the EGL driver's atexit cleanup — see ARCHITECTURE.md for details.
          # We use the JUnit XML result as the source of truth for test outcomes.
          EXIT_CODE=0
          venv/bin/python -m slipcover --xml --out build/coverage_python.xml \
            -m pytest tests/ -v --tb=short --junitxml=build/pytest_results.xml \
            2>&1 | tee build/test-metrics-python-imx8mp.txt || EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            if [ -f build/pytest_results.xml ] && grep -q 'failures="0"' build/pytest_results.xml && grep -q 'errors="0"' build/pytest_results.xml; then
              echo "::warning::Python process exited with code $EXIT_CODE (likely GPU driver crash during shutdown) but all tests passed"
            else
              echo "::error::Python tests failed with exit code $EXIT_CODE"
              exit $EXIT_CODE
            fi
          fi

      - name: Run pre-built Rust tests (hardware-dependent only)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/profiling:$LD_LIBRARY_PATH
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/profraw/rust-%p-%m.profraw
          # Cross-compiled binaries cannot use their compile-time CARGO_MANIFEST_DIR
          # path on this runner; point edgefirst_bench::testdata at the downloaded
          # testdata directory.
          EDGEFIRST_TESTDATA_DIR: ${{ github.workspace }}/testdata
        run: |
          # Only run tests that exercise hardware (G2D, OpenGL/EGL, DMA).
          # CPU-only tests already run on the ubuntu-22.04-arm-xlarge runner.
          mkdir -p build/rust-test-results build/profraw
          chmod +x hardware-test-binaries/* 2>/dev/null || true
          TEST_FAILED=0

          run_filtered() {
            local test_bin="$1" filter="$2" label="$3"
            local test_name
            test_name=$(basename "$test_bin")
            echo "=== Running $test_name ($label) ==="
            EXIT_CODE=0
            local logfile="build/rust-test-results/${test_name}-${label// /-}.txt"
            "$test_bin" "$filter" --test-threads=1 2>&1 | tee "$logfile" || EXIT_CODE=$?
            if [ $EXIT_CODE -ne 0 ]; then
              # Check if all tests actually passed but process crashed on
              # exit (Vivante GPU driver SIGABRT during library unload)
              if grep -q 'test result: ok' "$logfile" && \
                 ! grep -q 'FAILED' "$logfile"; then
                echo "::warning::$test_name ($label) exited with code $EXIT_CODE (likely GPU driver crash during shutdown) but all tests passed"
              else
                echo "FAILED: $test_name ($label)"
                TEST_FAILED=1
              fi
            fi
          }

          for test_bin in hardware-test-binaries-stripped/*; do
            [[ -x "$test_bin" && -f "$test_bin" ]] || continue
            [[ "$test_bin" == *.so ]] && continue
            test_name=$(basename "$test_bin")

            if [[ "$test_name" == edgefirst_image-* ]]; then
              # G2D tests (g2d.rs module + lib.rs g2d integration tests)
              run_filtered "$test_bin" g2d "G2D tests"
              # OpenGL/EGL tests (gl/tests.rs + lib.rs opengl integration tests)
              run_filtered "$test_bin" opengl "OpenGL tests"
            elif [[ "$test_name" == edgefirst_tensor-* ]]; then
              # DMA-heap tensor tests only
              run_filtered "$test_bin" dma "DMA tests"
            else
              echo "=== Skipping $test_name (CPU-only, covered by aarch64 runner) ==="
            fi
          done
          [ $TEST_FAILED -eq 0 ] || exit 1

      - name: Generate JUnit XML from Rust results
        if: always()
        run: python3 .github/scripts/generate_junit_xml.py build/rust-test-results build/rust_hardware_results.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-imx8mp
          path: |
            build/coverage_python.xml
            build/profraw/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-imx8mp
          path: |
            build/pytest_results.xml
            build/rust_hardware_results.xml
            build/test-metrics-python-imx8mp.txt
            build/test-metrics-capi-imx8mp.txt
          retention-days: 30

      - name: Test results summary (imx8mp)
        if: always()
        run: |
          echo "## Hardware Test Results (imx8mp)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/pytest_results.xml ]; then
            echo "- Python tests completed - see artifacts for details" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f build/rust_hardware_results.xml ]; then
            echo "- Rust tests completed - see artifacts for details" >> $GITHUB_STEP_SUMMARY
          fi


  # ===========================================================================
  # Process Hardware Coverage (profraw -> LCOV)
  # ===========================================================================
  process-hardware-coverage:
    name: Process Hardware Coverage
    needs: [build-arm, hardware-test]
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Download coverage instrumented binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-binaries-aarch64
          path: target/llvm-cov-target/profiling/deps/

      - name: Download imx8mp coverage (contains profraw files)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-imx8mp
          path: coverage-imx8mp/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview

      - name: Process Rust profraw files
        run: |
          PROFRAW_COUNT=$(find coverage-imx8mp/ -name "*.profraw" 2>/dev/null | wc -l)
          echo "Found $PROFRAW_COUNT profraw files"

          if [ "$PROFRAW_COUNT" -eq 0 ]; then
            echo "No profraw files, creating empty coverage"
            mkdir -p output && echo "" > output/coverage_rust_imx8mp.lcov
            exit 0
          fi

          TOOLCHAIN_ROOT=$(rustc --print sysroot)
          LLVM_PROFDATA=$(find "$TOOLCHAIN_ROOT" -name "llvm-profdata" -type f | head -1)
          LLVM_COV=$(find "$TOOLCHAIN_ROOT" -name "llvm-cov" -type f | head -1)

          mkdir -p output
          # --failure-mode=all: skip corrupted profraw files (e.g. from GPU driver
          # SIGABRT on test exit) instead of failing the entire merge.
          "$LLVM_PROFDATA" merge -sparse --failure-mode=all \
            $(find coverage-imx8mp/ -name "*.profraw") -o output/imx8mp.profdata

          OBJECT_FILES=""
          for obj in $(find target/llvm-cov-target -type f ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" 2>/dev/null); do
            if file "$obj" 2>/dev/null | grep -q "ELF"; then
              [ -z "$OBJECT_FILES" ] && OBJECT_FILES="$obj" || OBJECT_FILES="$OBJECT_FILES --object=$obj"
            fi
          done

          if [ -z "$OBJECT_FILES" ]; then
            echo "No ELF binaries found, creating empty coverage"
            echo "" > output/coverage_rust_imx8mp.lcov
            exit 0
          fi

          "$LLVM_COV" export --format=lcov --instr-profile=output/imx8mp.profdata \
            --ignore-filename-regex='/.cargo/registry|/rustc/' \
            --path-equivalence="/home/runner/work/hal/hal","${{ github.workspace }}" \
            $OBJECT_FILES > output/coverage_rust_imx8mp.lcov 2>/dev/null || echo "" > output/coverage_rust_imx8mp.lcov

          echo "Generated coverage_rust_imx8mp.lcov: $(wc -l < output/coverage_rust_imx8mp.lcov) lines"

      - name: Upload processed coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-imx8mp-processed
          path: |
            output/coverage_rust_imx8mp.lcov
            coverage-imx8mp/build/coverage_python.xml
          retention-days: 30

  # ===========================================================================
  # SonarCloud Analysis
  # ===========================================================================
  sonarcloud:
    name: SonarCloud Analysis
    needs: [doc-tests, build-and-test-x86, build-and-test-macos, build-and-test-windows, software-gl-coverage, test-arm, process-hardware-coverage]
    runs-on: ubuntu-22.04
    # !cancelled() keeps analysis running even when a needed lane fails or
    # skips — otherwise a single macOS/ANGLE failure silently skips SonarCloud
    # for the whole PR. Coverage aggregation globs whatever artifacts exist.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          path: coverage/

      - name: Organize coverage files
        run: |
          echo "=== Downloaded coverage artifacts ==="
          find coverage/ -type f

          echo "=== Fixing Python coverage paths ==="
          for xml in $(find coverage/ -name "coverage_python.xml" -type f); do
            python3 .github/scripts/fix_coverage_paths.py "$xml" tests
          done

          echo "=== Normalizing LCOV source paths to repo-relative ==="
          # cargo-llvm-cov writes absolute SF: paths. The Linux lanes'
          # /home/runner/work/hal/hal/... happen to match this scanner
          # host's checkout, so they resolved by accident; the macOS
          # lane's /Users/runner/work/hal/hal/... never did — its
          # coverage (the only ANGLE/IOSurface GL coverage) was silently
          # dropped by SonarCloud. Strip everything up to the repo root
          # so every lane resolves identically, on any runner layout.
          # The Windows lane (D:\a\hal\hal\..., backslashes) is already
          # normalized by scripts/normalize-lcov-paths.ps1; the backslash
          # and drive-letter cases here are the safety net for it.
          for lcov in $(find coverage/ -name "*.lcov" -type f); do
            sed -i -E '/^SF:/{s|\\|/|g; s|^SF:.*/work/hal/hal/|SF:|; s|^SF:[A-Za-z]:/a/hal/hal/|SF:|}' "$lcov"
          done

          RUST_REPORTS=$(find coverage/ -name "*.lcov" | tr '\n' ',' | sed 's/,$//')
          PYTHON_REPORTS=$(find coverage/ -name "coverage_python.xml" | tr '\n' ',' | sed 's/,$//')

          echo "Rust: $RUST_REPORTS"
          echo "Python: $PYTHON_REPORTS"
          echo "RUST_COVERAGE_PATHS=$RUST_REPORTS" >> $GITHUB_ENV
          echo "PYTHON_COVERAGE_PATHS=$PYTHON_REPORTS" >> $GITHUB_ENV

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432  # v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            "-Dsonar.rust.lcov.reportPaths=${{ env.RUST_COVERAGE_PATHS }}"
            "-Dsonar.python.coverage.reportPaths=${{ env.PYTHON_COVERAGE_PATHS }}"
            "-Dsonar.verbose=true"

      - name: Generate summary
        if: always()
        run: |
          {
            echo "# HAL Test & Coverage Summary"
            echo ""
            echo "## Test Platforms"
            echo "| Platform | Architecture | Tests |"
            echo "|----------|--------------|-------|"
            echo "| Ubuntu 22.04 | x86_64 | Rust, Python, C API |"
            echo "| Ubuntu 22.04 | aarch64 | Rust, Python, C API |"
            echo "| macOS | Apple Silicon | Rust, C API |"
            echo "| Windows | x86_64 | Rust (ANGLE/D3D11 WARP), C API, Python wheels |"
            echo "| iOS | arm64 (device + simulator) | Rust build + link validation |"
            echo "| NXP i.MX8M Plus | aarch64 | Rust, Python, C API (DMA, G2D) |"
            echo ""
            python3 .github/scripts/coverage_summary.py --github-actions
            echo ""
            echo "## SonarCloud"
            echo "- [Dashboard](https://sonarcloud.io/summary/overall?id=EdgeFirstAI_hal&branch=${{ github.ref_name }})"
          } >> $GITHUB_STEP_SUMMARY
