# Caller of the shared tag workflow. Merged release/X.Y.Z PR → annotated vX.Y.Z.
# Never tag by hand.
#
# Step 2 of 3: release.yml builds on the release branch, this names the result,
# publish.yml ships it. The tag itself builds nothing.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@55bc02295af9878e74007b5f9e00fffbffcff62e
    with:
      # No tag unless release.yml is green for the exact commit being merged.
      # Branch protection requires ci-gate alone and the release build runs on
      # a branch push rather than on the PR, so this is the one place "the
      # artifacts exist before the tag does" is actually enforced.
      require-build: release.yml
    secrets: inherit
