# Caller of the shared tag workflow. Merged release/X.Y.Z PR → annotated vX.Y.Z.
# Never tag by hand.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@d1a10d27e189a241cdd38adf4eedf7b4af3dc2e7
    secrets: inherit
