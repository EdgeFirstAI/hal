# Caller of the shared tag workflow. Merged release/X.Y.Z PR → annotated vX.Y.Z.
# Never tag by hand.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@a9b62d8918435787be65aae7f840a666a641a557
    secrets: inherit
