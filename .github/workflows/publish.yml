# Publish
#
# Step 3 of 3:
#
#   release.yml   push to release/X.Y.Z  -> build every artifact
#   tag-release.yml  release PR merged   -> annotated vX.Y.Z tag
#   publish.yml   push of a vX.Y.Z tag   -> publish what was built (this file)
#
# Finds the release.yml run that built this tag's artifacts, checks that the
# run produced the tree the tag points at, and uploads. A missing artifact, an
# expired artifact or a tree mismatch fails the publish. `cargo publish
# --no-verify` packages the crates from the source tree. A workflow_dispatch
# resolves, verifies and downloads everything and publishes nothing.
#
# Jobs:
#   resolve             finds the release build run and binds it by tree SHA
#   verify-version      checks every version surface against the tag
#   validate-artifacts  downloads the artifacts and checks the release set
#   publish-tensor      publishes edgefirst-tensor to PyPI
#   publish-dependents  publishes the other packages to PyPI
#   verify-release      installs the published packages into clean environments
#   publish-crates      publishes the crates to crates.io in dependency order
#   create-release      creates the GitHub Release
#
# Trusted Publisher Configuration (one per distribution):
# - PyPI: https://pypi.org/manage/project/<name>/settings/publishing/
#   for edgefirst-tensor, edgefirst-codec, edgefirst-image, edgefirst-decoder,
#   edgefirst-tracker, edgefirst-kernels
#   Owner: EdgeFirstAI, Repository: hal, Workflow: publish.yml, Environment: pypi
# - crates.io: Owner: EdgeFirstAI, Repository: hal, Workflow: publish.yml,
#   Environment: crates-io
#
# Action Versions (hash-pinned for security per Au-Zone SPS v2.1):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 (v7.0.0)
# - actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c (v8.0.1)
# - dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de (v1)
# - rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 (v1.0.5)
# - pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 (v1.14.2)
# - softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 (v3.0.3)

name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, e.g. v0.33.0 (publishes nothing)'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE_VERSION: '1.94.0'

jobs:
  # Finds the release.yml run for this tag's release branch and binds it by
  # tree SHA.
  resolve:
    name: Resolve the release build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.resolve.outputs.run-id }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publishing: ${{ steps.resolve.outputs.publishing }}
    steps:
      - id: resolve
        uses: EdgeFirstAI/.github/.github/actions/resolve-release-build@0cbb8f91f0d3e7d15726329f3fa651450bfdbbf0
        with:
          build-workflow: release.yml
          tag: ${{ inputs.tag }}

  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [resolve]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Check every version surface against the tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 .github/scripts/verify_version.py "${VERSION}"


  # Downloads the artifacts and checks the release set, on a tag push and on a
  # workflow_dispatch.
  validate-artifacts:
    name: Validate the built artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [resolve]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download C API archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: capi-*
          path: dist
          merge-multiple: true

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          name: sbom
          path: dist

      - name: The release set is complete and carries this version
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          fail=0
          note() { echo "::error::$1"; fail=1; }

          # Every distribution, four platforms each.
          for pkg in tensor codec image decoder tracker kernels; do
            n="$(find dist -name "edgefirst_${pkg}-${VERSION}-*.whl" | wc -l | tr -d ' ')"
            if [[ "$n" -eq 0 ]]; then
              note "no edgefirst_${pkg} wheels at ${VERSION}"
            else
              echo "ok  edgefirst_${pkg}: ${n} wheels"
            fi
          done

          # Every wheel carries this version.
          while IFS= read -r w; do
            case "$(basename "$w")" in
              *-"${VERSION}"-*) ;;
              *) note "$(basename "$w") does not carry ${VERSION}" ;;
            esac
          done < <(find dist -name '*.whl')

          # One archive per C-API target.
          for t in x86_64-linux aarch64-linux aarch64-macos x86_64-macos x86_64-windows; do
            case "$t" in
              *-linux) ext=tar.gz ;;
              *) ext=zip ;;
            esac
            if [[ -f "dist/edgefirst-hal-${VERSION}-${t}.${ext}" ]]; then
              echo "ok  edgefirst-hal-${VERSION}-${t}.${ext}"
            else
              note "missing edgefirst-hal-${VERSION}-${t}.${ext}"
            fi
          done

          if [[ -f dist/sbom.json ]]; then
            echo "ok  sbom.json"
          else
            note "sbom.json missing"
          fi

          echo "--- release set ---"
          find dist -type f | sort | sed 's/^/  /'
          exit "$fail"

      - name: The changelog has notes for this version
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # create-release renders the body from this section.
          python3 .github/scripts/extract_release_notes.py CHANGELOG.md "$VERSION" > RELEASE_NOTES.md
          {
            echo "### Release notes for ${VERSION}"
            echo '```'
            cat RELEASE_NOTES.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-tensor:
    name: Publish edgefirst-tensor
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [resolve, verify-version, validate-artifacts]
    if: needs.resolve.outputs.publishing == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/edgefirst-tensor/
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Download tensor wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: wheels-*-tensor
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  publish-dependents:
    name: Publish edgefirst-${{ matrix.pkg }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [resolve, publish-tensor]
    if: needs.resolve.outputs.publishing == 'true'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pkg: [codec, image, decoder, tracker, kernels]
    environment:
      name: pypi
      url: https://pypi.org/project/edgefirst-${{ matrix.pkg }}/
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Download ${{ matrix.pkg }} wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: wheels-*-${{ matrix.pkg }}
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  verify-release:
    name: Verify the published set installs
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [resolve, publish-dependents]
    if: needs.resolve.outputs.publishing == 'true'
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install each package into a clean environment
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for p in edgefirst-tensor edgefirst-codec edgefirst-image edgefirst-decoder edgefirst-tracker edgefirst-kernels; do
            python -m venv "/tmp/v-$p"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if "/tmp/v-$p/bin/pip" install --quiet "$p==$VERSION"; then ok=1; break; fi
              echo "attempt $attempt: $p==$VERSION not installable yet; waiting"
              sleep 20
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$p==$VERSION never became installable."
              echo "::error::The release is partial. Yank every distribution"
              echo "::error::already published at $VERSION and re-release with a"
              echo "::error::new patch version -- PyPI forbids re-uploading one."
              exit 1
            fi
            mod="edgefirst.${p#edgefirst-}"
            "/tmp/v-$p/bin/python" -c "import $mod; print('$mod ok')"
          done

      - name: Verify a codec-only install does not pull the image stack
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python -m venv /tmp/v-codec-only
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if /tmp/v-codec-only/bin/pip install --quiet "edgefirst-codec==$VERSION"; then ok=1; break; fi
            echo "attempt $attempt: edgefirst-codec==$VERSION not installable yet; waiting"
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::edgefirst-codec==$VERSION never became installable."
            exit 1
          fi
          if /tmp/v-codec-only/bin/pip list --format=freeze | grep -q '^edgefirst-image='; then
            echo "::error::edgefirst-codec pulled in edgefirst-image; the split is not doing its job"
            exit 1
          fi
          echo "codec-only install is clean"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [resolve, verify-version, validate-artifacts]
    if: needs.resolve.outputs.publishing == 'true'
    environment:
      name: crates-io
      url: https://crates.io/crates/edgefirst-tensor/
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
        id: auth

      - name: Publish crates to crates.io (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_one() {
            local crate="$1" attempt
            echo "==> ${crate}"
            for attempt in 1 2 3 4 5 6; do
              if output=$(cargo publish --no-verify -p "${crate}" 2>&1); then
                echo "${output}"
                return 0
              fi
              echo "${output}"
              if echo "${output}" | grep -qE "already uploaded|already exists on crates.io"; then
                echo "::warning::${crate} already published — skipping"
                return 0
              fi
              if echo "${output}" | grep -q 'failed to select a version for the requirement `edgefirst-'; then
                echo "::warning::${crate}: a sibling crate is not in the index yet (attempt ${attempt}/6)"
                if [ "${attempt}" -lt 6 ]; then
                  sleep $((attempt * 30))
                fi
                continue
              fi
              return 1
            done
            echo "::error::${crate}: sibling crates still missing from the index after 6 attempts"
            return 1
          }
          # Dependency order: leaves first.
          for crate in \
            edgefirst-decoder-abi \
            edgefirst-tensor-abi \
            edgefirst-tensor-ffi \
            edgefirst-egl \
            edgefirst-gl \
            edgefirst-tensor \
            edgefirst-codec \
            edgefirst-tracker \
            edgefirst-kernels \
            edgefirst-decoder \
            edgefirst-image
          do
            publish_one "${crate}"
            sleep 15
          done

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [resolve, verify-version, validate-artifacts]
    if: needs.resolve.outputs.publishing == 'true'
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit the artifacts were verified against.
          ref: ${{ needs.resolve.outputs.sha }}
          # Full history and all tags.
          fetch-depth: 0

      - name: Download wheel artifacts (all six packages)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download C API artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: capi-*
          path: dist
          merge-multiple: true

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          name: sbom
          path: dist

      - name: Stage NOTICE alongside the SBOM
        run: cp NOTICE dist/NOTICE

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 .github/scripts/extract_release_notes.py CHANGELOG.md "$VERSION" > RELEASE_NOTES.md

      - name: Determine 'Latest' eligibility
        id: latest
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        # Only the highest stable semver tag is marked as the repo's "Latest"
        # release; rc tags are excluded from the comparison.
        run: |
          CURRENT="${TAG}"
          HIGHEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$CURRENT" = "$HIGHEST" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tag $CURRENT (highest stable: $HIGHEST) -> make_latest=$([ "$CURRENT" = "$HIGHEST" ] && echo true || echo false)"

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
          fail_on_unmatched_files: true
