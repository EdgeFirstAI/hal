# Release Build
#
# Step 1 of 3:
#
#   release.yml   push to release/X.Y.Z  -> build every artifact  (this file)
#   tag-release.yml  release PR merged   -> annotated vX.Y.Z tag
#   publish.yml   push of a vX.Y.Z tag   -> publish what was built
#
# Builds the Python wheel distributions across four platforms and one modular
# C API archive per target across five targets, verifies them, and uploads
# them with 30-day retention. It publishes nothing.
#
# Jobs:
#   verify-version            checks every version surface against the release branch
#   verify-publish-manifests  packages every publishable crate
#   build-wheels              builds, checks, attests and uploads the wheels
#   build-capi                builds, packages, smoke-tests, attests and uploads the C API archive
#   sbom                      generates the SBOM (sbom.yml)
#
# Action Versions (hash-pinned for security per Au-Zone SPS v2.1):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 (v7.0.0)
# - actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
# - dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de (v1)
# - actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 (v4.2.2)
# - ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 (v1.13.0)

# runner-class: larger

name: Release Build

on:
  push:
    branches:
      # Matches release/X.Y.Z.
      - 'release/[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE_VERSION: '1.94.0'

jobs:
  # Compares the release version against the workspace version, the lockfile,
  # every crate manifest, each pyproject's sibling pins, the CHANGELOG entry and
  # NOTICE.
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Check every version surface against the release branch
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "${REF_NAME}" in
            release/*) VERSION="${REF_NAME#release/}" ;;
            *)
              echo "::error::release.yml builds a release branch; got '${REF_NAME}'."
              echo "::error::Branch from main as release/X.Y.Z and push there."
              exit 1
              ;;
          esac
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${REF_NAME}' is not release/X.Y.Z"
            exit 1
          fi
          python3 .github/scripts/verify_version.py "${VERSION}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

  # Packages every crate with `cargo package` before anything is uploaded.
  verify-publish-manifests:
    name: Verify crates.io manifests package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt
      - name: cargo package every publishable crate
        run: |
          set -euo pipefail
          cargo package --no-verify \
            -p edgefirst-decoder-abi -p edgefirst-tensor-abi -p edgefirst-tensor-ffi \
            -p edgefirst-egl -p edgefirst-gl -p edgefirst-tensor \
            -p edgefirst-kernels -p edgefirst-codec -p edgefirst-image -p edgefirst-decoder -p edgefirst-tracker
          ls -la target/package/*.crate

      - name: Upload the packaged crates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 30

  build-wheels:
    needs: [verify-version]
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `sdist` is set on one lane. `zig` produces the manylinux wheels.
          - name: x86_64-linux
            runner: ubuntu-24.04-xlarge
            maturin-args: --zig --compatibility manylinux2014
            sdist: --sdist
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            maturin-args: --zig --compatibility manylinux2014
            sdist: ''
          - name: windows
            runner: windows-latest
            maturin-args: ''
            sdist: ''
          - name: macos
            runner: macos-latest-xlarge
            maturin-args: ''
            sdist: ''

    steps:
      - name: Install git-lfs (aarch64 runner)
        if: matrix.name == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install build dependencies (aarch64 runner)
        if: matrix.name == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld build-essential

      - name: Fetch ANGLE (Windows x64)
        # The Windows edgefirst-image wheel bundles ANGLE's libEGL.dll and
        # libGLESv2.dll next to _image.pyd (python-image/build.rs reads
        # EDGEFIRST_ANGLE_PATH).
        if: matrix.name == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-angle.sh --windows

      # Two passes over the same distributions, abi3-py311 and abi3-py38.
      # --sdist is passed for tracker and kernels only.
      - name: Build wheels (Python 3.11+ — zero-copy buffer protocol)
        uses: EdgeFirstAI/.github/.github/actions/maturin-build@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
        env:
          EDGEFIRST_ANGLE_PATH: ${{ matrix.name == 'windows' && format('{0}\target\angle\windows-x64\bin', github.workspace) || '' }}
        with:
          features: abi3-py311
          args: --auditwheel skip ${{ matrix.maturin-args }}
          builds: |
            [{"manifest": "crates/python-tensor/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-codec/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-image/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-decoder/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-tracker/Cargo.toml", "args": "${{ matrix.sdist }}"},
             {"manifest": "crates/python-kernels/Cargo.toml", "args": "${{ matrix.sdist }}"}]
          attest: false

      - name: Build wheels (Python 3.8+ — compatible fallback)
        uses: EdgeFirstAI/.github/.github/actions/maturin-build@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
        env:
          EDGEFIRST_ANGLE_PATH: ${{ matrix.name == 'windows' && format('{0}\target\angle\windows-x64\bin', github.workspace) || '' }}
        with:
          features: abi3-py38
          args: --auditwheel skip ${{ matrix.maturin-args }}
          builds: |
            [{"manifest": "crates/python-tensor/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-codec/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-image/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-decoder/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-tracker/Cargo.toml"},
             {"manifest": "crates/python-kernels/Cargo.toml"}]
          attest: false

      - name: Assert wheel layout
        shell: bash
        run: python3 scripts/check_wheel_layout.py target/wheels

      - name: Assert Mach-O LINKEDIT alignment
        shell: bash
        run: python3 scripts/check_macho_alignment.py target/wheels

      - name: Upload wheels (per package, so publish jobs can select)
        shell: bash
        run: |
          mkdir -p staged
          for pkg in tensor codec image decoder tracker kernels; do
            mkdir -p "staged/$pkg"
            mv target/wheels/edgefirst_${pkg}-*.whl "staged/$pkg/" 2>/dev/null || true
          done
          # sdists are staged with their own package
          for s in target/wheels/*.tar.gz; do
            [ -e "$s" ] || continue
            base=$(basename "$s"); pkg=${base#edgefirst_}; pkg=${pkg%%-*}
            mv "$s" "staged/$pkg/" 2>/dev/null || true
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: staged/*/*

      - name: Upload tensor wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-tensor", path: staged/tensor/*}

      - name: Upload codec wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-codec", path: staged/codec/*}

      - name: Upload image wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-image", path: staged/image/*}

      - name: Upload decoder wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-decoder", path: staged/decoder/*}

      - name: Upload tracker wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-tracker", path: staged/tracker/*}

      - name: Upload kernels wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-kernels", path: staged/kernels/*}

  # Builds one archive per target: tar.gz on Linux, zip on Windows and macOS.
  build-capi:
    name: Build modular C API (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [verify-version]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-24.04-xlarge
            rust_target: ''
            libdir: target/release
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
            rust_target: ''
            libdir: target/release
          - target: aarch64-macos
            runner: macos-latest-xlarge
            rust_target: ''
            libdir: target/release
          - target: x86_64-macos
            runner: macos-latest-xlarge
            rust_target: x86_64-apple-darwin
            libdir: target/x86_64-apple-darwin/release
          - target: x86_64-windows
            runner: windows-latest
            rust_target: ''
            libdir: target/release

    steps:
      - name: Install git-lfs (aarch64 runner)
        if: matrix.target == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt

      - name: Add cross-compile target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install build dependencies (aarch64 runner)
        if: matrix.target == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld build-essential

      - name: Build the modular C API libraries
        shell: bash
        run: |
          EXTRA=()
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            EXTRA+=(--target "${{ matrix.rust_target }}")
          fi
          for leaf in tensor image codec decoder tracker kernels; do
            echo "==> ${leaf}"
            CFG=()
            case "${leaf}" in image|codec|decoder) CFG=(--config .cargo/tensor-dynamic.toml) ;; esac
            cargo build --release \
              "${CFG[@]}" \
              --manifest-path "crates/${leaf}-capi/Cargo.toml" \
              --target-dir target \
              "${EXTRA[@]}"
          done

      - name: Resolve version
        id: ver
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TARGET="${{ matrix.target }}"
          case "${TARGET}" in
            *-linux) EXT=tar.gz ;;
            *) EXT=zip ;;
          esac
          echo "archive=edgefirst-hal-${VERSION}-${TARGET}.${EXT}" >> "$GITHUB_OUTPUT"

      - name: Fetch ANGLE (Windows x64)
        # The Windows C archive bundles ANGLE's libEGL.dll and libGLESv2.dll in
        # bin/ next to edgefirst_image.dll (package-capi.sh reads
        # EDGEFIRST_ANGLE_PATH).
        if: ${{ endsWith(matrix.target, '-windows') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-angle.sh --windows

      - name: Package one archive
        shell: bash
        env:
          EDGEFIRST_ANGLE_PATH: ${{ endsWith(matrix.target, '-windows') && format('{0}/target/angle/windows-x64/bin', github.workspace) || '' }}
        run: |
          mkdir -p staged
          ./scripts/package-capi.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --libdir "${{ matrix.libdir }}" \
            --outdir staged

      - name: Assert the archive name carries the tag version
        shell: bash
        run: |
          test -f "staged/${{ steps.ver.outputs.archive }}"
          echo "archive ${{ steps.ver.outputs.archive }} present"

      - name: Smoke the packaged archive
        if: ${{ !endsWith(matrix.target, '-windows') }}
        shell: bash
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            case "${{ matrix.target }}" in
              *-linux) sudo apt-get update && sudo apt-get install -y pkg-config ;;
              *-macos) brew install pkgconf ;;
            esac
          fi
          ./scripts/smoke-capi-archive.sh "staged/${{ steps.ver.outputs.archive }}"

      - name: Set up MSVC Developer Command Prompt
        if: ${{ endsWith(matrix.target, '-windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0

      - name: Smoke the packaged archive (Windows)
        if: ${{ endsWith(matrix.target, '-windows') }}
        shell: bash
        run: ./scripts/smoke-capi-archive-windows.sh "staged/${{ steps.ver.outputs.archive }}"


      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: staged/${{ steps.ver.outputs.archive }}

      - name: Upload C API artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: capi-${{ matrix.target }}
          path: staged/${{ steps.ver.outputs.archive }}
          retention-days: 30

  sbom:
    name: Generate SBOM
    needs: [verify-version]
    uses: ./.github/workflows/sbom.yml
