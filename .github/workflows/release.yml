# Release Build
#
# Step 1 of 3. A tag deploys and never builds:
#
#   release.yml   push to release/X.Y.Z  -> build every artifact  (this file)
#   tag-release.yml  release PR merged   -> annotated vX.Y.Z tag
#   publish.yml   push of a vX.Y.Z tag   -> publish what was built
#
# This file builds the five Python wheel distributions across four platforms
# and the five modular C API archives across five targets, verifies them, and
# uploads them with 30-day retention. It publishes nothing.
#
# It runs on `push` to the release branch, not on `pull_request`. A
# pull_request run builds a merge-preview commit that exists nowhere in
# history, so publish.yml could never bind its artifacts to the tag. A push
# run builds the branch head, and a squash merge reproduces that head's TREE
# on main even though the commit is a new one -- which is why publish.yml
# binds by tree rather than by commit. Confining this to release branches is
# also what keeps a 9-lane build off every ordinary push.
#
# Why it moved off the tag: five of hal's nine release tags failed, and every
# one of those was a build failure reached only at deploy time -- never a
# publishing failure. v0.32.0 failed three times in a row on a runner image
# without git-lfs, then the same image without a C compiler, then a rustup
# component conflict. No pull request could surface any of them, because no
# pull request can run a tag-triggered workflow, and each retry cost a tag
# delete and re-push. Those are now red release PRs.
#
# Action Versions (hash-pinned for security per Au-Zone SPS v2.1):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 (v7.0.0)
# - actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
# - dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de (v1)
# - actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 (v4.2.2)
# - ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 (v1.13.0)

# runner-class: larger
#   The release build is speed-optimised and bills for it: it runs a handful of
#   times per release, and a slow build is a release PR someone is waiting on.
#   Windows stays standard: the org has no Windows larger runner provisioned,
#   so a larger label would queue.

name: Release Build

on:
  push:
    branches:
      # Matches release/X.Y.Z. The shared tag workflow also accepts
      # release/X.Y.Z-rcN, but hal has never cut a release candidate and its
      # wheels would need PEP 440 spelling in the manifests first, so the
      # pattern here stays deliberately narrow.
      - 'release/[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  # A fixup commit on the release branch supersedes the build it interrupts.
  # publish.yml resolves the most recent successful run for the branch, so a
  # cancelled predecessor is never the one that gets published.
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE_VERSION: '1.94.0'

jobs:
  # Runs BEFORE anything is built or uploaded. `verify-release` also checks the
  # published result, but it `needs: [publish-dependents]` -- by then a stale
  # `~=` sibling pin has already gone to PyPI, and PyPI forbids re-uploading a
  # version, so its own remedy is to yank and burn the number. This job is the
  # recoverable check: it compares the tag against the workspace version, the
  # lockfile, every crate manifest, each pyproject's sibling pins, the CHANGELOG
  # entry and NOTICE, and fails the run while failing is still free.
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Check every version surface against the release branch
        id: version
        env:
          # Never interpolated into the script text: a ref name may contain
          # shell metacharacters.
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "${REF_NAME}" in
            release/*) VERSION="${REF_NAME#release/}" ;;
            *)
              echo "::error::release.yml builds a release branch; got '${REF_NAME}'."
              echo "::error::Branch from main as release/X.Y.Z and push there."
              exit 1
              ;;
          esac
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${REF_NAME}' is not release/X.Y.Z"
            exit 1
          fi
          python3 .github/scripts/verify_version.py "${VERSION}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

  # Manifest check runs before anything is uploaded. `cargo package` catches
  # unversioned publish=false deps (G1) without requiring the new version to
  # already exist on crates.io -- `cargo publish --dry-run` would.
  verify-publish-manifests:
    name: Verify crates.io manifests package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          # rust-toolchain.toml pins these components, so rustup installs them
          # on the first cargo invocation if the action did not. That install
          # races an already-present cargo-fmt on the ARM image and aborts the
          # build with "failed to install component: 'rustfmt-preview-...',
          # detected conflict: 'bin/cargo-fmt'". Naming them here means the
          # toolchain arrives complete and rustup has nothing left to add.
          components: clippy, rustfmt
      - name: cargo package every publishable crate
        run: |
          set -euo pipefail
          # One invocation so cargo resolves inter-member deps from the
          # workspace. Looping `cargo package -p` strips `path` and looks
          # on crates.io, which cannot see this version until after publish.
          # `--workspace` is wrong: it pulls in publish = false python crates.
          cargo package --no-verify \
            -p edgefirst-decoder-abi -p edgefirst-tensor-abi -p edgefirst-tensor-ffi \
            -p edgefirst-egl -p edgefirst-gl -p edgefirst-tensor \
            -p edgefirst-codec -p edgefirst-image -p edgefirst-decoder -p edgefirst-tracker
          ls -la target/package/*.crate

      # Kept as artifacts because Section 4.5.3 asks for it: publish.yml runs
      # `cargo publish --no-verify`, and skipping the verification compile on
      # the tag path is only defensible because packaging was exercised here,
      # on a branch a human reviewed. The files are provenance -- `cargo
      # publish` packages from source and cannot consume them -- so they are
      # the record of exactly what this release packaged.
      - name: Upload the packaged crates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 30

  build-wheels:
    needs: [verify-version]
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # Matches build-capi. Without it one platform's failure cancels the rest,
      # so a run reports a single broken lane and hides whatever else is also
      # broken -- and this workflow can only be exercised by a dispatch or a
      # tag, which makes every wasted run expensive.
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-24.04-xlarge
            maturin-args: --sdist --zig --compatibility manylinux2014
            maturin-deps: maturin[patchelf,zig]
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            maturin-args: --zig --compatibility manylinux2014
            maturin-deps: maturin[patchelf,zig]
          - name: windows
            runner: windows-latest
            maturin-args: ''
            maturin-deps: maturin
          - name: macos
            runner: macos-latest-xlarge
            maturin-args: ''
            maturin-deps: maturin

    steps:
      - name: Install git-lfs (aarch64 runner)
        # Defensive. The standard ARM image ships git-lfs, but the larger one
        # this lane used to run on did not, and actions/checkout shells out to
        # it for `lfs: true` -- the job then dies on its very first step with
        # "Unable to locate executable file: git-lfs". apt is a no-op when it
        # is already present. Installed before that checkout, not after,
        # because it is the checkout itself that needs it.
        if: matrix.name == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          # rust-toolchain.toml pins these components, so rustup installs them
          # on the first cargo invocation if the action did not. That install
          # races an already-present cargo-fmt on the ARM image and aborts the
          # build with "failed to install component: 'rustfmt-preview-...',
          # detected conflict: 'bin/cargo-fmt'". Naming them here means the
          # toolchain arrives complete and rustup has nothing left to add.
          components: clippy, rustfmt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install ${{ matrix.maturin-deps }}

      - name: Install build dependencies (aarch64 runner)
        # The ARM image ships neither lld nor a C compiler; the x86_64 one has
        # both. Recent stable rustc defaults to -fuse-ld=lld on Linux, so
        # without lld a bare build fails at link time with "collect2: fatal
        # error: cannot find 'ld'". build-essential is what supplies `cc`:
        # cargo-zigbuild's toolchain covers the TARGET, while build scripts
        # compile for the HOST, so without it every build script in the graph
        # fails with "linker `cc` not found". tensor/codec/image/decoder's
        # build.rs also nested-builds the workspace-excluded
        # edgefirst-tensor-capi through a plain `cargo build` rather than
        # maturin's --zig path, so that links natively too.
        if: matrix.name == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld build-essential

      - name: Fetch ANGLE (Windows x64)
        # The Windows edgefirst-image wheel bundles ANGLE's libEGL.dll +
        # libGLESv2.dll next to _image.pyd (python-image/build.rs reads
        # EDGEFIRST_ANGLE_PATH), giving `pip install edgefirst-image` the
        # Direct3D 11 GPU backend with no setup. Public release; no auth.
        if: matrix.name == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-angle.sh --windows

      - name: Build wheels (Python 3.11+ — zero-copy buffer protocol)
        shell: bash
        env:
          EDGEFIRST_ANGLE_PATH: ${{ matrix.name == 'windows' && format('{0}\target\angle\windows-x64\bin', github.workspace) || '' }}
          # Through env rather than interpolated into the script, so the value
          # is data the shell reads rather than text it parses.
          MATURIN_ARGS: ${{ matrix.maturin-args }}
        run: |
          # Four self-contained distributions since 0.29. Order is irrelevant to
          # the build (no shared object); it matters only at publish time.
          #
          # --sdist only for tracker. tensor/codec/image/decoder's build.rs
          # nested-builds the workspace-excluded edgefirst-tensor-capi via a
          # `../tensor-capi` relative path (dynamic backend); maturin builds
          # the wheel FROM the generated sdist whenever --sdist is passed,
          # and its sdist can never include a sibling outside the crate
          # directory (`include`/`exclude` patterns reject any `..`), so
          # `--sdist` against those four always fails with "manifest path
          # .../tensor-capi/Cargo.toml does not exist". tracker has no such
          # nested build and is the only one of the five safe to sdist.
          # An array rather than a string: the arguments are a list, and
          # splitting a string on whitespace to make one is how an argument
          # containing a space becomes two.
          read -ra base_args <<< "$MATURIN_ARGS"
          for pkg in tensor codec image decoder tracker; do
            args=()
            for a in "${base_args[@]}"; do
              if [ "$a" = "--sdist" ] && [ "$pkg" != "tracker" ]; then
                continue
              fi
              args+=("$a")
            done
            maturin build --release --auditwheel skip -m "crates/python-$pkg/Cargo.toml" \
              --features abi3-py311 "${args[@]}"
          done

      - name: Build wheels (Python 3.8+ — compatible fallback)
        shell: bash
        env:
          EDGEFIRST_ANGLE_PATH: ${{ matrix.name == 'windows' && format('{0}\target\angle\windows-x64\bin', github.workspace) || '' }}
          MATURIN_ARGS: ${{ matrix.maturin-args }}
        run: |
          # No --sdist at all: the sdists were generated in the py311 pass.
          read -ra base_args <<< "$MATURIN_ARGS"
          args=()
          for a in "${base_args[@]}"; do
            [ "$a" = "--sdist" ] && continue
            args+=("$a")
          done
          for pkg in tensor codec image decoder tracker; do
            maturin build --release --auditwheel skip -m "crates/python-$pkg/Cargo.toml" \
              --features abi3-py38 "${args[@]}"
          done

      - name: Assert wheel layout
        shell: bash
        run: python3 scripts/check_wheel_layout.py target/wheels

      - name: Assert Mach-O LINKEDIT alignment
        # rustc strips Apple binaries with its own in-process
        # Mach-O writer, which leaves the string pool 4-byte aligned whenever
        # a binary's nindirectsyms is odd, and dyld on macOS 26+ then refuses
        # to load the wheel. The parity is a coin flip per binary, so an
        # import smoke test on one build proves nothing about the next one --
        # this parses the wheels instead. Runs on every lane, not just macOS:
        # it is pure file parsing, the macOS lane is the one that can produce
        # a bad wheel, and a non-Mach-O wheel simply reports nothing to check.
        shell: bash
        run: python3 scripts/check_macho_alignment.py target/wheels

      - name: Assert the wheels carry the release version
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          # A mismatch means publishing a version nobody can install, and PyPI
          # will not let a version be re-used. It now fails on the release PR
          # rather than after the tag exists, which is the point of the split.
          for w in target/wheels/*.whl; do
            case "$(basename "$w")" in
              *-"$VERSION"-*) ;;
              *) echo "::error::$(basename "$w") does not carry release version $VERSION"; exit 1 ;;
            esac
          done
          echo "all wheels carry $VERSION"

      - name: Upload wheels (per package, so publish jobs can select)
        shell: bash
        run: |
          mkdir -p staged
          for pkg in tensor codec image decoder tracker; do
            mkdir -p "staged/$pkg"
            mv target/wheels/edgefirst_${pkg}-*.whl "staged/$pkg/" 2>/dev/null || true
          done
          # sdists (py311 pass only) ride along with their own package
          for s in target/wheels/*.tar.gz; do
            [ -e "$s" ] || continue
            base=$(basename "$s"); pkg=${base#edgefirst_}; pkg=${pkg%%-*}
            mv "$s" "staged/$pkg/" 2>/dev/null || true
          done


      - name: Attest build provenance
        # Attested here rather than at publish. Provenance generated where the
        # artifact was downloaded describes the download; generated where it
        # was built, it describes the build. publish.yml ships exactly these
        # files, so the attestation covers what consumers receive.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: staged/*/*

      - name: Upload tensor wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-tensor", path: staged/tensor/*}

      - name: Upload codec wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-codec", path: staged/codec/*}

      - name: Upload image wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-image", path: staged/image/*}

      - name: Upload decoder wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-decoder", path: staged/decoder/*}

      - name: Upload tracker wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {retention-days: 30, name: "wheels-${{ matrix.name }}-tracker", path: staged/tracker/*}

  # THE C RELEASE PATH SHIPS ONE ARCHIVE PER TARGET.
  #
  # One archive, not five (tar.gz on Linux, zip on Windows and macOS).
  # Modularity is the pkg-config graph and DT_NEEDED, both of which survive
  # inside a single relocatable prefix. A consumer who needs only JPEG decode
  # still links only tensor + codec; they just extract one archive instead of
  # two.
  build-capi:
    name: Build modular C API (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [verify-version]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-24.04-xlarge
            rust_target: ''
            libdir: target/release
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
            rust_target: ''
            libdir: target/release
          - target: aarch64-macos
            runner: macos-latest-xlarge
            rust_target: ''
            libdir: target/release
          - target: x86_64-macos
            runner: macos-latest-xlarge
            rust_target: x86_64-apple-darwin
            libdir: target/x86_64-apple-darwin/release
          - target: x86_64-windows
            runner: windows-latest
            rust_target: ''
            libdir: target/release

    steps:
      - name: Install git-lfs (aarch64 runner)
        # Defensive. The standard ARM image ships git-lfs, but the larger one
        # this lane used to run on did not, and actions/checkout shells out to
        # it for `lfs: true` -- the job then dies on its very first step with
        # "Unable to locate executable file: git-lfs". apt is a no-op when it
        # is already present. Installed before that checkout, not after,
        # because it is the checkout itself that needs it.
        if: matrix.target == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          # rust-toolchain.toml pins these components, so rustup installs them
          # on the first cargo invocation if the action did not. That install
          # races an already-present cargo-fmt on the ARM image and aborts the
          # build with "failed to install component: 'rustfmt-preview-...',
          # detected conflict: 'bin/cargo-fmt'". Naming them here means the
          # toolchain arrives complete and rustup has nothing left to add.
          components: clippy, rustfmt

      - name: Add cross-compile target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install build dependencies (aarch64 runner)
        # The ARM image ships neither lld nor a C compiler; the x86_64 one has
        # both. Recent stable rustc defaults to -fuse-ld=lld on Linux, so a
        # bare build fails at link time with "collect2: fatal error: cannot
        # find 'ld'", and a build script with no `cc` fails before that. See
        # the build-wheels job's identically-named step.
        if: matrix.target == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld build-essential

      - name: Build the five modular C API libraries
        shell: bash
        run: |
          EXTRA=()
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            EXTRA+=(--target "${{ matrix.rust_target }}")
          fi
          for leaf in tensor image codec decoder tracker; do
            echo "==> ${leaf}"
            cargo build --release \
              --manifest-path "crates/${leaf}-capi/Cargo.toml" \
              --target-dir target \
              "${EXTRA[@]}"
          done

      - name: Resolve version
        id: ver
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TARGET="${{ matrix.target }}"
          case "${TARGET}" in
            *-linux) EXT=tar.gz ;;
            *) EXT=zip ;;
          esac
          echo "archive=edgefirst-hal-${VERSION}-${TARGET}.${EXT}" >> "$GITHUB_OUTPUT"

      - name: Fetch ANGLE (Windows x64)
        # The Windows C archive bundles ANGLE's libEGL.dll + libGLESv2.dll in
        # bin/ next to edgefirst_image.dll (package-capi.sh reads
        # EDGEFIRST_ANGLE_PATH), so C consumers get the Direct3D 11 GPU
        # backend with no setup. Public release; no auth.
        if: ${{ endsWith(matrix.target, '-windows') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-angle.sh --windows

      - name: Package one archive
        shell: bash
        env:
          EDGEFIRST_ANGLE_PATH: ${{ endsWith(matrix.target, '-windows') && format('{0}/target/angle/windows-x64/bin', github.workspace) || '' }}
        run: |
          mkdir -p staged
          ./scripts/package-capi.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --libdir "${{ matrix.libdir }}" \
            --outdir staged

      - name: Assert the archive name carries the tag version
        shell: bash
        run: |
          test -f "staged/${{ steps.ver.outputs.archive }}"
          echo "archive ${{ steps.ver.outputs.archive }} present"

      - name: Smoke the packaged archive
        if: ${{ !endsWith(matrix.target, '-windows') }}
        shell: bash
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            case "${{ matrix.target }}" in
              *-linux) sudo apt-get update && sudo apt-get install -y pkg-config ;;
              *-macos) brew install pkgconf ;;
            esac
          fi
          ./scripts/smoke-capi-archive.sh "staged/${{ steps.ver.outputs.archive }}"

      - name: Set up MSVC Developer Command Prompt
        if: ${{ endsWith(matrix.target, '-windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0

      - name: Smoke the packaged archive (Windows)
        if: ${{ endsWith(matrix.target, '-windows') }}
        shell: bash
        run: ./scripts/smoke-capi-archive-windows.sh "staged/${{ steps.ver.outputs.archive }}"


      - name: Attest build provenance
        # Attested here rather than at publish. Provenance generated where the
        # artifact was downloaded describes the download; generated where it
        # was built, it describes the build. publish.yml ships exactly these
        # files, so the attestation covers what consumers receive.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: staged/${{ steps.ver.outputs.archive }}

      - name: Upload C API artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: capi-${{ matrix.target }}
          path: staged/${{ steps.ver.outputs.archive }}
          retention-days: 30

  sbom:
    name: Generate SBOM
    needs: [verify-version]
    uses: ./.github/workflows/sbom.yml
