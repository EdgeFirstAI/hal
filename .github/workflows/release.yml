# Release Workflow
#
# Builds Python wheels for multiple platforms and publishes to PyPI and crates.io
# on tagged releases. Supports both stable releases (X.Y.Z) and release candidates (X.Y.ZrcN).
#
# Action Versions (hash-pinned for security per Au-Zone SPS v2.1):
# - actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd (v6.0.2)
# - actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 (v6.2.0)
# - actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
# - actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c (v8.0.1)
# - dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 (v1)
# - rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe (v1.0.4)
# - pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b (v1.14.0)
# - softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda (v3.0.0)
#
# - actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f (v3.2.0)
# - ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 (v1.13.0)
#
# Trusted Publisher Configuration (one per distribution, since 0.29):
# - PyPI: https://pypi.org/manage/project/<name>/settings/publishing/
#   for edgefirst-tensor, edgefirst-codec, edgefirst-image, edgefirst-decoder,
#   edgefirst-tracker
#   Owner: EdgeFirstAI, Repository: hal, Workflow: release.yml, Environment: pypi
#
#   BOOTSTRAP: Trusted Publishing requires the project to already exist, so each
#   new distribution needs one manual upload with a local API token before this
#   workflow can publish it. See scripts/bootstrap_pypi_projects.sh.
# - crates.io: https://crates.io/settings/tokens
#   Owner: EdgeFirstAI, Repository: hal, Workflow: release.yml, Environment: crates-io
#   New layout crates (edgefirst-decoder-abi, edgefirst-tensor-abi,
#   edgefirst-tensor-ffi) need a first upload and Trusted Publishing too.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE_VERSION: '1.94.0'

jobs:
  # Runs BEFORE anything is built or uploaded. `verify-release` also checks the
  # published result, but it `needs: [publish-dependents]` -- by then a stale
  # `~=` sibling pin has already gone to PyPI, and PyPI forbids re-uploading a
  # version, so its own remedy is to yank and burn the number. This job is the
  # recoverable check: it compares the tag against the workspace version, the
  # lockfile, every crate manifest, each pyproject's sibling pins, the CHANGELOG
  # entry and NOTICE, and fails the run while failing is still free.
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check every version surface against the tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${DISPATCH_TAG}" ]]; then
            VERSION="${DISPATCH_TAG#v}"
          else
            echo "::error::no tag to verify against"
            exit 1
          fi
          python3 .github/scripts/verify_version.py "${VERSION}"

  # Manifest check runs before anything is uploaded. `cargo package` catches
  # unversioned publish=false deps (G1) without requiring the new version to
  # already exist on crates.io -- `cargo publish --dry-run` would.
  verify-publish-manifests:
    name: Verify crates.io manifests package
    runs-on: ubuntu-latest
    needs: [verify-version]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
      - name: cargo package every publishable crate
        run: |
          set -euo pipefail
          # One invocation so cargo resolves inter-member deps from the
          # workspace. Looping `cargo package -p` strips `path` and looks
          # on crates.io, which cannot see this version until after publish.
          # `--workspace` is wrong: it pulls in publish = false python crates.
          cargo package --no-verify \
            -p edgefirst-decoder-abi -p edgefirst-tensor-abi -p edgefirst-tensor-ffi \
            -p edgefirst-egl -p edgefirst-gl -p edgefirst-tensor \
            -p edgefirst-codec -p edgefirst-image -p edgefirst-decoder -p edgefirst-tracker

  build-wheels:
    needs: [verify-version]
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            maturin-args: --sdist --zig --compatibility manylinux2014
            maturin-deps: maturin[patchelf,zig]
          - name: aarch64-linux
            runner: ubuntu-22.04-arm
            maturin-args: --zig --compatibility manylinux2014
            maturin-deps: maturin[patchelf,zig]
          - name: windows
            runner: windows-latest
            maturin-args: ''
            maturin-deps: maturin
          - name: macos
            runner: macos-latest
            maturin-args: ''
            maturin-deps: maturin

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install ${{ matrix.maturin-deps }}

      - name: Install lld (aarch64 runner)
        # ubuntu-22.04-arm does not ship lld by default, unlike ubuntu-latest
        # (x86_64) -- recent stable rustc defaults to -fuse-ld=lld on Linux.
        # tensor/codec/image/decoder's build.rs nested-builds the
        # workspace-excluded edgefirst-tensor-capi via a plain `cargo build`
        # (not routed through maturin's --zig cross-compiler), so it links
        # natively and hits the same "collect2: fatal error: cannot find
        # 'ld'" the build-capi job's aarch64 runner hit -- see that job's
        # identically-named step, and test.yml's aarch64 lane.
        if: matrix.name == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Fetch ANGLE (Windows x64)
        # The Windows edgefirst-image wheel bundles ANGLE's libEGL.dll +
        # libGLESv2.dll next to _image.pyd (python-image/build.rs reads
        # EDGEFIRST_ANGLE_PATH), giving `pip install edgefirst-image` the
        # Direct3D 11 GPU backend with no setup. Public release; no auth.
        if: matrix.name == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-angle.sh --windows

      - name: Build wheels (Python 3.11+ — zero-copy buffer protocol)
        shell: bash
        env:
          EDGEFIRST_ANGLE_PATH: ${{ matrix.name == 'windows' && format('{0}\target\angle\windows-x64\bin', github.workspace) || '' }}
        run: |
          # Four self-contained distributions since 0.29. Order is irrelevant to
          # the build (no shared object); it matters only at publish time.
          #
          # --sdist only for tracker. tensor/codec/image/decoder's build.rs
          # nested-builds the workspace-excluded edgefirst-tensor-capi via a
          # `../tensor-capi` relative path (dynamic backend); maturin builds
          # the wheel FROM the generated sdist whenever --sdist is passed,
          # and its sdist can never include a sibling outside the crate
          # directory (`include`/`exclude` patterns reject any `..`), so
          # `--sdist` against those four always fails with "manifest path
          # .../tensor-capi/Cargo.toml does not exist". tracker has no such
          # nested build and is the only one of the five safe to sdist.
          ARGS="${{ matrix.maturin-args }}"
          for pkg in tensor codec image decoder tracker; do
            pkg_args="$ARGS"
            [ "$pkg" != "tracker" ] && pkg_args="${pkg_args//--sdist/}"
            maturin build --release --auditwheel skip -m "crates/python-$pkg/Cargo.toml" \
              --features abi3-py311 $pkg_args
          done

      - name: Build wheels (Python 3.8+ — compatible fallback)
        shell: bash
        env:
          EDGEFIRST_ANGLE_PATH: ${{ matrix.name == 'windows' && format('{0}\target\angle\windows-x64\bin', github.workspace) || '' }}
        run: |
          # Strip --sdist from args (sdists already generated in the py311 pass)
          ARGS="${{ matrix.maturin-args }}"
          for pkg in tensor codec image decoder tracker; do
            maturin build --release --auditwheel skip -m "crates/python-$pkg/Cargo.toml" \
              --features abi3-py38 ${ARGS//--sdist/}
          done

      - name: Assert wheel layout
        shell: bash
        run: python3 scripts/check_wheel_layout.py target/wheels

      - name: Assert the tag matches the built version
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # A mismatch here means publishing a version nobody can install, and
          # PyPI will not let the version be re-used. Fail before upload.
          TAG="${GITHUB_REF_NAME#v}"
          for w in target/wheels/*.whl; do
            case "$(basename "$w")" in
              *-"$TAG"-*) ;;
              *) echo "::error::$(basename "$w") does not carry tag version $TAG"; exit 1 ;;
            esac
          done
          echo "all wheels carry $TAG"

      - name: Upload wheels (per package, so publish jobs can select)
        shell: bash
        run: |
          mkdir -p staged
          for pkg in tensor codec image decoder tracker; do
            mkdir -p "staged/$pkg"
            mv target/wheels/edgefirst_${pkg}-*.whl "staged/$pkg/" 2>/dev/null || true
          done
          # sdists (py311 pass only) ride along with their own package
          for s in target/wheels/*.tar.gz; do
            [ -e "$s" ] || continue
            base=$(basename "$s"); pkg=${base#edgefirst_}; pkg=${pkg%%-*}
            mv "$s" "staged/$pkg/" 2>/dev/null || true
          done

      - name: Upload tensor wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: "wheels-${{ matrix.name }}-tensor", path: staged/tensor/*}

      - name: Upload codec wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: "wheels-${{ matrix.name }}-codec", path: staged/codec/*}

      - name: Upload image wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: "wheels-${{ matrix.name }}-image", path: staged/image/*}

      - name: Upload decoder wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: "wheels-${{ matrix.name }}-decoder", path: staged/decoder/*}

      - name: Upload tracker wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: "wheels-${{ matrix.name }}-tracker", path: staged/tracker/*}

  # THE C RELEASE PATH SHIPS ONE ARCHIVE PER TARGET.
  #
  # One archive, not five (tar.gz on Linux, zip on Windows and macOS).
  # Modularity is the pkg-config graph and DT_NEEDED, both of which survive
  # inside a single relocatable prefix. A consumer who needs only JPEG decode
  # still links only tensor + codec; they just extract one archive instead of
  # two.
  build-capi:
    name: Build modular C API (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-latest
            rust_target: ''
            libdir: target/release
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
            rust_target: ''
            libdir: target/release
          - target: aarch64-macos
            runner: macos-latest
            rust_target: ''
            libdir: target/release
          - target: x86_64-macos
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            libdir: target/x86_64-apple-darwin/release
          - target: x86_64-windows
            runner: windows-latest
            rust_target: ''
            libdir: target/release

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Add cross-compile target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install lld (aarch64 runner)
        # ubuntu-22.04-arm does not ship lld by default, unlike ubuntu-latest
        # (x86_64) -- recent stable rustc defaults to -fuse-ld=lld on Linux,
        # so a bare build here fails at link time with "collect2: fatal
        # error: cannot find 'ld'". test.yml's aarch64 runners already
        # install it for the same reason (`Install build dependencies`).
        if: matrix.target == 'aarch64-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Build the five modular C API libraries
        shell: bash
        run: |
          EXTRA=()
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            EXTRA+=(--target "${{ matrix.rust_target }}")
          fi
          for leaf in tensor image codec decoder tracker; do
            echo "==> ${leaf}"
            cargo build --release \
              --manifest-path "crates/${leaf}-capi/Cargo.toml" \
              --target-dir target \
              "${EXTRA[@]}"
          done

      - name: Resolve version
        id: ver
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${DISPATCH_TAG}" ]]; then
            VERSION="${DISPATCH_TAG#v}"
          else
            echo "::error::no tag on GITHUB_REF and no workflow_dispatch tag input"
            exit 1
          fi
          python3 .github/scripts/verify_version.py "${VERSION}" >/dev/null
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TARGET="${{ matrix.target }}"
          case "${TARGET}" in
            *-linux) EXT=tar.gz ;;
            *) EXT=zip ;;
          esac
          echo "archive=edgefirst-hal-${VERSION}-${TARGET}.${EXT}" >> "$GITHUB_OUTPUT"

      - name: Fetch ANGLE (Windows x64)
        # The Windows C archive bundles ANGLE's libEGL.dll + libGLESv2.dll in
        # bin/ next to edgefirst_image.dll (package-capi.sh reads
        # EDGEFIRST_ANGLE_PATH), so C consumers get the Direct3D 11 GPU
        # backend with no setup. Public release; no auth.
        if: ${{ endsWith(matrix.target, '-windows') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-angle.sh --windows

      - name: Package one archive
        shell: bash
        env:
          EDGEFIRST_ANGLE_PATH: ${{ endsWith(matrix.target, '-windows') && format('{0}/target/angle/windows-x64/bin', github.workspace) || '' }}
        run: |
          mkdir -p staged
          ./scripts/package-capi.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --libdir "${{ matrix.libdir }}" \
            --outdir staged

      - name: Assert the archive name carries the tag version
        shell: bash
        run: |
          test -f "staged/${{ steps.ver.outputs.archive }}"
          echo "archive ${{ steps.ver.outputs.archive }} present"

      - name: Smoke the packaged archive
        if: ${{ !endsWith(matrix.target, '-windows') }}
        shell: bash
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            case "${{ matrix.target }}" in
              *-linux) sudo apt-get update && sudo apt-get install -y pkg-config ;;
              *-macos) brew install pkgconf ;;
            esac
          fi
          ./scripts/smoke-capi-archive.sh "staged/${{ steps.ver.outputs.archive }}"

      - name: Set up MSVC Developer Command Prompt
        if: ${{ endsWith(matrix.target, '-windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0

      - name: Smoke the packaged archive (Windows)
        if: ${{ endsWith(matrix.target, '-windows') }}
        shell: bash
        run: ./scripts/smoke-capi-archive-windows.sh "staged/${{ steps.ver.outputs.archive }}"

      - name: Upload C API artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: capi-${{ matrix.target }}
          path: staged/${{ steps.ver.outputs.archive }}

  publish-tensor:
    name: Publish edgefirst-tensor
    runs-on: ubuntu-22.04
    needs: [build-wheels, verify-publish-manifests, build-capi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/project/edgefirst-tensor/
    permissions:
      id-token: write
    steps:
      - name: Download tensor wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*-tensor
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          skip-existing: true

  publish-dependents:
    name: Publish edgefirst-${{ matrix.pkg }}
    runs-on: ubuntu-22.04
    needs: [publish-tensor]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      # Sequential so a partial-publish failure is unambiguous about which
      # package got through.
      max-parallel: 1
      fail-fast: false
      matrix:
        pkg: [codec, image, decoder, tracker]
    environment:
      name: pypi
      url: https://pypi.org/project/edgefirst-${{ matrix.pkg }}/
    permissions:
      id-token: write
    steps:
      - name: Download ${{ matrix.pkg }} wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*-${{ matrix.pkg }}
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          skip-existing: true

  verify-release:
    name: Verify the published set installs
    runs-on: ubuntu-22.04
    needs: [publish-dependents]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
      - name: Install each package into a clean environment
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for p in edgefirst-tensor edgefirst-codec edgefirst-image edgefirst-decoder edgefirst-tracker; do
            python -m venv "/tmp/v-$p"
            ok=0
            # PyPI's index is eventually consistent; a fresh release can 404 for
            # a short while. Retry rather than yanking a good release.
            for attempt in 1 2 3 4 5 6; do
              if "/tmp/v-$p/bin/pip" install --quiet "$p==$VERSION"; then ok=1; break; fi
              echo "attempt $attempt: $p==$VERSION not installable yet; waiting"
              sleep 20
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$p==$VERSION never became installable."
              echo "::error::The release is partial. Yank every distribution"
              echo "::error::already published at $VERSION and re-release with a"
              echo "::error::new patch version -- PyPI forbids re-uploading one."
              exit 1
            fi
            mod="edgefirst.${p#edgefirst-}"
            "/tmp/v-$p/bin/python" -c "import $mod; print('$mod ok')"
          done

      - name: Verify a codec-only install does not pull the image stack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/v-codec-only
          /tmp/v-codec-only/bin/pip install --quiet "edgefirst-codec==$VERSION"
          if /tmp/v-codec-only/bin/pip list --format=freeze | grep -q '^edgefirst-image='; then
            echo "::error::edgefirst-codec pulled in edgefirst-image; the split is not doing its job"
            exit 1
          fi
          echo "codec-only install is clean"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-22.04
    needs: [build-wheels, verify-publish-manifests, build-capi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: crates-io
      url: https://crates.io/crates/edgefirst-tensor/
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe  # v1.0.4
        id: auth

      - name: Publish crates to crates.io (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_one() {
            local crate="$1"
            echo "==> ${crate}"
            if output=$(cargo publish --no-verify -p "${crate}" 2>&1); then
              echo "${output}"
              return 0
            fi
            echo "${output}"
            if echo "${output}" | grep -qE "already uploaded|already exists on crates.io"; then
              echo "::warning::${crate} already published — skipping"
              return 0
            fi
            return 1
          }
          # Leaves first so dependents can resolve the new version on crates.io.
          for crate in \
            edgefirst-decoder-abi \
            edgefirst-tensor-abi \
            edgefirst-tensor-ffi \
            edgefirst-egl \
            edgefirst-gl \
            edgefirst-tensor \
            edgefirst-codec \
            edgefirst-image \
            edgefirst-decoder \
            edgefirst-tracker
          do
            publish_one "${crate}"
            sleep 15
          done

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-wheels, build-capi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history + all tags so the make_latest comparison below can see
          # every released version, not just the one being tagged.
          fetch-depth: 0

      - name: Download wheel artifacts (all five packages)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download C API artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: capi-*
          path: dist
          merge-multiple: true

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk "/## \[$VERSION\]/,/^## \[/{if (/^## \[/ && !found) {found=1; next} if (/^## \[/ && found) exit; if (found) print}" CHANGELOG.md > RELEASE_NOTES.md || echo "Release $VERSION" > RELEASE_NOTES.md

      - name: Determine 'Latest' eligibility
        id: latest
        # Only the highest stable semver tag is marked as the repo's "Latest"
        # release. A back-version maintenance patch (e.g. v0.22.2 tagged after
        # v0.24.x already shipped) is published as a normal, non-latest release
        # so it never displaces the current line's badge. rc tags are excluded
        # from the comparison and never become Latest. GITHUB_REF is the tag
        # ref (trusted, matches the workflow's tag trigger pattern).
        run: |
          CURRENT="${GITHUB_REF#refs/tags/}"
          HIGHEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$CURRENT" = "$HIGHEST" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tag $CURRENT (highest stable: $HIGHEST) -> make_latest=$([ "$CURRENT" = "$HIGHEST" ] && echo true || echo false)"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: dist/*

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
