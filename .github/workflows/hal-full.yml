# HAL-only Full lanes. Called from ci.yml (ci:full) and nightly.yml.
#
# runner-class: larger
#   Full is speed-optimised and bills for it. These lanes name the billed
#   labels directly rather than going through rust-full's runner-class inputs,
#   because they are hal-specific jobs, not shared ones. The marker above tells
#   the org runner audit this is intended rather than a Quick lane that leaked
#   onto a billed runner.
#
#   Assignment follows the pre-migration measurements: the x86 workspace and
#   software-GL lanes were xlarge and ran a 37 min median; Windows was standard
#   and set the wall-clock floor at 55-63 job-minutes, so it moves up too.
#   Phase 2 replaces linux and windows with the self-hosted fleet; macOS stays
#   billed because there is no free equivalent.
#
#   Windows stays on the standard runner: the org has no Windows larger
#   runner provisioned (orgs/EdgeFirstAI/actions/hosted-runners lists Linux
#   images only), so windows-latest-8-cores would queue until the job timed
#   out. Provisioning one is the remaining lever on hal's wall-clock floor.
# Shared workflows: EdgeFirstAI/.github @ b0a9a8460fbca7707aea403e932d54a85acc272a
# Generic Linux/arm/hardware/scancode live in rust-full.yml.
# macOS (codesign + ANGLE) and Windows (gating pass + WARP) stay here because
# rust-full runs unsigned nextest with a single nextest-args string.

name: HAL Full extras

on:
  workflow_call:

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHON_VERSION: "3.11"
  RUST_STABLE_VERSION: "1.94.0"
  RUST_NIGHTLY_VERSION: "nightly-2026-03-15"

jobs:
  checkout-lfs:
    name: Checkout LFS Files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true
      - run: git lfs checkout
      - name: Merge per-crate testdata
        env:
          SKIP_PACKAGES: "1"
        run: bash .github/scripts/ci-setup.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: testdata-lfs
          path: testdata/
          retention-days: 1

  linux-extras:
    name: Linux extras (C-API, Python, clippy)
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 60
    needs: checkout-lfs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libopencv-dev pkg-config nasm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python venv
        run: |
          python3 -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> "$GITHUB_PATH"
          venv/bin/pip install --upgrade pip setuptools wheel
          venv/bin/pip install maturin[patchelf] slipcover pytest pytest-timeout pytest-benchmark numpy pillow opencv-python-headless pyyaml safetensors psutil tensorflow
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview, clippy, rustfmt
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_NIGHTLY_VERSION }}
          components: llvm-tools-preview
      - run: rustup default ${{ env.RUST_STABLE_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-x86_64-extras
          cache-on-failure: true
      # setup-coverage-env.sh and the report step below both shell out to
      # cargo llvm-cov. The split of test.yml into this file dropped the tool
      # install that the original build-and-test-x86 lane had, and Full had
      # never run, so nothing caught it. Same pin as the old lane.
      - uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-llvm-cov@0.6.16,cargo-nextest
      # Folded in from the old doc-tests job: same runner, deps and toolchain,
      # so it reuses this job's warm cache instead of compiling the workspace
      # again under its own.
      - run: make test-doc
      - run: make lint-capi-modular
      - run: make lint-tensor-dynamic
      - run: make lint-python-abi3-py38
      - name: Package and smoke the C archive
        run: |
          make package
          ./scripts/smoke-capi-archive.sh dist/edgefirst-hal-*.tar.gz
      - run: make test-capi-modular
      - run: make test-capi-link
      - run: make test-two-library-user
      - run: make test-tensor-dynamic
      - name: Set up coverage instrumentation
        run: .github/scripts/setup-coverage-env.sh
      - name: Build Python bindings and run pytest
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY_VERSION }}
        run: |
          source /tmp/coverage-env.sh
          for pkg in tensor codec image decoder tracker; do
            venv/bin/maturin build \
              --manifest-path "crates/python-$pkg/Cargo.toml" \
              --out target/wheels \
              --profile profiling \
              --features abi3-py311 \
              --auditwheel skip
          done
          venv/bin/pip install --no-deps --force-reinstall target/wheels/*.whl
          # Accumulate Rust profraw under the same `profiling` profile the
          # wheels link against. These are pyo3 wheels, so the Rust lcov IS
          # the binding coverage; slipcover only measures the test code.
          # Splitting test.yml dropped this step and left the workspace Rust
          # run in rust-full's linux job, a different machine on the default
          # profile, so the report below had neither profraw nor
          # profiling-profile objects and failed with "no input files".
          # --exclude the python-* crates: --workspace unions features, which
          # would activate edgefirst-tensor's static and dynamic at once and
          # trip its mutual-exclusion guard.
          source /tmp/coverage-env.sh
          cargo llvm-cov nextest --cargo-profile profiling --features default,opencv --workspace \
            --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common \
            --no-report -j 1 \
            2>&1 | tee target/test-metrics-rust-x86_64.txt
          source /tmp/coverage-env.sh
          venv/bin/python -m slipcover --xml --out target/coverage_python.xml \
            -m pytest tests/ -v --tb=short --junitxml=target/pytest_results.xml
          source /tmp/coverage-env.sh
          cargo llvm-cov report --profile profiling \
            --ignore-filename-regex '(\.cargo|/rustc/|/target/)' \
            --lcov --output-path target/coverage_rust.lcov
          bash tests/packaging/check_coverage_split.sh target/coverage_rust.lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-python-x86_64
          path: |
            target/coverage_python.xml
            target/pytest_results.xml
            target/coverage_rust.lcov
            target/test-metrics-rust-x86_64.txt
          retention-days: 7

  software-gl-coverage:
    name: Software-GL Coverage (llvmpipe)
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 25
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
      EDGEFIRST_ALLOW_SOFTWARE_GL: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 mesa-utils-extra clang libclang-dev libopencv-dev
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-x86_64
          cache-on-failure: true
      - uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-llvm-cov@0.6.16,cargo-nextest
      - name: Probe software-GL
        run: |
          eglinfo -B 2>&1 | head -50 || true
          cargo run -p gpu-probe -- --probe-only 2>&1 | head -60 || true
      - name: Run image GL tests under coverage
        run: |
          cargo llvm-cov nextest -p edgefirst-image --features default \
            --no-fail-fast -j 1 \
            -E 'not test(~no_bleed_gl)' \
            --lcov --output-path target/coverage_rust.lcov \
            --ignore-filename-regex '(\.cargo|/rustc/|/target/)' \
            2>&1 | tee target/test-metrics-software-gl.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-software-gl
          path: |
            target/coverage_rust.lcov
            target/test-metrics-software-gl.txt
          retention-days: 7

  test-macos:
    name: Build & Test (macOS, signed ANGLE)
    runs-on: macos-latest-xlarge
    timeout-minutes: 50
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}/target/angle/macos-flat-lib
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-macos
          cache-on-failure: true
          cache-bin: false
      - uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.6.16
      - run: bash scripts/fetch-angle.sh
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets \
            --exclude gpu-probe --exclude edgefirst-bench \
            --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common \
            -- -D warnings
      - run: make lint-capi-modular
      - name: Signed Rust tests with coverage
        env:
          COVERAGE: "1"
          COV_LCOV: target/coverage_rust.lcov
          HAL_TEST_REQUIRE_GL: "1"
        run: ./scripts/test-macos.sh -j 1
      - run: make test-capi-modular
      - run: make test-capi-link
      - run: make test-two-library-user
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-macos
          path: target/coverage_rust.lcov
          retention-days: 7

  test-windows:
    name: Build & Test (Windows, ANGLE off)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-windows
          cache-on-failure: true
          cache-bin: false
      - uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.6.16
      - name: Clippy
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --exclude gpu-probe --exclude edgefirst-bench --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust tests (no ANGLE on PATH)
        shell: pwsh
        env:
          EDGEFIRST_ANGLE_PATH: ''
        run: |
          cargo llvm-cov clean --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov nextest --no-report --workspace --exclude gpu-probe --exclude edgefirst-bench --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common -j 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate LCOV
        shell: pwsh
        run: |
          cargo llvm-cov report --lcov --output-path target/coverage_rust.lcov --ignore-filename-regex '(\.cargo|[\\/]rustc[\\/]|[\\/]target[\\/])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/normalize-lcov-paths.ps1 target/coverage_rust.lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-windows
          path: target/coverage_rust.lcov
          retention-days: 7

  build-ios:
    name: Build & Lint (iOS, native Rust API)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-ios
          cache-on-failure: true
          cache-bin: false
      - name: Clippy (iOS device)
        run: |
          cargo clippy --target aarch64-apple-ios \
            --workspace \
            --exclude gpu-probe \
            --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common --exclude edgefirst-bench \
            -- -D warnings
      - name: Build native Rust API (device + simulator)
        run: |
          cargo build --target aarch64-apple-ios --release -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker
          cargo build --target aarch64-apple-ios-sim --release -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker

  build-android:
    name: Build & Lint (Android, native Rust API)
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy
      - id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779  # v1.6.0
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-android
          cache-on-failure: true
          cache-bin: false
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Clippy (Android arm64)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -P 26 clippy \
            --workspace --all-targets \
            --exclude gpu-probe --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common --exclude edgefirst-bench \
            -- -D warnings
      - name: Build native Rust API
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -P 26 build --release \
            -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker

  test-windows-warp:
    name: GL Tests (Windows, ANGLE D3D11 WARP)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}\target\angle\windows-x64\bin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-windows-warp
          cache-on-failure: true
          cache-bin: false
      - uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4  # v2.78.0
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.6.16
      - name: Fetch ANGLE
        shell: bash
        run: bash scripts/fetch-angle.sh --windows
      - name: Reset coverage counters
        shell: pwsh
        run: |
          cargo llvm-cov clean --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run GL tests on WARP
        shell: pwsh
        continue-on-error: true
        run: pwsh -NoProfile -File scripts/test-windows.ps1 -Coverage -Warp -RequireGl -p edgefirst-image --profile ci
      - name: Generate LCOV
        shell: pwsh
        run: |
          cargo llvm-cov report --lcov --output-path target/coverage_rust_warp.lcov --ignore-filename-regex '(\.cargo|[\\/]rustc[\\/]|[\\/]target[\\/])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/normalize-lcov-paths.ps1 target/coverage_rust_warp.lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-windows-warp
          path: target/coverage_rust_warp.lcov
          retention-days: 7

  package-windows-capi:
    name: Package C Archive (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}\target\angle\windows-x64\bin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-windows-capi
          cache-on-failure: true
          cache-bin: false
      - name: Fetch ANGLE
        shell: bash
        run: bash scripts/fetch-angle.sh --windows
      - name: Build modular C-API leaves
        shell: pwsh
        run: |
          foreach ($leaf in @('tensor','image','codec','decoder','tracker')) {
            cargo build --release --manifest-path "crates/${leaf}-capi/Cargo.toml" --target-dir target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package and smoke
        shell: bash
        run: |
          mkdir -p dist
          ./scripts/package-capi.sh --target x86_64-windows --libdir target/release --outdir dist
          ./scripts/smoke-capi-archive-windows.sh dist/edgefirst-hal-*-x86_64-windows.zip

  package-macos-capi-gpu:
    name: Package C Archive & GPU Tests (macOS)
    runs-on: macos-latest-xlarge
    timeout-minutes: 35
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}/target/angle/macos-flat-lib
      PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: testdata-lfs
          path: testdata/
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust-macos-package
          cache-on-failure: true
          cache-bin: false
      - run: bash scripts/fetch-angle.sh
      - name: Package and smoke
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkgconf
          fi
          make package
          ./scripts/smoke-capi-archive.sh dist/edgefirst-hal-*.zip
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: GPU Python tests
        env:
          HAL_TEST_REQUIRE_GL: "1"
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install maturin pytest numpy pillow
          for pkg in tensor codec image decoder tracker; do
            venv/bin/maturin build \
              --manifest-path "crates/python-$pkg/Cargo.toml" \
              --out target/wheels \
              --release \
              --features abi3-py311 \
              --auditwheel skip
          done
          venv/bin/pip install --no-deps --force-reinstall target/wheels/*.whl
          PY=$(python3 -c "import os; print(os.path.realpath('venv/bin/python3'))")
          codesign --force --sign - --entitlements entitlements.plist "$PY"
          venv/bin/python -m pytest tests/ -m gpu -v --tb=short
