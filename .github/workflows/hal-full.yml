# HAL-only Full lanes. Called from ci.yml (ci:full) and nightly.yml.
#
# runner-class: larger
# Shared workflows: EdgeFirstAI/.github, pinned in the `uses:` lines below.
# Generic Linux/arm/hardware/scancode live in rust-full.yml.
# The macOS (codesign + ANGLE) and Windows (ANGLE on WARP) lanes are here.

name: HAL Full extras

on:
  workflow_call:

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHON_VERSION: "3.11"
  RUST_STABLE_VERSION: "1.94.0"

jobs:
  checkout-lfs:
    name: Checkout LFS Files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true
      - run: git lfs checkout
      - name: Merge per-crate testdata
        env:
          SKIP_PACKAGES: "1"
        run: bash .github/scripts/ci-setup.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testdata-lfs
          path: testdata/
          retention-days: 1

  linux-extras:
    name: Linux extras (C-API, Python, clippy)
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 60
    needs: checkout-lfs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: testdata-lfs
          path: testdata/
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config nasm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python venv
        run: |
          python3 -m venv venv
          echo "${{ github.workspace }}/venv/bin" >> "$GITHUB_PATH"
          venv/bin/pip install --upgrade pip setuptools wheel
          venv/bin/pip install maturin[patchelf] slipcover pytest pytest-timeout pytest-benchmark numpy pillow pyyaml safetensors psutil tensorflow
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview, clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-x86_64-extras
          cache-on-failure: true
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-llvm-cov@0.6.16,cargo-nextest
      - run: make test-doc
      - run: make lint-capi-modular
      - run: make lint-tensor-dynamic
      - run: make lint-python-abi3-py38
      - name: Package and smoke the C archive
        run: |
          make package PACKAGE_PROFILE=profiling
          ./scripts/smoke-capi-archive.sh dist/edgefirst-hal-*.tar.gz
      - run: make test-capi-modular
      - run: make test-capi-link
      - run: make test-two-library-user
      - run: make test-tensor-dynamic
      - name: Set up coverage instrumentation
        run: .github/scripts/setup-coverage-env.sh
      # /tmp/coverage-env.sh points CARGO_TARGET_DIR and LLVM_PROFILE_FILE at the
      # llvm-cov tree; the steps that source it write profraw there.
      - name: Build Python bindings with coverage instrumentation
        run: |
          source /tmp/coverage-env.sh
          # Builds each wheel instrumented, from its crate directory.
          for pkg in tensor codec image decoder tracker kernels; do
            (cd "crates/python-$pkg" && "$GITHUB_WORKSPACE/venv/bin/maturin" build \
              --out "$GITHUB_WORKSPACE/target/wheels" \
              --profile profiling \
              --features abi3-py311 \
              --auditwheel skip)
          done
          venv/bin/pip install --no-deps --force-reinstall target/wheels/*.whl

      - name: Run Python tests with coverage
        run: |
          source /tmp/coverage-env.sh
          venv/bin/python -m slipcover --xml --out target/coverage_python.xml \
            -m pytest tests/ -v --tb=short --junitxml=target/pytest_results.xml \
            2>&1 | tee target/test-metrics-python-x86_64.txt

      - name: Generate the Rust coverage report of the Python tests
        run: |
          cargo llvm-cov report --profile profiling \
            --ignore-filename-regex '(\.cargo|/rustc/|/target/)' \
            --lcov --output-path target/coverage_rust.lcov
          echo "=== coverage summary ==="
          echo "source files: $(grep -c '^SF:' target/coverage_rust.lcov)"
          echo "PyO3 files with coverage:"
          grep '^SF:.*crates/python' target/coverage_rust.lcov || echo "  (none found)"
          # Asserts coverage attribution per package.
          bash tests/packaging/check_coverage_split.sh target/coverage_rust.lcov

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-python-x86_64
          path: |
            target/coverage_python.xml
            target/pytest_results.xml
            target/coverage_rust.lcov
            target/test-metrics-python-x86_64.txt
          retention-days: 7

  software-gl-coverage:
    name: Software-GL Coverage (llvmpipe)
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 25
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
      EDGEFIRST_ALLOW_SOFTWARE_GL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: testdata-lfs
          path: testdata/
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 mesa-utils-extra clang libclang-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-x86_64
          cache-on-failure: true
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-llvm-cov@0.6.16,cargo-nextest
      - name: Probe software-GL
        run: |
          eglinfo -B 2>&1 | head -50 || true
          cargo run -p gpu-probe -- --probe-only 2>&1 | head -60 || true
      - name: Run the edgefirst-image tests under coverage
        run: |
          cargo llvm-cov nextest -p edgefirst-image --features default \
            --no-fail-fast \
            -E 'not test(~no_bleed_gl)' \
            --lcov --output-path target/coverage_rust.lcov \
            --ignore-filename-regex '(\.cargo|/rustc/|/target/)' \
            2>&1 | tee target/test-metrics-software-gl.txt
      - name: Audit test warnings
        if: always()
        shell: bash
        run: python3 .github/scripts/test_warnings.py target/llvm-cov-target/nextest target/nextest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-software-gl
          path: |
            target/coverage_rust.lcov
            target/test-metrics-software-gl.txt
          retention-days: 7

  test-macos:
    name: Build & Test (macOS, signed ANGLE)
    runs-on: macos-latest-xlarge
    timeout-minutes: 50
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}/target/angle/macos-flat-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: testdata-lfs
          path: testdata/
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-macos
          cache-on-failure: true
          cache-bin: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.6.16
      - run: bash scripts/fetch-angle.sh
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets \
            --exclude gpu-probe --exclude edgefirst-bench \
            --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common \
            -- -D warnings
      - run: make lint-capi-modular
      - name: Signed Rust tests with coverage
        env:
          COVERAGE: "1"
          COV_LCOV: target/coverage_rust.lcov
          HAL_TEST_REQUIRE_GL: "1"
        run: ./scripts/test-macos.sh --profile ci
      - name: Audit test warnings
        if: always()
        shell: bash
        run: python3 .github/scripts/test_warnings.py target/llvm-cov-target/nextest target/nextest
      - run: make test-capi-modular
      - run: make test-capi-link
      - run: make test-two-library-user
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-macos
          path: target/coverage_rust.lcov
          retention-days: 7

  test-windows:
    name: Build & Test (Windows, ANGLE D3D11 WARP)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}\target\angle\windows-x64\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: testdata-lfs
          path: testdata/
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-windows
          cache-on-failure: true
          cache-bin: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-nextest,cargo-llvm-cov@0.6.16
      - name: Clippy
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --exclude gpu-probe --exclude edgefirst-bench --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch ANGLE
        shell: bash
        run: bash scripts/fetch-angle.sh --windows
      - name: Reset coverage counters
        shell: pwsh
        run: |
          cargo llvm-cov clean --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust tests on WARP
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-windows.ps1 -Coverage -Warp -RequireGl --features edgefirst-decoder/model-files --profile ci
      - name: Audit test warnings
        if: always()
        shell: bash
        run: python .github/scripts/test_warnings.py target/llvm-cov-target/nextest target/nextest
      - name: Generate LCOV
        if: always()
        shell: pwsh
        run: |
          cargo llvm-cov report --lcov --output-path target/coverage_rust.lcov --ignore-filename-regex '(\.cargo|[\\/]rustc[\\/]|[\\/]target[\\/])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/normalize-lcov-paths.ps1 target/coverage_rust.lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-windows
          path: target/coverage_rust.lcov
          retention-days: 7

  build-ios:
    name: Build & Lint (iOS, native Rust API)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-ios
          cache-on-failure: true
          cache-bin: false
      - name: Clippy (iOS device)
        run: |
          cargo clippy --target aarch64-apple-ios \
            --workspace \
            --exclude gpu-probe \
            --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common --exclude edgefirst-bench \
            -- -D warnings
      - name: Build native Rust API (device + simulator)
        run: |
          cargo build --target aarch64-apple-ios --profile profiling -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker
          cargo build --target aarch64-apple-ios-sim --profile profiling -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker

  build-android:
    name: Build & Lint (Android, native Rust API)
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy
      - id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779  # v1.6.0
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-android
          cache-on-failure: true
          cache-bin: false
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Clippy (Android arm64)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -P 26 clippy \
            --workspace --all-targets \
            --exclude gpu-probe --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common --exclude edgefirst-bench \
            -- -D warnings
      - name: Build native Rust API
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -P 26 build --profile profiling \
            -p edgefirst-tensor -p edgefirst-image -p edgefirst-codec -p edgefirst-decoder -p edgefirst-tracker

  package-windows-capi:
    name: Package C Archive (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}\target\angle\windows-x64\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-windows-capi
          cache-on-failure: true
          cache-bin: false
      - name: Fetch ANGLE
        shell: bash
        run: bash scripts/fetch-angle.sh --windows
      - name: Build modular C-API leaves
        shell: pwsh
        run: |
          $root = $PWD
          foreach ($leaf in @('tensor','image','codec','decoder','tracker','kernels')) {
            Push-Location "crates/${leaf}-capi"
            cargo build --profile profiling --target-dir "$root/target"
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }
      - name: Package and smoke
        shell: bash
        run: |
          mkdir -p dist
          ./scripts/package-capi.sh --target x86_64-windows --libdir target/profiling --outdir dist
          ./scripts/smoke-capi-archive-windows.sh dist/edgefirst-hal-*-x86_64-windows.zip

  package-macos-capi-gpu:
    name: Package C Archive & GPU Tests (macOS)
    runs-on: macos-latest-xlarge
    timeout-minutes: 35
    needs: checkout-lfs
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDGEFIRST_ANGLE_PATH: ${{ github.workspace }}/target/angle/macos-flat-lib
      PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: testdata-lfs
          path: testdata/
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-macos-package
          cache-on-failure: true
          cache-bin: false
      - run: bash scripts/fetch-angle.sh
      - name: Package and smoke
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkgconf
          fi
          make package PACKAGE_PROFILE=profiling
          ./scripts/smoke-capi-archive.sh dist/edgefirst-hal-*.zip
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: GPU Python tests
        env:
          HAL_TEST_REQUIRE_GL: "1"
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install maturin pytest numpy pillow
          for pkg in tensor codec image decoder tracker kernels; do
            (cd "crates/python-$pkg" && "$GITHUB_WORKSPACE/venv/bin/maturin" build \
              --out "$GITHUB_WORKSPACE/target/wheels" \
              --profile profiling \
              --features abi3-py311 \
              --auditwheel skip)
          done
          # Checks the wheels' Mach-O LINKEDIT string-pool alignment.
          python3 scripts/check_macho_alignment.py target/wheels
          venv/bin/pip install --no-deps --force-reinstall target/wheels/*.whl
          PY=$(python3 -c "import os; print(os.path.realpath('venv/bin/python3'))")
          codesign --force --sign - --entitlements entitlements.plist "$PY"
          venv/bin/python -m pytest tests/ -m gpu -v --tb=short

      - name: Source-directory install path
        # Installs python-tensor through `pip install <dir>/` and imports it.
        run: |
          make install-python PYTHON_PACKAGES=tensor
          venv/bin/python -c "import edgefirst.tensor; print(edgefirst.tensor.__name__, 'imported')"
