# Runs HAL's on-target test suite on the self-hosted boards, on demand, one
# job per board entry: every test binary of the workspace crates,
# scripts/check-single-home.sh, the two-library C program, the codec C API
# program and the Python codec tests. Uses the bundle and the board-side
# script that scripts/on-target-test.sh uses.
#
#   plan     resolve board entries; drop, and report, any no online runner serves
#   wheels   build the aarch64 Python wheels the codec tests import
#   build    cross-build one aarch64 tests bundle (scripts/on-target-bundle.sh)
#   board    per entry: unpack the bundle, run scripts/on-target-run.sh
#   summary  one table naming the runner each entry ran on; red if any failed
#
# Board entries are runner labels, `+` joining labels one runner must all
# carry (`imx95-frdm+ara240`). The default is one EVK per SoC.
#
# The runner check reads FLEET_RUNNERS_TOKEN, an organisation secret with
# "Self-hosted runners: read". Without it every entry is scheduled.
#
# Action versions (hash-pinned):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
# - actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c (v8.0.1)
# - taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 (v2.88.1)
# - dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 (v1)
# - actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 (v7.1.0)

name: Hardware tests

on:
  workflow_dispatch:
    inputs:
      boards:
        description: Board entries, comma-separated; `+` joins labels one runner must all carry
        type: string
        default: imx8mp-evk, imx95-evk, rpi5, orin-nano, iq9075-evk
      features:
        description: Cargo features for the test build (`<pkg>/<feature>`, space-separated)
        type: string
        default: ""
      filter:
        description: Test-name filter passed to every binary (empty runs everything)
        type: string
        default: ""
      require-gpu:
        description: Fail a board without a DRM render node instead of skipping its GPU tests
        type: boolean
        default: true
      gdb:
        description: Run each test binary under gdb, which logs every thread's backtrace if it crashes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      board_matrix: ${{ steps.boards.outputs.board_matrix }}
      unavailable: ${{ steps.boards.outputs.unavailable }}
      has_boards: ${{ steps.boards.outputs.has_boards }}
    steps:
      - id: boards
        uses: EdgeFirstAI/.github/.github/actions/resolve-boards@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
        with:
          boards: ${{ inputs.boards }}
          token: ${{ secrets.FLEET_RUNNERS_TOKEN }}

  # Builds the edgefirst-tensor and edgefirst-codec wheels natively on aarch64
  # with abi3-py311, and downloads pytest with its pure-Python dependencies and
  # numpy for each CPython version the boards run.
  wheels:
    name: Build Python wheels (aarch64)
    needs: plan
    if: needs.plan.outputs.has_boards == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld build-essential

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Build wheels
        uses: EdgeFirstAI/.github/.github/actions/maturin-build@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
        with:
          features: abi3-py311
          args: --auditwheel skip --zig --compatibility manylinux2014
          builds: |
            [{"manifest": "crates/python-tensor/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"},
             {"manifest": "crates/python-codec/Cargo.toml", "args": "--config .cargo/tensor-dynamic.toml"}]
          wheel-dir: wheels
          verify-version: "false"
          attest: false

      - name: Download pytest and numpy
        run: |
          pip download --only-binary=:all: -d wheels pytest==9.1.1
          for v in 3.11 3.12 3.13 3.14; do
            pip download --only-binary=:all: --no-deps -d wheels \
              --platform manylinux_2_28_aarch64 --platform manylinux2014_aarch64 \
              --python-version "${v}" numpy==2.4.6
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: on-target-wheels-aarch64
          path: wheels/*.whl
          retention-days: 3
          if-no-files-found: error

  build:
    name: Build tests bundle (aarch64)
    needs: [plan, wheels]
    if: needs.plan.outputs.has_boards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config nasm

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-zigbuild@0.23.2

      - name: Install zig
        env:
          ZIG_VERSION: "0.16.0"
          SHA256_X86_64: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fsSL --retry 5 --retry-connrefused -o "$archive" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${SHA256_X86_64}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Add the aarch64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: on-target-wheels-aarch64
          path: ${{ runner.temp }}/wheels

      - name: Build the bundle
        env:
          FEATURES: ${{ inputs.features }}
          PYTHON_WHEELS: ${{ runner.temp }}/wheels
        run: ./scripts/on-target-bundle.sh tests aarch64 "$RUNNER_TEMP/bundle"

      - name: Pack the bundle
        run: tar -C "$RUNNER_TEMP/bundle" -cf "$RUNNER_TEMP/on-target-tests.tar" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: on-target-tests-aarch64
          path: ${{ runner.temp }}/on-target-tests.tar
          retention-days: 3
          if-no-files-found: error

      - name: Build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: on-target-tests-build-logs
          path: target/on-target-bundle-logs/
          retention-days: 7
          if-no-files-found: ignore

  board:
    name: Board ${{ matrix.runner }}
    needs: [plan, build]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.board_matrix) }}
    steps:
      - name: Reclaim disk from an earlier run
        run: rm -rf hal-bundle hal-results on-target-tests.tar

      - name: Board
        env:
          ENTRY: ${{ matrix.runner }}
        run: |
          echo "::notice::${ENTRY} ran on ${RUNNER_NAME} ($(uname -m))"
          if [[ "$(uname -m)" != aarch64 ]]; then
            echo "::error::the bundle is aarch64; ${RUNNER_NAME} is $(uname -m)"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: on-target-tests-aarch64

      - name: Unpack
        run: |
          mkdir hal-bundle
          tar -xf on-target-tests.tar -C hal-bundle
          rm on-target-tests.tar
          cat hal-bundle/MANIFEST

      - name: Run the suite
        env:
          FILTER: ${{ inputs.filter }}
          HAL_ONTARGET_REQUIRE_GPU: ${{ inputs.require-gpu && '1' || '0' }}
          HAL_ONTARGET_GDB: ${{ inputs.gdb && '1' || '0' }}
          HAL_BOARD_ENTRY: ${{ matrix.runner }}
        run: hal-bundle/scripts/on-target-run.sh "$GITHUB_WORKSPACE/hal-results"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hardware-test-${{ matrix.runner }}
          path: hal-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: rm -rf hal-bundle hal-results on-target-tests.tar

  summary:
    name: Summary
    needs: [plan, build, board]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/fleet_summary.py
            .github/scripts/test_warnings.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: hardware-test-*
          path: results

      - name: Summarize
        env:
          REQUESTED: ${{ needs.plan.outputs.board_matrix }}
          UNAVAILABLE: ${{ needs.plan.outputs.unavailable }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set +e -uo pipefail
          mkdir -p results
          python3 .github/scripts/fleet_summary.py tests --results results \
            --requested "${REQUESTED:-[]}" --unavailable "${UNAVAILABLE:-[]}" > summary.md
          status=$?
          if [[ "${BUILD_RESULT}" != success && "${BUILD_RESULT}" != skipped ]]; then
            printf '\n**The bundle build %s, so no board ran.**\n' "${BUILD_RESULT}" >> summary.md
            status=1
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          python3 .github/scripts/test_warnings.py results
          exit "${status}"
