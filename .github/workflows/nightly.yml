# Nightly Full + G13. Skips when main has not moved since the last success.
#
# Shared workflows: EdgeFirstAI/.github @ cf505b2dbc5fd784a7acbf4ec8ca1e821c02dda3

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A manual dispatch must not interleave with the scheduled run: both would race
# on the same self-hosted board and the same Sonar `main` baseline.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@cf505b2dbc5fd784a7acbf4ec8ca1e821c02dda3

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@cf505b2dbc5fd784a7acbf4ec8ca1e821c02dda3
    with:
      lanes: all
      nightly: true
      boards: nxp-imx8mp-latest
      lfs: true
      python: false
      sonar: false
      scancode: true
      skip-macos: true
      skip-windows: true
      timeout-minutes: 90
      board-timeout-minutes: 45
      runner-class-linux: hosted
      runner-class-linux-arm: hosted
      pre-command: bash .github/scripts/ci-setup.sh
      board-pre-command: SKIP_PACKAGES=1 SKIP_TESTDATA=1 bash .github/scripts/ci-setup.sh
      board-extra-args: -j 1 --profile ci
      nextest-args: --workspace --locked --features default,opencv --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common -j 1
      archive-args: --locked --package edgefirst-image --features opengl,g2d_test_formats,dma_test_formats --package edgefirst-tensor
    secrets: inherit

  nightly-hal:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/hal-full.yml
    secrets: inherit

  differential:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/differential.yml

  # The `main` coverage baseline. Full never runs on push to main in the
  # label-driven model, so without this the baseline goes stale and every PR
  # decorates against an ageing reference.
  sonar:
    needs: [changed, nightly, nightly-hal]
    if: >-
      always() && !cancelled() &&
      needs.changed.outputs.run == 'true' &&
      (needs.nightly.result == 'success' || needs.nightly-hal.result == 'success')
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
