# Nightly Full and differential runs. Skips when main has not moved since the
# last nightly that reached a verdict. Advisory scanning runs either way.
#
# Shared workflows: EdgeFirstAI/.github, pinned in the `uses:` lines below.

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
    with:
      force: ${{ inputs.force || false }}

  # Runs every night.
  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
    with:
      lanes: all
      nightly: true
      hack-args: >-
        --workspace --feature-powerset --depth 2
        --exclude-features opencv,turbojpeg --exclude edgefirst-egl
        --exclude edgefirst-python-tensor --exclude edgefirst-python-codec
        --exclude edgefirst-python-image --exclude edgefirst-python-decoder
        --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common
      # One job per board identity.
      boards: imx8mp-evk,imx95-evk,rpi5,orin-nano
      archive-glibc: "2.35"
      lfs: true
      python: false
      sonar: false
      scancode: true
      skip-macos: true
      skip-windows: true
      timeout-minutes: 45
      board-timeout-minutes: 45
      runner-class-linux: larger
      runner-class-linux-arm: larger
      pre-command: bash .github/scripts/ci-setup.sh
      board-pre-command: BOARD=1 SKIP_PACKAGES=1 SKIP_TESTDATA=1 bash .github/scripts/ci-setup.sh
      # One process per binary: the image and tensor lib binaries filtered to
      # the hardware tests, and the whole-binary GPU/DMA integration binaries.
      board-binaries: |
        edgefirst_image=g2d,opengl
        edgefirst_tensor=dma
        dst_view_stride
        offset_nv_source_upload
        offset_source_view_alignment
        gl_concurrent_stress
        reconstructed_view_convert
        pin_convert
        crop_golden
        mask_golden
        odd_dim_cpu
        pin
        protocol
        protocol_roundtrip
        identity
        vocabulary
      # Minimum number of tests the board selection must match.
      board-min-tests: "100"
      nextest-args: --workspace --locked --features default,edgefirst-decoder/model-files --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common
      archive-profile: profiling
      archive-args: --locked --package edgefirst-image --features opengl --package edgefirst-tensor
    secrets: inherit

  nightly-hal:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/hal-full.yml
    secrets: inherit

  differential:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/differential.yml

  sonar:
    needs: [changed, nightly, nightly-hal]
    if: >-
      always() && !cancelled() &&
      needs.changed.outputs.run == 'true' &&
      (needs.nightly.result == 'success' || needs.nightly-hal.result == 'success')
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
