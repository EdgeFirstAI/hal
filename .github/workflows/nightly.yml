# Nightly Full + G13. Skips when main has not moved since the last nightly
# that reached a verdict. Advisory scanning runs either way.
#
# Shared workflows: EdgeFirstAI/.github, pinned in the `uses:` lines below.

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

# A manual dispatch must not interleave with the scheduled run: both would race
# on the same self-hosted board and the same Sonar `main` baseline.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@2c285adecb450875301984b87acc1225b9d068d7
    with:
      # `inputs` is null on the schedule trigger, so the fallback is required;
      # without it the expression is an empty string and the gate's boolean
      # input rejects it.
      force: ${{ inputs.force || false }}

  # Deliberately not `needs: changed`. Every other lane here asks a question
  # about the code, so skipping an unchanged commit loses nothing. cargo audit
  # asks a question about the RustSec database, which changes daily whether the
  # code does or not -- the 2026-09-15 nightly failed on RUSTSEC-2026-0204
  # against a Cargo.lock nobody had touched. It parses Cargo.lock without
  # building, on a free standard runner, so running it every night costs
  # nothing. See the exception in the shared copilot-instructions.md.
  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@2c285adecb450875301984b87acc1225b9d068d7

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@2c285adecb450875301984b87acc1225b9d068d7
    with:
      lanes: all
      nightly: true
      # The feature powerset is not meaningful for this workspace. Its whole
      # premise is removing default features, and `static` -- which selects
      # edgefirst-tensor's backend -- is a default feature of every consumer.
      # 16 of 23 members depend on that crate and it rejects a missing
      # backend with a deliberate compile_error!, so the powerset spends its
      # 264 runs building configurations the design declares invalid.
      #
      # --exclude-no-default-features skips only the bare
      # --no-default-features run, 1 of those 264; every subset run still
      # drops `static`. Empty disables the lane, which is honest rather than
      # a filter list that has to grow with the workspace. Revisit if
      # backend selection ever stops being feature-gated.
      hack-args: ""
      boards: nxp-imx8mp-latest
      lfs: true
      python: false
      sonar: false
      scancode: true
      skip-macos: true
      skip-windows: true
      timeout-minutes: 45
      board-timeout-minutes: 45
      # Same class as Full: a nightly that takes twice as long delays the
      # failure signal by a working morning. Flip to `hosted` here if the
      # monthly larger-runner spend needs trimming; nothing blocks on nightly.
      runner-class-linux: larger
      runner-class-linux-arm: larger
      pre-command: bash .github/scripts/ci-setup.sh
      board-pre-command: SKIP_PACKAGES=1 SKIP_TESTDATA=1 bash .github/scripts/ci-setup.sh
      # One process per binary, not per test. nextest's process-per-test model
      # costs a full EGL init/teardown per test on this board -- 6 to 22s each,
      # measured -- and writes one profraw per process, which exhausted the
      # eMMC at 307 files / 2.8 GB. Running each binary once is what test.yml
      # did, and it is why the same suite took 16 minutes.
      #
      # The selection is the routing test.yml used: the image and tensor lib
      # binaries filtered to the hardware tests, plus the integration binaries
      # that are whole-binary GPU/DMA tests. Everything else is CPU-only and
      # already covered by the aarch64 host lane.
      board-binaries: |
        edgefirst_image=g2d,opengl
        edgefirst_tensor=dma
        dst_view_stride
        offset_nv_source_upload
        offset_source_view_alignment
        gl_concurrent_stress
        reconstructed_view_convert
        pin_convert
        crop_golden
        mask_golden
        odd_dim_cpu
        pin
        protocol
        protocol_roundtrip
        dynamic_primitives
        identity
        vocabulary
      # A floor, not a target. Guards against a selection that matches nothing
      # and reports success; tighten once a green run reports the real count.
      board-min-tests: "100"
      nextest-args: --workspace --locked --features default,opencv --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-common -j 1
      # The board is an eMMC-constrained i.MX 8M Plus. profiling is thin-LTO
      # with debug = "line-tables-only", which is what kept the on-target
      # payload shippable before the migration; the dev profile's full debug
      # info fills the disk.
      archive-profile: profiling
      archive-args: --locked --package edgefirst-image --features opengl,g2d_test_formats,dma_test_formats --package edgefirst-tensor
    secrets: inherit

  nightly-hal:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/hal-full.yml
    secrets: inherit

  differential:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/differential.yml

  sonar:
    needs: [changed, nightly, nightly-hal]
    if: >-
      always() && !cancelled() &&
      needs.changed.outputs.run == 'true' &&
      (needs.nightly.result == 'success' || needs.nightly-hal.result == 'success')
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
