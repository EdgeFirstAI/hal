# Differential (static vs. dynamic backend) workflow for EdgeFirst HAL
#
# Builds two venvs from the same commit, one with every Python extension
# linking edgefirst-tensor statically and one linking a shared
# libedgefirst_tensor.so, and runs the Python test suite against both through
# `make test-differential`. Runs nightly and on demand.
#
# Action Versions (hash-pinned per SPS v2.1):
# - actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd (v6.0.2)
# - actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 (v6.2.0)
# - actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
# - dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 (v1)
# - Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 (v2.9.1)

name: Differential (Static vs Dynamic Backend)

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHON_VERSION: '3.11'
  RUST_STABLE_VERSION: '1.94.0'

jobs:
  test-differential:
    name: Backend comparison (static vs. dynamic, test for test)
    # runner-class: larger
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up base Python virtual environment
        # The venv that spawns the two comparison venvs.
        run: python3 -m venv venv

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-differential
          cache-on-failure: true

      - name: Run make test-differential
        run: make test-differential

      - name: Upload differential wheels on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: differential-wheels
          path: |
            target/differential-wheels-static/
            target/differential-wheels-dynamic/
          retention-days: 7
          if-no-files-found: ignore
