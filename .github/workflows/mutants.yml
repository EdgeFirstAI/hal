# Mutation testing with cargo-mutants, on its own schedule.
#
# Jobs:
#   plan     picks the night's shard indices of each corpus and builds the matrix
#   mutants  runs cargo-mutants on one shard of one corpus on one runner
#   report   merges the shard reports and fails on any survivor: a mutant
#            compiled on at least one leg and missed on every leg that compiled
#            it. Mutants no leg compiles are listed and not counted.
#
# See TESTING.md § Mutation testing.

name: Mutation testing

on:
  schedule:
    # 04:47 UTC
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      tensor_shards:
        description: Shards the edgefirst-tensor corpus is divided into.
        type: string
        required: false
        default: "16"
      tensor_window:
        description: edgefirst-tensor shards to run tonight, on every leg.
        type: string
        required: false
        default: "2"
      other_shards:
        description: Shards the decoder + tracker + kernels corpus is divided into.
        type: string
        required: false
        default: "48"
      other_window:
        description: Decoder + tracker + kernels shards to run tonight, on the Linux legs.
        type: string
        required: false
        default: "6"
      start:
        description: "First shard index in both corpora. Default: rotates by date."
        type: string
        required: false
        default: ""
      legs:
        description: "Comma-separated runners. Default: all four legs."
        type: string
        required: false
        default: ""

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Pick tonight's shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        env:
          TENSOR_TOTAL_IN: ${{ inputs.tensor_shards }}
          TENSOR_WINDOW_IN: ${{ inputs.tensor_window }}
          OTHER_TOTAL_IN: ${{ inputs.other_shards }}
          OTHER_WINDOW_IN: ${{ inputs.other_window }}
          START_IN: ${{ inputs.start }}
          LEGS_IN: ${{ inputs.legs }}
        run: |
          set -euo pipefail
          # Two corpora: edgefirst-tensor runs on all four legs; the decoder,
          # tracker and kernels run on the two Linux legs. Every leg that runs
          # a corpus runs the same shard indices of it.
          tensor_total="${TENSOR_TOTAL_IN:-16}"
          tensor_window="${TENSOR_WINDOW_IN:-2}"
          other_total="${OTHER_TOTAL_IN:-48}"
          other_window="${OTHER_WINDOW_IN:-6}"
          all_legs="ubuntu-24.04,ubuntu-24.04-arm,macos-latest,windows-latest"
          for n in "${tensor_total}" "${tensor_window}" "${other_total}" \
                   "${other_window}" "${START_IN:-0}"; do
            # Each value is a non-negative decimal integer without leading zeros.
            if [[ ! "${n}" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "::error::'${n}' is not a non-negative decimal integer without leading zeros"
              exit 1
            fi
          done
          legs="${LEGS_IN:-${all_legs}}"
          legs="${legs// /}"
          IFS=, read -r -a leg_list <<< "${legs}"
          for leg in "${leg_list[@]}"; do
            if [[ ",${all_legs}," != *",${leg},"* ]]; then
              echo "::error::unknown leg '${leg}'; expected one of ${all_legs}"
              exit 1
            fi
          done

          # Days since the epoch.
          day=$(( $(date -u +%s) / 86400 ))

          # Prints tonight's shard indices of one corpus, comma-separated.
          # The start advances by one window per night and wraps on `total`.
          pick() {
            local total="$1" window="$2" start list="" i
            if (( window < 1 || window > total )); then
              echo "::error::window ${window} is outside 1..${total}" >&2
              return 1
            fi
            if [[ -n "${START_IN}" ]]; then
              start=$(( START_IN % total ))
            else
              start=$(( (day * window) % total ))
            fi
            for (( i = 0; i < window; i++ )); do
              list="${list}${list:+,}$(( (start + i) % total ))"
            done
            echo "${list}"
          }
          tensor_list="$(pick "${tensor_total}" "${tensor_window}")"
          other_list="$(pick "${other_total}" "${other_window}")"

          # timeout-minutes per runner.
          timeout_for() {
            case "$1" in
              ubuntu-24.04) echo 120 ;;
              ubuntu-24.04-arm) echo 180 ;;
              macos-latest) echo 150 ;;
              windows-latest) echo 240 ;;
            esac
          }

          matrix="$(
            for leg in "${leg_list[@]}"; do
              IFS=, read -r -a shards <<< "${tensor_list}"
              for shard in "${shards[@]}"; do
                jq -cn --arg runner "${leg}" --argjson shard "${shard}" \
                  --argjson total "${tensor_total}" --argjson timeout "$(timeout_for "${leg}")" \
                  '{corpus: "tensor", shard: $shard, total: $total, runner: $runner,
                    packages: "--package edgefirst-tensor", timeout: $timeout}'
              done
              [[ "${leg}" == ubuntu-* ]] || continue
              IFS=, read -r -a shards <<< "${other_list}"
              for shard in "${shards[@]}"; do
                jq -cn --arg runner "${leg}" --argjson shard "${shard}" \
                  --argjson total "${other_total}" --argjson timeout "$(timeout_for "${leg}")" \
                  '{corpus: "other", shard: $shard, total: $total, runner: $runner,
                    packages: "--package edgefirst-decoder --package edgefirst-tracker --package edgefirst-kernels",
                    timeout: $timeout}'
              done
            done | jq -cs '{include: .}'
          )"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "### Tonight's mutation shards"
            echo ""
            echo "| corpus | shards | of | legs |"
            echo "| --- | --- | ---: | --- |"
            echo "| edgefirst-tensor | ${tensor_list} | ${tensor_total} | ${legs//,/, } |"
            echo "| decoder + tracker + kernels | ${other_list} | ${other_total} | Linux legs only |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tonight: ${matrix}"

  mutants:
    name: ${{ matrix.corpus }} ${{ matrix.shard }}/${{ matrix.total }} (${{ matrix.runner }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-mutants

      # Probes the DMA heap; when it allocates, HAL_TEST_REQUIRE_DMA=1 makes a
      # DMA test that would skip fail.
      - name: DMA heap
        if: runner.os == 'Linux'
        run: bash .github/scripts/dma-heap-setup.sh

      # Selects the WARP adapter. See crates/tensor/src/d3d11/adapter.rs for the
      # selection rules.
      - name: D3D11 adapter
        if: runner.os == 'Windows'
        run: echo "EDGEFIRST_D3D11_ADAPTER=warp" >> "$GITHUB_ENV"

      - name: Run cargo-mutants
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          # .cargo/mutants.toml, read from the workspace root, carries the file
          # exclusions and the exclude_re list. --sharding slice keeps a
          # shard's mutants contiguous in the corpus.
          args=(
            --no-shuffle
            --in-place
            --timeout-multiplier 3
            --shard "${SHARD}/${TOTAL}"
            --sharding slice
            --output mutants-report
          )
          echo "DMA require gate: HAL_TEST_REQUIRE_DMA=${HAL_TEST_REQUIRE_DMA:-unset}"
          rc=0
          # shellcheck disable=SC2086
          cargo mutants "${args[@]}" $PACKAGES || rc=$?
          echo "cargo-mutants exit ${rc}"
          # 0 all caught, 2 some survived, 3 some timed out: the step passes.
          # 1 usage, 4 baseline failing, 5/6 bad --in-diff, 70 internal: the
          # step fails.
          case "${rc}" in
            0|2|3) ;;
            4) echo "::error::cargo-mutants baseline is failing, so no mutants were tested"; exit 1 ;;
            *) echo "::error::cargo-mutants could not run (exit ${rc})"; exit 1 ;;
          esac

      - name: Shard summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          CORPUS: ${{ matrix.corpus }}
          RUNNER_NAME: ${{ matrix.runner }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          # Writes leg.json beside mutants.out: the leg's runner, corpus,
          # shard, packages and DMA state.
          mkdir -p mutants-report
          printf '{"runner": "%s", "corpus": "%s", "shard": %s, "total": %s, "packages": "%s", "dma": "%s"}\n' \
            "${RUNNER_NAME}" "${CORPUS}" "${SHARD}" "${TOTAL}" "${PACKAGES}" \
            "${HAL_CI_DMA_STATE:-n/a}" > mutants-report/leg.json
          cat mutants-report/leg.json
          out=mutants-report/mutants.out
          if [[ ! -d "${out}" ]]; then
            echo "::error::${CORPUS} shard ${SHARD} on ${RUNNER_NAME} produced no report"
            exit 1
          fi
          tested=0
          for f in caught missed timeout unviable; do
            n=$(wc -l < "${out}/${f}.txt" 2>/dev/null || echo 0)
            echo "${f}: ${n}"
            [[ "${f}" == unviable ]] || tested=$(( tested + n ))
          done
          if [[ "${tested}" -eq 0 ]]; then
            echo "::error::${CORPUS} shard ${SHARD} on ${RUNNER_NAME} tested no mutants; the report is empty"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.corpus }}-${{ matrix.shard }}-${{ matrix.runner }}
          path: mutants-report/
          retention-days: 14

  report:
    name: Roll up
    needs: [plan, mutants]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Totals across tonight's shards
        env:
          # The plan's shard list.
          EXPECTED_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          # Merges the shards' outcomes.json reports into one summary. Exits 1
          # on any survivor, or when a leg left unbuilt a file its target
          # compiles.
          python3 .github/scripts/mutants_summary.py --shards shards --github-actions
