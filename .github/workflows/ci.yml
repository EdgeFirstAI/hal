# HAL CI — Quick on every non-draft PR; Full when labeled ci:full / ci:hardware.
# Shared workflows: EdgeFirstAI/.github, pinned in the `uses:` lines below.
#
# Jobs:
#   changes    reads the changed paths, labels and dispatch inputs and selects the tiers
#   quick      shared Quick tier (rust-quick.yml)
#   notice     `make sbom`: NOTICE names every shipped component
#   capi-lint  clippy and checks on the C-API crates, the tensor backends and the benchmarks
#   full       shared Full tier (rust-full.yml), including the boards
#   hal-full   hal's own Full lanes (hal-full.yml)
#   sonar      SonarCloud scan (sonar.yml)
#   ci-gate    fails unless every job above succeeded or was skipped
#
# Action Versions (hash-pinned):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d (v4.0.3)
# - Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 (v2.9.2)

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
      hardware:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      full: ${{ steps.mode.outputs.full }}
      hardware: ${{ steps.mode.outputs.hardware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            code:
              - 'crates/**'
              - 'benchmarks/**/*.rs'
              - 'benchmarks/**/Cargo.*'
              - 'src/**'
              - 'tests/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'pyproject.toml'
              - '.github/**'
              - 'scripts/**'
              - 'Makefile'
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DISPATCH_FULL: ${{ inputs.full }}
          DISPATCH_HARDWARE: ${{ inputs.hardware }}
        run: |
          full=false
          hardware=false
          case "$EVENT_NAME" in
            merge_group) full=true ;;
            workflow_dispatch)
              full="$DISPATCH_FULL"
              hardware="$DISPATCH_HARDWARE"
              ;;
          esac
          case ",$LABELS," in *,ci:full,*) full=true ;; esac
          case ",$LABELS," in *,ci:hardware,*) hardware=true ;; esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "hardware=$hardware" >> "$GITHUB_OUTPUT"

  quick:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-quick.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
    with:
      runner: ubuntu-24.04
      timeout-minutes: 20
      lfs: true
      # ruff lint only.
      python: true
      ruff-paths: crates/python-tensor crates/python-codec crates/python-image crates/python-decoder crates/python-tracker crates/python-kernels crates/python-common tests
      ruff-version: 0.16.7
      cross-clippy-args: --workspace --all-targets --locked --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common -- -D warnings
      pre-command: bash .github/scripts/ci-setup.sh
      clippy-args: --workspace --all-targets --locked --features default,edgefirst-decoder/model-files --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common -- -D warnings
      # Builds the tests without running them when the Full tier runs.
      nextest-args: --workspace --locked --features default,edgefirst-decoder/model-files --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common ${{ needs.changes.outputs.full == 'true' && '--no-run' || '' }}
      cache-key: quick-x86_64

  # `make sbom` resolves the dependency graph for every target that reaches a
  # distributed artifact, and for the workspace-excluded C-API leaves, then fails
  # when a component is absent from NOTICE.
  notice:
    name: NOTICE attribution
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-cyclonedx
      - name: Resolve every shipped target and check NOTICE names each component
        run: make sbom

  # Lints the C-API crates, checks the libraries against both tensor backends,
  # and type-checks the benchmarks workspace.
  capi-lint:
    name: C-API lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config nasm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: rust-x86_64-capi-lint
          cache-on-failure: true
      - name: Clippy on each modular C-API crate
        run: make lint-capi-modular
      - name: Check each published crate on its own, and every library against both tensor backends
        run: make check-standalone
      - name: Only edgefirst-tensor and the leaves name the tensor backend
        run: make lint-backend-scope
      - name: Each leaf rejects the wrong tensor backend
        run: make check-backend-guards
      - name: The workspace-excluded benchmarks compile against the libraries
        run: make check-benchmarks

  full:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.hardware == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
    with:
      lanes: ${{ needs.changes.outputs.full == 'true' && 'all' || 'hardware' }}
      # One job per board identity.
      boards: imx8mp-evk,imx95-evk,rpi5,orin-nano
      archive-glibc: "2.35"
      lfs: true
      python: false
      sonar: false
      scancode: true
      # macOS and Windows lanes live in hal-full.yml.
      skip-macos: true
      skip-windows: true
      timeout-minutes: 45
      board-timeout-minutes: 45
      runner-class-linux: larger
      runner-class-linux-arm: larger
      pre-command: bash .github/scripts/ci-setup.sh
      board-pre-command: BOARD=1 SKIP_PACKAGES=1 SKIP_TESTDATA=1 bash .github/scripts/ci-setup.sh
      # One process per binary: the image and tensor lib binaries filtered to
      # the hardware tests, the whole-binary GPU/DMA integration binaries, and
      # the codec's V4L2 JPEG and MJPEG tests.
      board-binaries: |
        edgefirst_image=g2d,opengl
        edgefirst_tensor=dma
        edgefirst_codec=v4l2
        v4l2_jpeg
        dst_view_stride
        offset_nv_source_upload
        offset_source_view_alignment
        gl_concurrent_stress
        reconstructed_view_convert
        pin_convert
        crop_golden
        mask_golden
        odd_dim_cpu
        video_encode
        video_decode
        video_concurrency
        mjpeg_encode
        mjpeg_decode
        decoded_video_import
        pin
        protocol
        protocol_roundtrip
        identity
        vocabulary
      # Minimum number of tests the board selection must match.
      board-min-tests: "100"
      nextest-args: --workspace --locked --features default,edgefirst-decoder/model-files --exclude edgefirst-python-tensor --exclude edgefirst-python-codec --exclude edgefirst-python-image --exclude edgefirst-python-decoder --exclude edgefirst-python-tracker --exclude edgefirst-python-kernels --exclude edgefirst-python-common
      archive-profile: profiling
      archive-args: --locked --package edgefirst-image --features opengl --package edgefirst-tensor --package edgefirst-codec
    secrets: inherit

  hal-full:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/hal-full.yml
    secrets: inherit

  sonar:
    needs: [changes, full, hal-full]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.hardware == 'true') &&
      (needs.full.result == 'success' || needs.full.result == 'skipped') &&
      (needs.hal-full.result == 'success' || needs.hal-full.result == 'skipped') &&
      (needs.full.result == 'success' || needs.hal-full.result == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/sonar.yml
    secrets: inherit

  ci-gate:
    if: always()
    needs: [changes, quick, notice, capi-lint, full, hal-full, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
