    - imx8mp-evk
    - imx95-evk
    - rpi5
    - orin-nano
    - ubuntu-24.04-xlarge
    - ubuntu-24.04-arm-xlarge
    - ubuntu-22.04-xlarge
    - ubuntu-22.04-arm-xlarge
