[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [
    "benchmarks",
    # C-API leaves: standalone packages built by the Makefile's capi lane.
    "crates/tensor-capi",
    "crates/image-capi",
    "crates/codec-capi",
    "crates/decoder-capi",
    "crates/tracker-capi",
    "crates/kernels-capi",
]
default-members = [
    "crates/tensor",
    "crates/codec",
    "crates/image",
    "crates/decoder",
    "crates/kernels",
]

[workspace.package]
description = "EdgeFirst Hardware Abstraction Layer"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
homepage = "https://edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/hal"
license = "Apache-2.0"
version = "0.40.0"
edition = "2021"
# Minimum supported Rust version.
rust-version = "1.94.0"
readme = "README.md"

[workspace.dependencies]

# External dependencies
approx = "0.5.1"
cbindgen = "0.29"
errno = "0.3"
argminmax = { version = "0.7.1", default-features = false }
crc32fast = "1.5.0"
ctor = "1.0.7"
# Attribute-only crate cargo-mutants reads for `#[cfg_attr(test, mutants::skip)]`.
mutants = "0.0.4"
dma-heap = "0.4.1"
# Internal crates.
edgefirst-bench = { path = "crates/bench" }
edgefirst-build-support = { path = "crates/build-support" }
edgefirst-codec = { version = "0.40.0", path = "crates/codec", default-features = false }
edgefirst-decoder = { version = "0.40.0", path = "crates/decoder", default-features = false }
edgefirst-decoder-abi = { version = "0.40.0", path = "crates/decoder-abi" }
# Vendored fork of `khronos-egl` 6.0.0; imported as `edgefirst_egl`.
edgefirst-egl = { version = "0.40.0", path = "crates/egl", features = ["dynamic"] }
# Vendored trimmed fork of `gls`; imported as `edgefirst_gl`.
edgefirst-gl = { version = "0.40.0", path = "crates/gl" }
edgefirst-image = { version = "0.40.0", path = "crates/image", default-features = false }
edgefirst-kernels = { version = "0.40.0", path = "crates/kernels" }
edgefirst-python-common = { path = "crates/python-common" }
edgefirst-tensor = { version = "0.40.0", path = "crates/tensor", default-features = false }
edgefirst-tensor-abi = { version = "0.40.0", path = "crates/tensor-abi" }
edgefirst-tensor-ffi = { version = "0.40.0", path = "crates/tensor-ffi" }
edgefirst-tracker = { version = "0.40.0", path = "crates/tracker", default-features = false }
edgefirst-v4l2 = "0.2.3"
enum_dispatch = "0.3.13"
# Built without the `regex` default feature.
env_logger = { version = "0.11.10", default-features = false, features = [
    "auto-color",
    "humantime",
] }
fast_image_resize = { version = "6.0.0", features = ["image", "rayon"] }
four-char-code = "2.3.0"
# Portable (platform-neutral) DRM FourCC enum, the same type `gbm` re-exports.
drm-fourcc = "2.2.0"
g2d-sys = "1.3.1"

gbm = { package = "edgefirst-gbm", version = "0.19.0", default-features = false, features = ["dynamic", "drm-support"] }
half = { version = "2.7.1", features = ["num-traits"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
image-compare = "0.5.0"
jpeg-encoder = { version = "0.7.0", features = ["simd"] }
kamadak-exif = "0.6.1"
lapjv = "0.3.0"
libc = "0.2.186"
# Shared with the `edgefirst-egl` fork's `Dynamic` EGL instance.
libloading = "0.9"
# COM declarations for the Windows D3D11 texture backing.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
log = "0.4.33"
nalgebra = "0.35.0"
ndarray = { version = "0.17.2", features = ["rayon"] }
ndarray-stats = "0.7.0"
nix = { version = "0.31.3", features = ["fs", "ioctl", "mman"] }
num-traits = "0.2.19"
numpy = { version = "0.29.0", features = ["half"] }
opencv = { version = "0.101", default-features = false, features = ["imgproc"] }
procfs = "0.18.0"
pyo3 = { version = "0.29.0" }
pyo3-build-config = { version = "0.29.0" }
pythonize = "0.29.0"
rand = "0.10.1"
rand_distr = "0.6.0"
rayon = "1.12.0"
rustc_version = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
# serde_yaml_ng, aliased to keep `serde_yaml::` paths.
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
tokio = { version = "1.52.3", features = ["rt", "sync"] }
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["registry"] }
uuid = { version = "1.23.3", features = ["v4"] }
yuv = { version = "0.8.16", features = ["professional_mode"] }
zip = { version = "9", default-features = false }
zune-jpeg = "0.5.15"
zune-png = "0.5.2"
safetensors = "0.8.0"

# Shipped artifacts: whole-program LTO in one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Every test and CI build: release optimisation with thin LTO.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"

# Members opt in with `[lints] workspace = true`; the workspace-excluded C-API
# leaves carry a copy of this table in their own [lints.rust].
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)', 'cfg(edgefirst_tensor_dynamic)'] }

