[package]
name = "edgefirst-decoder-capi"
description = "C API for EdgeFirst model output decoding"
version = "0.41.0"
edition = "2021"
rust-version = "1.94.0"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
homepage = "https://edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/hal"
license = "Apache-2.0"
publish = false

[lib]
# The shipped artifact is libedgefirst_decoder.{a,so,dylib}.
crate-type = ["staticlib", "cdylib"]
doc = false
name = "edgefirst_decoder"

[features]
default = ["tracing"]
tracing = ["edgefirst-tensor/tracing"]

# Links libedgefirst_tensor.so (dynamic backend + tensor-ffi declarations).
[dependencies]
edgefirst-decoder = { version = "0.41.0", path = "../decoder", default-features = false, features = [
    "model-files",
    "tracker",
] }
uuid = { version = "1.23.3", features = ["v4"] }
# Built with `--cfg edgefirst_tensor_dynamic` (this crate's .cargo/config.toml): calls into libedgefirst_tensor.
edgefirst-tensor = { version = "0.41.0", path = "../tensor", default-features = false }
edgefirst-tensor-abi = { path = "../tensor-abi" }
edgefirst-tensor-ffi = { path = "../tensor-ffi" }
edgefirst-decoder-abi = { path = "../decoder-abi" }
edgefirst-tracker = { version = "0.41.0", path = "../tracker", default-features = false, features = [
    "tensor-boxes",
] }
errno = "0.3"
libc = "0.2.186"
log = "0.4.33"
serde = "1.0"
serde_json = "1.0"

[dev-dependencies]
rayon = "1.12.0"

[build-dependencies]
cbindgen = "0.29"
edgefirst-build-support = { path = "../build-support" }

# Excluded from the workspace; the root's lints and profiles are restated here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)', 'cfg(edgefirst_tensor_dynamic)'] }

# Shipped artifacts only (release branches): whole-program LTO in one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Test and CI builds: release optimisation with thin LTO.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"

# Standalone package: stops cargo's upward workspace search.
[workspace]
resolver = "3"
