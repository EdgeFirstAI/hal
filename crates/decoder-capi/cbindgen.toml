#
# cbindgen configuration for edgefirst/decoder.h.
#
# The include guard is written by hand in `header`/`trailer`.

language = "C"
cpp_compat = true
autogen_warning = "/* WARNING: The generated portion of this file is produced by cbindgen. Do not modify it directly. */"
include_version = true
documentation = true
documentation_style = "doxy"
documentation_length = "full"

header = """
#ifndef EDGEFIRST_DECODER_H
#define EDGEFIRST_DECODER_H

/**
 * @file decoder.h
 * @brief EdgeFirst model output decoding C API
 *
 * SPDX-License-Identifier: Apache-2.0
 * Copyright (c) 2026 Au-Zone Technologies. All Rights Reserved.
 *
 * Turns raw model output tensors into detections and segmentation masks.
 *
 * Configuration is a builder: set fields on an `ef_decoder_params`, then build
 * a decoder from it. Exactly one configuration source must be supplied: an
 * output list, JSON, YAML, or a file.
 *
 * Detections come back as `ef_detect_box_list`. The box / mask / tile
 * layouts themselves live in header-only `edgefirst/detect.h`.
 */

#include <stdarg.h>
#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>
#include <stdlib.h>

#include "edgefirst/detect.h"
#include "edgefirst/tensor.h"

#ifdef __cplusplus
extern "C" {
#endif

/**
 * @brief An opaque decoder.
 */
typedef struct ef_decoder ef_decoder;

/** @brief Opaque decoder configuration, built up field by field. */
typedef struct ef_decoder_params ef_decoder_params;

/** @brief An opaque list of segmentation masks. */
typedef struct ef_segmentation_list ef_segmentation_list;

/** @brief Prototype tensors from `ef_decoder_decode_proto`. */
typedef struct ef_proto_data ef_proto_data;

/** @brief Decoder-local ByteTrack handle. */
typedef struct ef_decoder_tracker ef_decoder_tracker;

/** @brief Track list from `ef_decoder_decode_tracked`. */
typedef struct ef_decoder_track_list ef_decoder_track_list;

/**
 * @name EF_INFER_DTYPE_*
 * @brief Model I/O dtype names for `ef_infer_signals_add_input`/
 * `ef_infer_signals_add_output`.
 *
 * Aliases of `edgefirst/tensor.h`'s `EF_DTYPE_*`. `EF_DTYPE_U64` and
 * `EF_DTYPE_F64` are refused with `EINVAL`.
 */
#define EF_INFER_DTYPE_INT8 EF_DTYPE_I8
#define EF_INFER_DTYPE_UINT8 EF_DTYPE_U8
#define EF_INFER_DTYPE_INT16 EF_DTYPE_I16
#define EF_INFER_DTYPE_UINT16 EF_DTYPE_U16
#define EF_INFER_DTYPE_INT32 EF_DTYPE_I32
#define EF_INFER_DTYPE_UINT32 EF_DTYPE_U32
#define EF_INFER_DTYPE_FLOAT16 EF_DTYPE_F16
#define EF_INFER_DTYPE_FLOAT32 EF_DTYPE_F32
#define EF_INFER_DTYPE_INT64 EF_DTYPE_I64
"""

trailer = """
#ifdef __cplusplus
} /* extern "C" */
#endif

#endif /* EDGEFIRST_DECODER_H */
"""

[export]
prefix = ""
# The option vocabularies, which no function signature names.
include = ["EfNms", "EfDecoderType", "EfDecodeMode", "EfDecoderVersion", "EfOutputType", "EfDimName", "EfMatchMetric", "EfMergeMode", "EfModelSource", "EfConfigSource", "EfModelFamily", "EfModelTask", "EfConfigField"]
# Types declared in edgefirst/tensor.h and edgefirst/detect.h, and the handles
# forward-declared in `header`.
exclude = ["EfTensor", "EfTensorImpl", "EfTensorPlane", "EfDecoder", "EfDecoderParams", "EfSegmentationList", "EfDetectBox", "EfSegmentation", "EfMergeConfig", "TilePlacement", "EfTilePlacement", "EfProtoData", "EfDecoderTracker", "EfDecoderTrackList", "EfPreprocessSpec", "EfFit", "EfLetterboxPlacement", "EfPadSpace", "EfInterpolation"]


[export.rename]
"EfTensor" = "ef_tensor"
"EfDecoder" = "ef_decoder"
"EfDecoderParams" = "ef_decoder_params"
"EfSegmentationList" = "ef_segmentation_list"
"EfSegmentation" = "ef_segmentation"
"EfMergeConfig" = "ef_merge_config"
"EfTilePlacement" = "ef_tile_placement"
"EfTiledFrameAccumulator" = "ef_tiled_frame_accumulator"
"EfDetectBoxList" = "ef_detect_box_list"
"EfDetectBox" = "ef_detect_box"
"EfProtoData" = "ef_proto_data"
"EfDecoderTracker" = "ef_decoder_tracker"
"EfDecoderTrackList" = "ef_decoder_track_list"
"EfDecoderTrack" = "ef_decoder_track"
"EfInferSignals" = "ef_infer_signals"
"EfInferredSchema" = "ef_inferred_schema"
"EfNms" = "ef_nms"
"EfDecoderType" = "ef_decoder_type"
"EfDimName" = "ef_dim_name"
"EfDecoderVersion" = "ef_decoder_version"
"EfOutputType" = "ef_output_type"
"EfMatchMetric" = "ef_match_metric"
"EfMergeMode" = "ef_merge_mode"
"EfModelSource" = "ef_model_source"
"EfDecodeMode" = "ef_decode_mode"
"EfSemanticOptions" = "ef_semantic_options"
"EfModelOverrides" = "ef_model_overrides"
"EfModelConfig" = "ef_model_config"
"EfPreprocessSpec" = "ef_preprocess_spec"
"EfConfigSource" = "ef_config_source"
"EfModelFamily" = "ef_model_family"
"EfModelTask" = "ef_model_task"
"EfConfigField" = "ef_config_field"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[struct]
rename_fields = "SnakeCase"

[fn]
rename_args = "SnakeCase"
args = "auto"
sort_by = "None"

[parse]
# Dependency parsing is restricted to `edgefirst-decoder-abi`.
parse_deps = true
include = ["edgefirst-decoder-abi"]
clean = false
