[package]
name = "edgefirst-codec-capi"
description = "C API for EdgeFirst image decode and encode"
version = "0.37.0"
edition = "2021"
rust-version = "1.94.0"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
homepage = "https://edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/hal"
license = "Apache-2.0"
publish = false # C library - distributed via GitHub Releases, not crates.io

[lib]
# The shipped artifact is libedgefirst_codec.{a,so,dylib} -- NOT
# `..._capi`. The `-capi` suffix names the *source crate*, mirroring the
# `python-*` siblings; it must never reach a filename a consumer links against.
# `rlib` is deliberately absent: it would collide with the edgefirst-codec
# crate's own libedgefirst_codec.rlib, and nothing needs it.
crate-type = ["staticlib", "cdylib"]
# Shares its lib name with the library crate it wraps; rustdoc output would collide.
doc = false
name = "edgefirst_codec"

[features]
default = ["tracing"]
tracing = ["edgefirst-tensor/tracing"]

# Links libedgefirst_tensor.so (dynamic backend + tensor-ffi declarations)
# rather than embedding a private tensor copy.
[dependencies]
# The decoders this library ships, spelled out rather than inherited from codec's defaults.
edgefirst-codec = { version = "0.37.0", path = "../codec", default-features = false, features = [
    "v4l2",
    "nvjpeg",
    "png",
] }
# Built with `--cfg edgefirst_tensor_dynamic` (this crate's .cargo/config.toml): calls into libedgefirst_tensor.
edgefirst-tensor = { version = "0.37.0", path = "../tensor", default-features = false }
edgefirst-tensor-abi = { path = "../tensor-abi" }
edgefirst-tensor-ffi = { path = "../tensor-ffi" }
errno = "0.3"
jpeg-encoder = { version = "0.7.0", features = ["simd"] }
libc = "0.2.186"
log = "0.4.33"

[build-dependencies]
cbindgen = "0.29"
edgefirst-build-support = { path = "../build-support" }

# Excluded from the workspace (see the root Cargo.toml's [workspace.exclude]
# comment), so this crate inherits NEITHER the root's [workspace.lints] NOR
# its [profile.release]/[profile.profiling] -- both are restated here by hand. CONTRIBUTING.md
# documents why and says to keep this in sync with the root manually.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)', 'cfg(edgefirst_tensor_dynamic)'] }

# Shipped artifacts only (release branches): whole-program LTO in one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Every test and CI build: release optimisation without the fat-LTO link time.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"

# Standalone package: stops cargo's upward workspace search. The resolver is
# pinned to match the root workspace's behavior.
[workspace]
resolver = "3"
