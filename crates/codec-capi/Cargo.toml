[package]
name = "edgefirst-codec-capi"
description = "C API for EdgeFirst image and video encode and decode"
version = "0.41.0"
edition = "2021"
rust-version = "1.94.0"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
homepage = "https://edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/hal"
license = "Apache-2.0"
publish = false

[lib]
# The library is libedgefirst_codec.{a,so,dylib}; no `rlib` is built.
crate-type = ["staticlib", "cdylib"]
doc = false
name = "edgefirst_codec"

[features]
default = ["tracing"]
tracing = ["edgefirst-tensor/tracing"]

# Links libedgefirst_tensor.so (dynamic backend and tensor-ffi declarations).
[dependencies]
# The engines this library ships.
edgefirst-codec = { version = "0.41.0", path = "../codec", default-features = false, features = [
    "v4l2",
    "nvjpeg",
    "png",
    "media-foundation",
] }
# Built with `--cfg edgefirst_tensor_dynamic` (this crate's .cargo/config.toml): calls into libedgefirst_tensor.
edgefirst-tensor = { version = "0.41.0", path = "../tensor", default-features = false }
edgefirst-tensor-abi = { path = "../tensor-abi" }
edgefirst-tensor-ffi = { path = "../tensor-ffi" }
errno = "0.3"
jpeg-encoder = { version = "0.7.0", features = ["simd"] }
libc = "0.2.186"
log = "0.4.33"

[build-dependencies]
cbindgen = "0.29"
edgefirst-build-support = { path = "../build-support" }

# Excluded from the workspace: the lints and profiles of the root Cargo.toml
# are restated here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)', 'cfg(edgefirst_tensor_dynamic)'] }

# Release: whole-program LTO in one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Profiling: release optimisation without fat LTO.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"

# Standalone package: stops cargo's upward workspace search, with the root
# workspace's resolver.
[workspace]
resolver = "3"
