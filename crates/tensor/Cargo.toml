[package]
name = "edgefirst-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Zero-copy tensor memory management with DMA, shared memory, and heap backends"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["tensor", "dma", "shared-memory", "zero-copy", "edge-ai"]
categories = ["data-structures", "memory-management", "embedded", "science"]
documentation = "https://docs.rs/edgefirst-tensor"

[lints]
workspace = true

[features]
default = ["ndarray"]
ndarray = ["dep:ndarray"]
# Perfetto/Chrome trace capture.
tracing = ["dep:tracing-chrome", "dep:tracing-subscriber"]

[dependencies]
# The frozen `EfClientState` vocabulary. Always on, both backends: `pbo.rs`'s
# `PboOpsVtable` is a C-ABI view onto `PboOps` and is compiled into both, so
# the struct it embeds has to be visible in both. That crate is
# dependency-free by charter, so the edge costs nothing downstream.
edgefirst-tensor-abi = { workspace = true }
half = { workspace = true }
libloading = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true, optional = true }
num-traits = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-chrome = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true }
# Errno constants for the dynamic backend, plus DMA/IOSurface FFI. Always on
# so Windows/Android C-API leaves that compile `dynamic` still type-check.
libc = { workspace = true }

# The dynamic backend (`--cfg edgefirst_tensor_dynamic`) calls libedgefirst_tensor through these declarations.
[target.'cfg(edgefirst_tensor_dynamic)'.dependencies]
edgefirst-tensor-ffi = { workspace = true }

[target.'cfg(all(target_os = "linux", not(miri)))'.dependencies]
dma-heap = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
ctor = { workspace = true }
env_logger = { workspace = true }
edgefirst-bench = { workspace = true }
serde_json = { workspace = true }
# `tests/dynamic_primitives.rs` drives `ef_tensor_builder_*` directly to
# build a tensor as "another producer" would, independent of this crate's
# own `dynamic`-backend constructors -- not re-exported by this crate's own
# public API, so the integration test needs its own dependency edge.
edgefirst-tensor-ffi = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = { workspace = true }
# `tests/vivid_capture_import.rs` captures from the kernel's vivid driver to
# import a real padded V4L2 capture buffer.
edgefirst-v4l2 = { workspace = true }

[[bench]]
name = "tensor_benchmark"
harness = false
