[package]
name = "edgefirst-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Zero-copy tensor memory management with DMA, shared memory, and heap backends"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["tensor", "dma", "shared-memory", "zero-copy", "edge-ai"]
categories = ["data-structures", "memory-management", "embedded", "science"]
documentation = "https://docs.rs/edgefirst-tensor"

[lints]
workspace = true

[features]
default = ["ndarray"]
ndarray = ["dep:ndarray"]
# Perfetto/Chrome trace capture.
tracing = ["dep:tracing-chrome", "dep:tracing-subscriber"]

[dependencies]
# The `EfClientState` vocabulary.
edgefirst-tensor-abi = { workspace = true }
half = { workspace = true }
libloading = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true, optional = true }
num-traits = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-chrome = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true }
# Errno constants for the dynamic backend, plus DMA/IOSurface FFI.
libc = { workspace = true }

# The dynamic backend (`--cfg edgefirst_tensor_dynamic`) calls libedgefirst_tensor through these declarations.
[target.'cfg(edgefirst_tensor_dynamic)'.dependencies]
edgefirst-tensor-ffi = { workspace = true }

[target.'cfg(all(target_os = "linux", not(miri)))'.dependencies]
dma-heap = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
ctor = { workspace = true }
env_logger = { workspace = true }
edgefirst-bench = { workspace = true }
serde_json = { workspace = true }
# `tests/dynamic_primitives.rs` drives `ef_tensor_builder_*` directly.
edgefirst-tensor-ffi = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = { workspace = true }
# `tests/vivid_capture_import.rs` captures from the kernel's vivid driver.
edgefirst-v4l2 = { workspace = true }

[[bench]]
name = "tensor_benchmark"
harness = false
