[project]
name = "edgefirst-decoder"
dynamic = ["version"]
description = "ML model output decoding for YOLO and ModelPack object detection and segmentation"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["yolo", "object-detection", "segmentation", "nms", "edge-ai"]
authors = [{name = "Au-Zone Technologies", email = "support@au-zone.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy", "edgefirst-tensor ~= 0.29.4"]

[project.urls]
Homepage = "https://edgefirst.ai"
Repository = "https://github.com/EdgeFirstAI/hal"
Documentation = "https://github.com/EdgeFirstAI/hal/blob/main/crates/python-decoder/README.md"
Changelog = "https://github.com/EdgeFirstAI/hal/blob/main/CHANGELOG.md"
Issues = "https://github.com/EdgeFirstAI/hal/issues"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "edgefirst.decoder._decoder"
python-source = "python"
