[package]
name = "edgefirst-python-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# An rlib: every extension module statically links its own copy.
[lints]
workspace = true

[lib]
name = "edgefirst_python_common"
# The doc comments in this crate are PyO3 docstrings in reStructuredText and
# are not compiled as doctests.
doctest = false

[features]
# Each extension enables only its own domain.
default = []
tensor = ["dep:edgefirst-tensor"]
codec = ["tensor", "dep:edgefirst-codec"]
# Image processing only: tensor + image. No decoder, no tracker, no codec.
image = ["tensor", "dep:edgefirst-image"]
decoder = ["tensor", "dep:edgefirst-decoder", "dep:edgefirst-decoder-abi"]
# Tracker consumes plain boxes and does not enable tensor.
tracker = ["dep:edgefirst-tracker"]
# Kernels operate on borrowed numpy buffers and do not enable tensor.
kernels = ["dep:edgefirst-kernels"]
abi3-py38 = ["pyo3/abi3-py38"]
abi3-py311 = ["pyo3/abi3-py311"]

[dependencies]
edgefirst-tensor = { workspace = true, default-features = false, optional = true }
# Each extension states exactly the library features it ships.
edgefirst-codec = { workspace = true, optional = true, default-features = false, features = ["v4l2", "nvjpeg", "png", "media-foundation"] }
# `opengl` enables the GPU path; the workspace entry disables image's defaults.
edgefirst-image = { workspace = true, optional = true, default-features = false, features = [
    "opengl",
] }
# `model-files` reads model configs from ZIP trailers (TFLite associated files).
edgefirst-decoder = { workspace = true, optional = true, default-features = false, features = ["model-files"] }
edgefirst-decoder-abi = { workspace = true, optional = true }
edgefirst-kernels = { workspace = true, optional = true }
edgefirst-tracker = { workspace = true, optional = true, default-features = false }
env_logger = { workspace = true }
four-char-code = { workspace = true }
half = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true }
num-traits = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module"] }
pythonize = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
edgefirst-build-support = { workspace = true }
pyo3-build-config = { workspace = true, features = ["resolve-config"] }
rustc_version = { workspace = true }
