[package]
name = "edgefirst-kernels-capi"
description = "C API for EdgeFirst quantized compute kernels"
version = "0.41.0"
edition = "2021"
rust-version = "1.94.0"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
homepage = "https://edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/hal"
license = "Apache-2.0"
publish = false

[lib]
# The shipped artifact is libedgefirst_kernels.{a,so,dylib}.
crate-type = ["staticlib", "cdylib"]
doc = false
name = "edgefirst_kernels"

[features]
default = []

# This library links no sibling library.
[dependencies]
edgefirst-kernels = { version = "0.41.0", path = "../kernels" }
half = "2.7.1"
errno = "0.3"
libc = "0.2.186"

[dev-dependencies]
safetensors = "0.8.0"

[build-dependencies]
cbindgen = "0.29"

# This crate is outside the workspace; the root's lints and profiles are restated here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

# Shipped artifacts: whole-program LTO in one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Test and CI builds: release optimisation without fat LTO.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"

# Standalone package: stops cargo's upward workspace search.
[workspace]
resolver = "3"
