include = ["EfKernelDtype", "EfKernelBoxFormat", "EfTfliteKernels", "EfKernelActivation", "EfBinaryOp"]
exclude = ["EfSoftmaxI8Plan", "EfSoftmaxI16Plan", "EfSigmoidPlan", "EfDflPlan", "EfDist2bboxPlan", "EfDflBoxPlan", "EfLutI8Plan", "EfBinaryI8Plan", "EfMatmulI8Plan", "EfSoftmaxDotI8Plan", "EfAttentionI8Plan", "EfAttentionScratch"]

