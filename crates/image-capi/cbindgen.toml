#
# cbindgen configuration for edgefirst/image.h.
#
# The include guard is written by hand in `header` and `trailer`.

language = "C"
cpp_compat = true
autogen_warning = "/* WARNING: The generated portion of this file is produced by cbindgen. Do not modify it directly. */"
include_version = true
documentation = true
documentation_style = "doxy"
documentation_length = "full"

header = """
#ifndef EDGEFIRST_IMAGE_H
#define EDGEFIRST_IMAGE_H

/**
 * @file image.h
 * @brief EdgeFirst image processing C API
 *
 * SPDX-License-Identifier: Apache-2.0
 * Copyright (c) 2026 Au-Zone Technologies. All Rights Reserved.
 *
 * Hardware-accelerated image processing: conversion, scaling and colour
 * handling across GL, G2D and CPU backends.
 *
 * `ef_image_processor_create_image` returns an `ef_tensor`. A PBO-backed
 * tensor is allocated only through a processor.
 *
 * A tensor from here is an ordinary `ef_tensor`. There is one tensor
 * header, `edgefirst/tensor.h`. Detection primitives used when drawing
 * masks live in header-only `edgefirst/detect.h`.
 *
 * Platform-specific entry points. Each is declared on every platform and
 * refuse at run time off their platform. Each function states its
 * platforms on a "Platforms:" line:
 *   - Linux, macOS, iOS, Android: ef_image_processor_convert_fence and
 *     ef_image_processor_tile_into_fence (sync-fence fd; a fence is
 *     returned on Linux and Android where the EGL display has
 *     EGL_ANDROID_native_fence_sync)
 *   - Windows: ef_image_processor_convert_fence_handle and
 *     ef_image_processor_tile_into_fence_handle (event handle)
 */

#include <stdarg.h>
#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>
#include <stdlib.h>

#include "edgefirst/detect.h"
#include "edgefirst/tensor.h"

#ifdef __cplusplus
extern "C" {
#endif

/**
 * @brief An opaque image processor.
 */
typedef struct ef_image_processor ef_image_processor;

/**
 * @brief Opaque convert options.
 *
 * Built with `ef_convert_options_new` and the `ef_convert_options_set_*`
 * setters, freed with `ef_convert_options_free`. `NULL` where options are
 * accepted means the defaults.
 */
typedef struct ef_convert_options ef_convert_options;

/** @brief An owned list of materialized masks. */
typedef struct ef_mask_list ef_mask_list;

/** @brief Opaque list of tile specs from `ef_tile_grid`. */
typedef struct ef_tile_spec_list ef_tile_spec_list;

/** @brief Opaque list of tile placements from plan/tile_into. */
typedef struct ef_tile_placement_list ef_tile_placement_list;
"""

trailer = """
#ifdef __cplusplus
} /* extern "C" */
#endif

#endif /* EDGEFIRST_IMAGE_H */
"""

[export]
prefix = ""
# EfTensor, EfTensorImpl, EfTensorPlane and EfTensorImageDesc are declared in
# edgefirst/tensor.h, which this header includes.
exclude = [
  "EfTensor",
  "EfTensorImpl",
  "EfTensorPlane",
  "EfTensorImageDesc",
  "EfImageProcessor",
  "EfConvertOptions",
  "EfMaskList",
  "EfTileSpecList",
  "EfTilePlacementList",
  "EfTilePlacement",
  "EfDetectBox",
  "EfSegmentation",
  # Declared in detect.h.
  "EfPreprocessSpec",
  "EfFit",
  "EfLetterboxPlacement",
  "EfPadSpace",
  "EfInterpolation",
]
# The option vocabularies, which no function signature references.
include = [
  "EfRotation",
  "EfFlip",
  "EfColorMode",
  "EfComputeBackend",
  "EfNormalization",
]


[export.rename]
"EfTensor" = "ef_tensor"
"EfImageProcessor" = "ef_image_processor"
"EfTensorImageDesc" = "ef_tensor_image_desc"
"EfConvertOptions" = "ef_convert_options"
"EfTilingConfig" = "ef_tiling_config"
"EfTileSpec" = "ef_tile_spec"
"EfTilePlacement" = "ef_tile_placement"
"EfMaskList" = "ef_mask_list"
"EfTileSpecList" = "ef_tile_spec_list"
"EfTilePlacementList" = "ef_tile_placement_list"
"EfDetectBox" = "ef_detect_box"
"EfSegmentation" = "ef_segmentation"
"EfRotation" = "ef_rotation"
"EfFlip" = "ef_flip"
"EfColorMode" = "ef_color_mode"
"EfFit" = "ef_fit"
"EfComputeBackend" = "ef_compute_backend"
"EfLetterboxPlacement" = "ef_letterbox_placement"
"EfNormalization" = "ef_normalization"
"EfPadSpace" = "ef_pad_space"
"EfInterpolation" = "ef_interpolation"
"EfPreprocessSpec" = "ef_preprocess_spec"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[struct]
rename_fields = "SnakeCase"

[fn]
rename_args = "SnakeCase"
args = "auto"
sort_by = "None"

[parse]
parse_deps = true
include = ["edgefirst-decoder-abi"]
clean = false
