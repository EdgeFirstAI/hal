[package]
name = "edgefirst-decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ML model output decoding for YOLO and ModelPack object detection and segmentation"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["yolo", "object-detection", "segmentation", "nms", "edge-ai"]
categories = ["multimedia::images", "science", "algorithms"]
documentation = "https://docs.rs/edgefirst-decoder"

[lints]
workspace = true

[features]
default = []
#default = ["tracker"]
tracker = ["dep:edgefirst-tracker", "edgefirst-tracker/tensor-boxes"]

[dependencies]
argminmax = { workspace = true }
# `ndarray` lets the decoder materialise its masks into the TensorDyn that `Segmentation` carries.
edgefirst-tensor = { workspace = true, default-features = false, features = ["ndarray"] }
edgefirst-decoder-abi = { workspace = true }
edgefirst-tracker = { workspace = true, optional = true, default-features = false }
half = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true }
ndarray-stats = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
edgefirst-bench = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
safetensors = { workspace = true }
tracing-subscriber = { workspace = true }
zip = { workspace = true }

[[bench]]
name = "decoder_benchmark"
harness = false
