[project]
name = "edgefirst-kernels"
dynamic = ["version"]
description = "Quantized and floating-point compute kernels (softmax, sigmoid, DFL, dist2bbox) for edge AI inference"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["kernels", "softmax", "sigmoid", "dfl", "quantization", "edge-ai"]
authors = [{name = "Au-Zone Technologies", email = "support@au-zone.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://edgefirst.ai"
Repository = "https://github.com/EdgeFirstAI/hal"
Documentation = "https://github.com/EdgeFirstAI/hal/blob/main/crates/python-kernels/README.md"
Changelog = "https://github.com/EdgeFirstAI/hal/blob/main/CHANGELOG.md"
Issues = "https://github.com/EdgeFirstAI/hal/issues"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "edgefirst.kernels._kernels"
python-source = "python"
