[package]
name = "edgefirst-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Image and video codecs for EdgeFirst tensors: JPEG/PNG decode into pre-allocated tensors and hardware H.264 encode"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["jpeg", "png", "image-decoding", "zero-copy", "edge-ai"]
categories = ["multimedia::images", "embedded"]
documentation = "https://docs.rs/edgefirst-codec"

[features]
# The v4l2 and nvjpeg backends are gated to Linux and media-foundation to
# Windows. nvjpeg loads libnvjpeg.so.12 and media-foundation loads mfplat.dll
# at runtime.
default = ["v4l2", "nvjpeg", "png", "media-foundation"]
v4l2 = ["dep:edgefirst-v4l2", "dep:libc"]
media-foundation = ["dep:windows", "dep:libloading"]
png = ["dep:zune-png"]
nvjpeg = ["dep:libloading"]
opencv = ["dep:opencv"]
turbojpeg = ["dep:turbojpeg"]

[dependencies]
edgefirst-tensor = { workspace = true, default-features = false }
jpeg-encoder = { workspace = true }
kamadak-exif = { workspace = true }
libloading = { workspace = true, optional = true }
log = { workspace = true }
num-traits = { workspace = true }
opencv = { workspace = true, optional = true }
tracing = { workspace = true }
turbojpeg = { version = "1.4", optional = true }
zune-png = { workspace = true, optional = true }

# Hardware JPEG decode and video (v4l2 feature), Linux only: device
# discovery, the buffer queues and events, and the media controller graph.
[target.'cfg(target_os = "linux")'.dependencies]
edgefirst-v4l2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

# H.264 encode and decode through the Media Foundation transforms
# (media-foundation feature).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
edgefirst-bench = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true }
# Used by parity tests and the comparison benchmark.
zune-jpeg = { workspace = true }
# Comparison arm in codec_benchmark.
zune-png = { workspace = true }


[[bench]]
name = "codec_benchmark"
harness = false

[[example]]
name = "video-encode"
path = "examples/video_encode.rs"

[[example]]
name = "video-decode"
path = "examples/video_decode.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
