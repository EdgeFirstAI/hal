[package]
name = "edgefirst-tracker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Multi-object tracking with ByteTrack for edge AI video analytics"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["tracking", "bytetrack", "object-tracking", "kalman-filter", "edge-ai"]
categories = ["multimedia::images", "science", "algorithms"]
documentation = "https://docs.rs/edgefirst-tracker"

[lints]
workspace = true

[features]
default = ["tensor-boxes"]
# Enables `impl DetectionBox for DetectBox`.
tensor-boxes = ["dep:edgefirst-tensor"]

[dependencies]
# Optional: provides the `DetectBox` type for `impl DetectionBox`.
edgefirst-tensor = { workspace = true, default-features = false, optional = true }
enum_dispatch = { workspace = true }
lapjv = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
ndarray = { workspace = true }
num-traits = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
edgefirst-bench = { path = "../bench" }

[[bench]]
name = "tracker_benchmark"
harness = false
