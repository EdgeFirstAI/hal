#
# cbindgen configuration for edgefirst/tensor.h.
#
# The include guard is written by hand in `header`/`trailer`.

language = "C"
# Emit enum declarations that compile as both C and C++.
cpp_compat = true
autogen_warning = "/* WARNING: The generated portion of this file is produced by cbindgen. Do not modify it directly. */"
include_version = true
documentation = true
documentation_style = "doxy"
documentation_length = "full"

header = """
#ifndef EDGEFIRST_TENSOR_H
#define EDGEFIRST_TENSOR_H

/**
 * @file tensor.h
 * @brief EdgeFirst tensor C API
 *
 * SPDX-License-Identifier: Apache-2.0
 * Copyright (c) 2026 Au-Zone Technologies. All Rights Reserved.
 *
 * The tensor header. Every sibling library's header includes it.
 *
 * The handle is opaque. Every accessor is an exported function of
 * libedgefirst_tensor. A tensor from ef_image_processor_create_image() and
 * one from ef_tensor_new() are the same kind of object.
 *
 * Three surfaces:
 *   - Opaque handle + exported accessors, for in-process access.
 *   - A builder, for construction, with sticky errors.
 *   - A (blob, fds) pair, for IPC. Fds travel out of band.
 *
 * Platform-specific entry points. Every function is declared on every
 * platform and refuses at run time off its platform. Each function states
 * its platforms on a "Platforms:" line:
 *   - Linux:   dma-buf fds (the DMA_BUF export kind); ef_tensor_clone_fd
 *              duplicates the fd of any Unix backing that has one
 *   - macOS, iOS: IOSurface (ef_tensor_iosurface_ref, ef_tensor_from_iosurface_id)
 *   - Android: AHardwareBuffer (ef_tensor_from_hardware_buffer, ef_tensor_hardware_buffer_*)
 *   - Windows: D3D11 textures (ef_d3d11_*, ef_tensor_d3d11_*, ef_tensor_gpu_completion,
 *              ef_tensor_gpu_write_value, ef_tensor_set_gpu_write, ef_tensor_from_d3d11_*)
 *   - any host with a CUDA driver: ef_tensor_cuda_*
 */

#include <stdarg.h>
#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>
#include <stdio.h>
#include <stdlib.h>

#ifdef __cplusplus
extern "C" {
#endif

/**
 * @brief An opaque tensor handle.
 */
typedef struct ef_tensor ef_tensor;

/**
 * @brief Opaque builder handle.
 */
typedef struct ef_tensor_builder ef_tensor_builder;
"""

trailer = """
#ifdef __cplusplus
} /* extern "C" */
#endif

#endif /* EDGEFIRST_TENSOR_H */
"""

[export]
prefix = ""
# Internal types that do not appear in the header.
exclude = [
  "EfTensor",
  "EfTensorImpl",
  "EfTensorBuilder",
]
# cbindgen only emits types reachable from an `extern "C"` signature; the
# vocabulary enums are included explicitly.
include = [
  "EfDtype",
  "EfStorageKind",
  "EfCpuAccess",
  "EfCompression",
  "EfCompressionRequest",
  "EfContiguity",
  "EfErrorClass",
  "EfLogLevel",
]

[export.rename]
"EfTensor" = "ef_tensor"
"EfTensorBuilder" = "ef_tensor_builder"
"EfTensorImageDesc" = "ef_tensor_image_desc"
"EfTensorPlane" = "ef_tensor_plane"
"EfImageDescView" = "ef_image_desc_view"
"EfDtype" = "ef_dtype"
"EfStorageKind" = "ef_storage_kind"
"EfCpuAccess" = "ef_cpu_access"
"EfTensorView" = "ef_tensor_view"
"EfQuantizationInfo" = "ef_quantization_info"
"EfCompression" = "ef_compression"
"EfCompressionRequest" = "ef_compression_request"
"EfContiguity" = "ef_contiguity"
"EfErrorClass" = "ef_error_class"
"EfLogLevel" = "ef_log_level"
"EfD3d11Layout" = "ef_d3d11_layout"
"EfClientState" = "ef_client_state"
# The nullable aliases carry the C names. The bare `EfPboMapFn` /
# `EfPboUnmapFn` are not emitted.
"EfPboMapFnNullable" = "ef_pbo_map_fn"
"EfPboUnmapFnNullable" = "ef_pbo_unmap_fn"
# `EfClientRefFn` has no entry: it does not reach the header.

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[struct]
rename_fields = "SnakeCase"

[fn]
rename_args = "SnakeCase"
args = "auto"
sort_by = "None"

[parse]
parse_deps = true
include = ["edgefirst-tensor-abi"]
clean = false
