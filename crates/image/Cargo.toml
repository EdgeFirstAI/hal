[package]
name = "edgefirst-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "High-performance image processing with hardware acceleration for edge AI"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["image-processing", "computer-vision", "gpu", "edge-ai", "nv12"]
categories = ["multimedia::images", "multimedia::video", "embedded"]
documentation = "https://docs.rs/edgefirst-image"

[lints]
workspace = true

[features]
default = ["opengl", "codec"]
opengl = ["dep:edgefirst-egl", "dep:gbm", "dep:drm-fourcc"]
# JPEG/PNG decode helpers used by tests, benches, and examples. Off in
# image-capi and python-image so those artifacts do not embed the codec.
codec = ["dep:edgefirst-codec"]
# The decoder-taking convenience wrappers (`draw_masks`,
# `draw_masks_tracked`). OFF by default: the generic drawing surface
# (`draw_decoded_masks`, `draw_proto_masks`) is unconditional and equally
# fused, so the default build renders masks without linking a model decoder
# -- and without the YAML/JSON/stats stack that came with it.
decode = ["dep:edgefirst-decoder"]
# `tracker` implies `decode`: draw_masks_tracked needs the decoder, and
# `edgefirst-decoder/tracker` cannot enable a feature on a dependency that is
# otherwise off.
tracker = ["decode", "edgefirst-decoder/tracker", "dep:edgefirst-tracker", "edgefirst-tracker/tensor-boxes"]
opencv = ["dep:opencv"]

[dependencies]
edgefirst-codec = { workspace = true, optional = true, default-features = false, features = [
    "v4l2",
    "nvjpeg",
    "png",
] }
edgefirst-tensor = { workspace = true, default-features = false, features = ["ndarray"] }
edgefirst-decoder-abi = { workspace = true }
enum_dispatch = { workspace = true }
fast_image_resize = { workspace = true }
four-char-code = { workspace = true }
edgefirst-gl = { workspace = true }
half = { workspace = true }
jpeg-encoder = { workspace = true }
kamadak-exif = { workspace = true }
edgefirst-egl = { workspace = true, optional = true }
libc = { workspace = true }
libloading = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true }
num-traits = { workspace = true }
opencv = { workspace = true, optional = true }
rayon = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
yuv = { workspace = true }
edgefirst-decoder = { workspace = true, optional = true }
edgefirst-tracker = { workspace = true, optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dma-heap = { workspace = true }
# Portable DRM FourCC enum (the type `gbm` re-exports), used directly so the
# format mapping does not pull in `gbm`. DRM FourCC is a Linux/DMA-BUF concept,
# so the dep lives with the other Linux graphics deps.
drm-fourcc = { workspace = true, optional = true }
g2d-sys = { workspace = true }
gbm = { workspace = true, optional = true }

[dev-dependencies]
# Tests build real decoders to exercise the integration. A dev-dependency
# never propagates to consumers, so this does not undo the `decode` gating --
# `cargo tree -e normal` stays clean.
edgefirst-decoder = { workspace = true }
ctor = { workspace = true }
env_logger = { workspace = true }
crc32fast = { workspace = true }
edgefirst-bench = { workspace = true }
image = { workspace = true }
image-compare = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The span-field capture in `gl/tests.rs` needs a subscriber with a real
# current-span stack: `Span::current()` asks through `Subscriber::current_span`,
# whose default is `Current::unknown()`, so a hand-rolled subscriber would make
# every `Span::current().record()` under test look like a no-op.
tracing-subscriber = { workspace = true }

[[bench]]
name = "image_benchmark"
harness = false

[[bench]]
name = "pipeline_benchmark"
harness = false

[[bench]]
name = "nv_path_benchmark"
harness = false

[[bench]]
name = "mask_benchmark"
harness = false

[[bench]]
name = "parallel_processors_benchmark"
harness = false

[[bench]]
name = "mask_decode_benchmark"
harness = false

[[bench]]
name = "sanity_check"
harness = false

[[bench]]
name = "decode_pipeline_benchmark"
harness = false

[[bench]]
name = "nvjpeg_benchmark"
harness = false

[[bench]]
name = "convert_matrix_benchmark"
harness = false

[[bench]]
name = "cpu_preprocess_benchmark"
harness = false

[[bench]]
name = "batch_convert_benchmark"
harness = false

[[bench]]
name = "tiled_convert_benchmark"
harness = false

[[bench]]
name = "opencv_benchmark"
harness = false
required-features = ["opencv"]
