[package]
name = "edgefirst-tracker-capi"
description = "C API for EdgeFirst multi-object tracking"
version = "0.38.2"
edition = "2021"
rust-version = "1.94.0"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
homepage = "https://edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/hal"
license = "Apache-2.0"
publish = false # C library - distributed via GitHub Releases, not crates.io

[lib]
# The shipped artifact is libedgefirst_tracker.{a,so,dylib} -- NOT
# `..._capi`. The `-capi` suffix names the *source crate*, mirroring the
# `python-*` siblings; it must never reach a filename a consumer links against.
# `rlib` is deliberately absent: it would collide with the edgefirst-tracker
# crate's own libedgefirst_tracker.rlib, and nothing needs it.
crate-type = ["staticlib", "cdylib"]
# Shares its lib name with the library crate it wraps; rustdoc output would collide.
doc = false
name = "edgefirst_tracker"

[features]
default = []

# Tracker consumes detections as a plain C array. It does not link
# libedgefirst_tensor or libedgefirst_decoder.
[dependencies]
edgefirst-tracker = { version = "0.38.2", path = "../tracker", default-features = false }
uuid = { version = "1.23.3", features = ["v4"] }
edgefirst-decoder-abi = { path = "../decoder-abi" }
errno = "0.3"
libc = "0.2.186"
log = "0.4.33"

[build-dependencies]
cbindgen = "0.29"

# Excluded from the workspace (see the root Cargo.toml's [workspace.exclude]
# comment), so this crate inherits NEITHER the root's [workspace.lints] NOR
# its [profile.release]/[profile.profiling] -- both are restated here by hand. CONTRIBUTING.md
# documents why and says to keep this in sync with the root manually.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

# Shipped artifacts only (release branches): whole-program LTO in one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Every test and CI build: release optimisation without the fat-LTO link time.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"

# Standalone package: stops cargo's upward workspace search. The resolver is
# pinned to match the root workspace's behavior.
[workspace]
resolver = "3"
