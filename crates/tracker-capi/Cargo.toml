[package]
name = "edgefirst-tracker-capi"
description = "C API for EdgeFirst multi-object tracking"
version = "0.41.0"
edition = "2021"
rust-version = "1.94.0"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
homepage = "https://edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/hal"
license = "Apache-2.0"
publish = false

[lib]
# The shipped artifact is libedgefirst_tracker.{a,so,dylib}.
crate-type = ["staticlib", "cdylib"]
doc = false
name = "edgefirst_tracker"

[features]
default = []

# Tracker consumes detections as a plain C array. It does not link
# libedgefirst_tensor or libedgefirst_decoder.
[dependencies]
edgefirst-tracker = { version = "0.41.0", path = "../tracker", default-features = false }
uuid = { version = "1.23.3", features = ["v4"] }
edgefirst-decoder-abi = { path = "../decoder-abi" }
errno = "0.3"
libc = "0.2.186"
log = "0.4.33"

[build-dependencies]
cbindgen = "0.29"

# Excluded from the workspace; the root's lints and profiles are restated here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

# Shipped artifacts only (release branches): whole-program LTO in one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Test and CI builds: release optimisation with thin LTO.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"

# Standalone package: stops cargo's upward workspace search.
[workspace]
resolver = "3"
