# EdgeFirst HAL workspace Cargo config.

# macOS targets.
#
# `target-feature` on aarch64: fp16, dotprod (sdot/udot) and i8mm
# (smmla/ummla/usmmla).
#
# `strip=none` + `-Wl,-x`: rustc does not strip, and Apple's linker discards
# local symbols.
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "target-feature=+fp16,+dotprod,+i8mm",
    "-C", "strip=none",
    "-C", "link-arg=-Wl,-x",
]

[target.x86_64-apple-darwin]
rustflags = ["-C", "strip=none", "-C", "link-arg=-Wl,-x"]

# iOS targets (aarch64-apple-ios device, aarch64-apple-ios-sim simulator):
# the same strip flags as macOS, and no `target-feature`.
[target.aarch64-apple-ios]
rustflags = ["-C", "strip=none", "-C", "link-arg=-Wl,-x"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "strip=none", "-C", "link-arg=-Wl,-x"]

# Android targets (aarch64-linux-android device, x86_64-linux-android
# emulator). Minimum supported API level: 26 (Android 8.0).
#
# max-page-size=16384: links shared objects with 16 KB page alignment.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
