# Automatic Analysis (GitHub App) does not read sonar-project.properties.
# HAL is a Rust/Python project; C is ABI headers and a test harness.
# Without this file, AutoScan rates new *.c/*.h as C and fails the
# C reliability/security conditions on the quality gate.
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
# **/pyproject.toml: published library wheels, not apps. text:S8565 (missing
# uv/poetry lock) is a false positive here — see sonar-project.properties.
sonar.exclusions=**/target/**,**/build/**,**/venv/**,**/__pycache__/**,**/testdata/**,**/*.lock,**/*.c,**/*.h,**/pyproject.toml
