#
# Separate workspace for the benchmark comparison modules, excluded from the
# root HAL workspace.

[workspace]
resolver = "3"
members = [
    "common",
    "modules/dct_compare",
    "modules/rgb_parity",
    "modules/hal_cpu",
    "modules/rust_jpeg",
    "modules/hal_gl",
    "modules/hal_g2d",
    "modules/hal_v4l2_gl",
    "modules/hal_nvjpeg",
    "modules/hal_v4l2_cpu",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

# Optimized + debug symbols for on-target perf / chrome traces.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = true
