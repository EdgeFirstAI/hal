# Separate workspace for Article-1 comparison modules. Root HAL Cargo.toml
# lists `exclude = ["benchmarks"]` so these never enter `cargo build --workspace`.

[workspace]
resolver = "3"
members = [
    "common",
    "modules/dct_compare",
    "modules/hal_cpu",
    "modules/rust_jpeg",
    "modules/hal_gl",
    "modules/hal_g2d",
    "modules/hal_v4l2_gl",
    "modules/hal_nvjpeg",
    "modules/hal_v4l2_cpu",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

# Optimized + debug symbols for on-target perf / chrome traces (mirrors root).
[profile.release]
opt-level = 3
lto = "thin"
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true
